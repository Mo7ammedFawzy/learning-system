<!doctype html>
<!-- PROTOTYPE (throwaway). Question: in the course-style dashboard, which tabs (Q5) and how should tracks
     sit in the sidebar (Q6)? Flip with the floating bar, ?tabs=A|B|C&tracks=switcher|nested, or the keys
     ← → (tabs) and T (tracks). Data: window.DASHBOARD from dashboard-data.js (`node dashboard.mjs`).
     Model code copied from dashboard.html. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="dashboard-data.js"></script>
<style>
:root {
  --paper:#f4ebe0; --card:#f7efe4; --line:#ddd3c5; --edge:#46413b; --ink:#1d1b18; --muted:#6f6961;
  --green:#cfe3b2; --violet:#e7ddf5; --orange:#fcdcbd; --mint:#dff0de; --rust:#d0683a;
  --g0:#e6ddd0; --g1:#9be9a8; --g2:#40c463; --g3:#30a14e; --g4:#216e39;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
* { box-sizing:border-box; }
html { color-scheme:light; }
html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:14px/1.55 Inter,system-ui,sans-serif; }
code { font:12.5px var(--mono); background:#0000000d; padding:1px 5px; border-radius:4px; }
pre { background:#fffaf3; border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; }
pre code { background:none; padding:0; }
h1, h2, h3, .mono { font-family:var(--mono); }
.ar-summary { direction:rtl; text-align:right; margin:0; padding:8px 16px; background:var(--mint); border-bottom:1.2px solid var(--line); font-size:13.5px; }
.app { display:grid; grid-template-columns:248px minmax(0,1fr) 320px; height:calc(100vh - 38px); }
.app.wide { grid-template-columns:248px minmax(0,1fr); }
.app.wide #panel { display:none; }

/* pop buttons & cards — values measured from the reference */
.pop { font:500 13px var(--mono); border:1.2px solid var(--edge); background:var(--card); color:var(--ink); border-radius:8px; padding:5px 10px; cursor:pointer;
  box-shadow:inset 0 1px 0 #fff8, 1.5px 2.5px 0 #1d1b18; transition:transform .08s, box-shadow .08s; }
.pop.on { background:var(--green); }
.pop:active { transform:translate(1px,2px); box-shadow:none; }
.card { background:var(--card); border:1.2px solid var(--line); border-radius:12px; box-shadow:inset 0 1px 0 #ffffffa6, 0 10px 22px -16px rgba(80,60,35,.35); padding:14px 16px; }

/* sidebar */
#side { border-right:1.2px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--paper); }
.tabs { display:flex; gap:8px; padding:14px 12px 10px; flex-wrap:wrap; }
.pills { display:flex; gap:6px; padding:0 12px 10px; flex-wrap:wrap; }
.pills .pop { font-size:11.5px; padding:3px 8px; }
.tree { flex:1; overflow:auto; padding:2px 8px 12px; }
.fold > .fh { display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:8px; cursor:pointer; font:500 12.5px var(--mono); user-select:none; }
.fold > .fh:hover { filter:brightness(.97); }
.fh .chev { transition:transform .34s var(--ease); font-size:10px; width:10px; }
.fold.open > .fh .chev { transform:rotate(90deg); }
.fh .n { margin-left:auto; font-size:11px; color:var(--muted); }
.fh .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kids { display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s var(--ease); }
.fold.open > .kids { grid-template-rows:1fr; }
.kids > div { overflow:hidden; min-height:0; padding-left:12px; }
.fold { margin:3px 0; }
.trackf > .fh { background:transparent; border:1.2px solid var(--line); text-transform:capitalize; }
.tp { display:flex; align-items:center; gap:7px; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; }
.tp:hover { background:#0000000a; }
.tp.on { background:var(--card); box-shadow:inset 0 0 0 1.2px var(--edge); }
.tp .id { font:500 11px var(--mono); color:var(--muted); min-width:28px; }
.tp .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:9px; height:9px; border-radius:50%; flex:none; border:1px solid #0002; }
.due-mark { color:var(--rust); font-size:11px; }
.bar { padding:12px; border-top:1.2px solid var(--line); font:500 11.5px var(--mono); color:var(--muted); }
.bar .track-bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px; }
.bar .fill { height:100%; background:var(--g2); border-radius:99px; transition:width .34s var(--ease); }

/* stage */
#stage { position:relative; overflow:auto; min-width:0; padding:22px;
  background-color:var(--paper); background-image:radial-gradient(#cfc3b2 1px, transparent 1.2px); background-size:18px 18px; }
.fig { width:100%; height:calc(100% - 40px); min-height:420px; border:1.2px solid var(--line); border-radius:12px; background:#fff; display:block; }
.partbar { display:flex; gap:6px; margin-bottom:10px; }
.empty-state { max-width:520px; margin:12vh auto 0; text-align:center; }
.empty-state .big { font:700 48px var(--mono); color:var(--muted); }
.md { font-size:14px; max-width:820px; margin:0 auto; }
.md h1 { font-size:19px; } .md h2 { font-size:16px; margin-top:20px; } .md h3 { font-size:14.5px; }
.md table { border-collapse:collapse; margin:8px 0; font-size:13px; } .md td, .md th { border:1px solid var(--line); padding:4px 8px; text-align:left; }
.md [dir="rtl"] { text-align:right; }

/* right panel */
#panel { border-left:1.2px solid var(--line); overflow:hidden; padding:18px 16px 76px; background:var(--card); display:flex; flex-direction:column; min-height:0; font-size:13px; }
#panel > * { flex:none; }
.clamp { display:-webkit-box; -webkit-line-clamp:var(--n); -webkit-box-orient:vertical; overflow:hidden; }
.one { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12.5px; }
#panel .fade { flex:1 1 0; min-height:2.6em; overflow:hidden; font-size:12.5px; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
.link { background:none; border:0; padding:4px 0; font:600 12px var(--mono); color:var(--rust); cursor:pointer; text-align:left; }
#reader { position:fixed; top:38px; right:0; bottom:0; width:min(620px,100vw); background:var(--card); border-left:1.2px solid var(--edge); box-shadow:-14px 0 30px -18px rgba(80,60,35,.5);
  transform:translateX(105%); transition:transform .34s var(--ease); z-index:60; overflow:auto; padding:18px 22px 80px; }
#reader.open { transform:none; }
#reader .close { float:right; }
.k { font:500 11px var(--mono); color:var(--muted); text-transform:uppercase; margin:14px 0 4px; }
.pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:1px 8px; border-radius:99px; background:#0000000d; color:var(--muted); white-space:nowrap; }
.pill.due { background:#f6d9cb; color:var(--rust); font-weight:600; }
.weak { background:var(--orange); border-radius:8px; padding:8px 12px; font-size:13px; }
.muted { color:var(--muted); }
ul.parts { margin:0; padding-left:16px; font-size:12.5px; }

/* progress view (copied from dashboard.html, resized) */
.ptrack { display:grid; grid-template-columns:80px 1fr; gap:10px; margin-bottom:16px; }
.ptrack b { text-transform:capitalize; font-family:var(--mono); }
.secs { display:flex; flex-wrap:wrap; gap:10px 12px; }
.sec-l { font:500 10px var(--mono); color:var(--muted); text-transform:uppercase; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cells { display:flex; flex-wrap:wrap; gap:4px; }
.pt { width:72px; height:72px; border-radius:6px; padding:3px 5px; display:flex; flex-direction:column; cursor:pointer; transition:transform .1s; }
.pt:hover { transform:scale(1.06); position:relative; z-index:2; }
.pt-id { font:700 18px/1.1 var(--mono); text-align:center; margin:8px 0 2px; }
.pt-name { font-size:8.5px; line-height:1.15; text-align:center; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.cal { width:14px; height:14px; border-radius:3px; cursor:pointer; }
.due-row { display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; }
.due-row:hover { background:#0000000a; }
.cols { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start; }

/* Q8: figure in the reference style */
.f10 { font-family:var(--mono); max-width:1100px; margin:0 auto; }
.f10-crumb { font-size:12px; color:var(--muted); }
.f10-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.f10-head h1 { margin:4px 0; font-size:28px; letter-spacing:-.5px; }
.f10-chips { display:flex; gap:6px; } .f10-chips span { font-size:12px; padding:3px 10px; border:1.2px solid var(--edge); border-radius:99px; box-shadow:1px 1.5px 0 #1d1b18; }
.f10-sub { color:var(--muted); font-size:12.5px; margin-bottom:12px; }
.f10-card { background:var(--card); border:1.2px solid var(--line); border-radius:12px; box-shadow:inset 0 1px 0 #ffffffa6, 0 10px 22px -16px rgba(80,60,35,.35); padding:12px 14px; margin-bottom:12px;
  background-image:repeating-linear-gradient(30deg, #e6dccd 0 1px, transparent 1px 26px), repeating-linear-gradient(150deg, #e6dccd 0 1px, transparent 1px 26px); }
.f10-top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.f10-tiles { display:flex; gap:8px; flex-wrap:wrap; }
.mt { background:#fffaf2; border:1.2px solid var(--line); border-left:4px solid #5fae5a; border-radius:8px; padding:5px 12px; min-width:120px; }
.mt-k { font-size:10px; text-transform:uppercase; color:var(--muted); } .mt-v { font-size:16px; font-weight:700; }
.f10-legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
.f10-legend i { display:inline-block; width:10px; height:10px; border-radius:50%; border:1.2px solid #1d1b18; margin-right:5px; vertical-align:-1px; }
.f10-tl { background-image:none; font-size:12px; }
.tl { display:flex; justify-content:space-between; position:relative; margin-top:12px; }
.tl::before { content:""; position:absolute; left:5%; right:5%; top:13px; height:2px; background:var(--line); }
.tl-f { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; cursor:pointer; font:inherit; color:var(--muted); flex:1; }
.tl-n { width:27px; height:27px; border-radius:50%; border:1.5px solid var(--edge); background:var(--card); display:grid; place-items:center; color:var(--ink); }
.tl-f.done .tl-n { background:var(--mint); } .tl-f.cur .tl-n { background:var(--green); box-shadow:0 0 0 3px #cfe3b280; }
.tl-f.cur { color:var(--ink); font-weight:700; }

/* Q9: anatomy figure in the reference frame — the stage never scrolls */
#stage.fit { overflow:hidden; padding:16px 22px 70px; }
.fx { display:flex; flex-direction:column; height:100%; min-height:0; font-family:var(--mono); }
.fx-sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:Inter,system-ui,sans-serif; }
.fx-card { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; margin:0; }
.fx-frame { flex:1; min-height:0; width:100%; border:0; background:transparent; display:block; }
.fx .mt-k { text-transform:none; font-size:10.5px; }
.fx .mt-v { font-size:14px; }
.fx-nav { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted); }
.fx .f10-chips span, .fx .f10-chips button { font-size:11.5px; }
.fx-parts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 8px; font-size:11.5px; color:var(--muted); }
.fx-parts .pop { font-size:11.5px; padding:3px 10px; max-width:300px; display:flex; gap:6px; }
.fx-parts .pn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:400; }

/* the prototype switcher — not part of the design being judged */
#switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:1000; display:flex; align-items:center; gap:10px;
  background:#1d1b18; color:#fff; padding:7px 12px; border-radius:99px; box-shadow:0 8px 24px #0005; font:12px system-ui,sans-serif; }
#switcher button { background:#ffffff1a; color:#fff; border:0; padding:4px 9px; border-radius:99px; cursor:pointer; font:inherit; }
#switcher button.on { background:#fff; color:#1d1b18; font-weight:600; }
#switcher .lbl { opacity:.6; margin-left:4px; }
</style>
</head>
<body>
<p class="ar-summary">‫نموذج تجريبي للوحة بشكل الكورس: على الشمال الأقسام والمواضيع، في النص الـ figure أو الملخص، وعلى اليمين تفاصيل الموضوع. الشريط اللي تحت بيبدّل بين اختيارات التابات وطريقة عرض الـ tracks.‬</p>
<div class="app" id="app"><nav id="side"></nav><main id="stage"></main><aside id="panel"></aside></div>
<aside id="reader"></aside>
<div id="switcher"></div>
<script>
const D = window.DASHBOARD;
if (!D) { document.body.innerHTML = '<h1>No data yet</h1><p>Run <code>node dashboard.mjs</code> in the repo root, then reload.</p>'; throw new Error('dashboard-data.js missing'); }

// ---------------- the model (copied from dashboard.html) ----------------
const TODAY = new Date().toLocaleDateString('en-CA');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const tick = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const GREEN = ['var(--g0)', 'var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)'];
const STATUS = {
  'not-started': { label:'Not started', level:0 }, 'scratched': { label:'Scratched', level:1 },
  'in-progress': { label:'In progress', level:1 }, 'shaky': { label:'Done · shaky', level:2 },
  'ok': { label:'Done · ok', level:3 }, 'solid': { label:'Done · solid', level:4 },
};
const partIds = new Set([...D.completed.map(c => c.id), ...D.scratched.map(s => s.id), ...D.review.map(r => r.id),
  ...Object.keys(D.summaries), ...Object.keys(D.figures)]);
const byId = (list, id) => list.find(x => x.id === id);
function statusOf(topic) {
  if (topic.isCurrent) return 'in-progress';
  const conf = topic.parts.map(p => p.completed?.confidence).filter(Boolean);
  if (conf.length) return conf.includes('shaky') ? 'shaky' : conf.includes('ok') ? 'ok' : 'solid';
  return topic.parts.some(p => p.scratched) ? 'scratched' : 'not-started';
}
const TOPICS = [];
for (const track of D.tracks) for (const section of track.sections) for (const t of section.topics) {
  const parts = [...partIds].filter(p => p === t.id || new RegExp(`^${t.id}[a-z]$`).test(p)).sort().map(id => ({
    id, completed: byId(D.completed, id), scratched: byId(D.scratched, id), review: byId(D.review, id),
    summary: D.summaries[id], figure: D.figures[id], weak: D.weak.filter(w => w.topic === id),
  }));
  const cur = D.current[track.name] || '';
  const topic = { ...t, track: track.name, section: section.title, parts,
    isCurrent: new RegExp(`^Topic: ${t.id}[a-z]? `).test(cur) && !/Step: not started/.test(cur) };
  topic.status = statusOf(topic);
  topic.nextDue = parts.map(p => p.review?.due).filter(Boolean).sort()[0] || '';
  topic.due = !!topic.nextDue && topic.nextDue <= TODAY;
  topic.summaries = parts.filter(p => p.summary);
  topic.figures = parts.filter(p => p.figure);
  topic.weak = parts.flatMap(p => p.weak);
  TOPICS.push(topic);
}
const key = t => `${t.track}:${t.id}`;
const find = k => TOPICS.find(t => key(t) === k);
const isDone = t => STATUS[t.status].level >= 1 && t.status !== 'in-progress';
const sectionName = s => s.replace(/^Track /, '');
const lvl = t => STATUS[t.status].level;
const md = text => (window.marked ? marked.parse(text) : `<pre>${esc(text)}</pre>`).replace(/<(p|li|h[1-6]|td|blockquote)>/g, '<$1 dir="auto">');
const due = TOPICS.flatMap(t => t.parts.filter(p => p.review && p.review.due <= TODAY).map(p => ({ t, p }))).sort((a, b) => a.p.review.due.localeCompare(b.p.review.due));

// focused track: the one whose Current line is not "Paused"
const FOCUS = D.tracks.map(t => t.name).find(n => !/Paused/.test(D.current[n] || '')) || D.tracks[0].name;

// ---------------- calendar (copied) ----------------
const events = {};
const addEvent = (day, id, what) => (events[day] ||= []).push({ id, what, t: TOPICS.find(x => x.parts.some(p => p.id === id)) });
for (const c of D.completed) (c.date.match(/\d{4}-\d{2}-\d{2}/g) || []).forEach((d, i) => addEvent(d, c.id, i ? 'reviewed' : 'lesson'));
for (const s of D.scratched) addEvent(s.date, s.id, 'scratched');
for (const r of D.review) if (r.last) addEvent(r.last, r.id, 're-read');
function calendar() {
  const days = Object.keys(events).sort();
  const start = new Date((days[0] || TODAY) + 'T00:00'); start.setDate(start.getDate() - start.getDay());
  const end = new Date(TODAY + 'T00:00'); end.setDate(end.getDate() + 6 - end.getDay());
  const weeks = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 7)) weeks.push(new Date(d));
  const shown = weeks.slice(-16);
  const level = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
  return `<div style="display:inline-grid;grid-template-columns:20px repeat(${shown.length},14px);grid-template-rows:16px repeat(7,14px);gap:4px">
    ${shown.map((w, i) => `<div style="grid-row:1;grid-column:${i + 2};font-size:10px;color:var(--muted);white-space:nowrap">${i === 0 || shown[i - 1].getMonth() !== w.getMonth() ? w.toLocaleString('en', { month:'short' }) : ''}</div>`).join('')}
    ${'SMTWTFS'.split('').map((l, r) => `<div style="grid-row:${r + 2};grid-column:1;font-size:10px;color:var(--muted);line-height:14px">${l}</div>`).join('')}
    ${shown.flatMap((w, c) => [...Array(7)].map((_, r) => {
      const d = new Date(w); d.setDate(d.getDate() + r);
      const k = d.toLocaleDateString('en-CA'), n = (events[k] || []).length;
      return `<div class="cal" data-day="${k}" title="${k}: ${n} item${n === 1 ? '' : 's'}" style="grid-row:${r + 2};grid-column:${c + 2};background:${k > TODAY ? 'transparent' : GREEN[level(n)]};${k === TODAY ? 'outline:2px solid var(--rust);outline-offset:1px;' : ''}"></div>`;
    })).join('')}
  </div>`;
}

// ---------------- prototype state ----------------
const q = new URLSearchParams(location.search);
const V = { tabs: ['A','B','C'].includes(q.get('tabs')) ? q.get('tabs') : 'A', tracks: q.get('tracks') === 'switcher' ? 'switcher' : 'nested',
  figs: ['anatomy','redesign'].includes(q.get('figs')) ? q.get('figs') : 'course' };
// Q7: figures re-coloured to the course palette by overriding the anatomy kit's tokens (same drawings, warm paper, dark edges).
const COURSE_FIG_CSS = `html .iso[data-theme="light"], html [data-theme="light"] .iso {
  --anatomy-page:#f4ebe0;--anatomy-card:#f7efe4;--anatomy-paper:#f7efe4;--anatomy-text:#4a453f;--anatomy-strong:#1d1b18;--anatomy-muted:#6f6961;
  --anatomy-face:#fbf5ec;--anatomy-top:#fbf5ec;--anatomy-lit-top:#fffaf2;--anatomy-lit-shade:#f1e7da;
  --anatomy-shade-0:#e3d6c4;--anatomy-shade-1:#eadfcf;--anatomy-shade-2:#f0e6d8;--anatomy-shade-3:#f5ede2;
  --anatomy-hi:#1d1b18;--anatomy-mid:#46413b;--anatomy-lo:#8a7f72;--anatomy-faint:#ddd3c5;--anatomy-lit:#1d1b18;
  --anatomy-halo:#a08c70;--anatomy-halo-opacity:.28;--anatomy-dot:#46413b;
  --anatomy-red:#d0683a;--anatomy-green:#5f8f3a;--anatomy-blue:#7a5fb5;
  --anatomy-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--anatomy-weight:1.2px;
  --anatomy-lift:inset 0 1px 0 #ffffffa6,0 0 0 1.2px #ddd3c5,0 10px 22px -16px rgba(80,60,35,.35); }
html, body { background:#f4ebe0 !important; }`;
// ---------------- Q8: one figure redrawn in the reference style (topic 10 only) ----------------
const GRN = ['#cfe3b2', '#b5d293', '#9cc077'], BLU = ['#d3e3f7', '#b5cdee', '#99b7e2'], VIO = ['#e7ddf5', '#d2c2ee', '#bba8e2'], ORG = ['#fcdcbd', '#f6c493', '#eeac70'];
const NODES = {
  S: { x:150, y:330, cyl:true, c:VIO }, F: { x:340, y:220, c:GRN, label:'filter', sub:'x > 4' },
  M: { x:530, y:330, c:BLU, label:'map', sub:'x * 10' }, T: { x:720, y:220, c:ORG, label:'findFirst', sub:'terminal op' },
  R: { x:880, y:310, cyl:true, c:GRN },
};
const at = n => ({ x: NODES[n].x, y: NODES[n].y + 28 });
const pill = (x, y, text, bold) => { const w = text.length * 7.3 + 24;

  const short = p => `<div class="one"><b class="mono">${p.id}</b> ${p.completed ? `${esc(p.completed.confidence)} · ${esc(p.completed.date.slice(0, 10))}` : p.scratched ? 'scratched' : '—'}${p.review ? ` · review ${p.review.due.slice(5)}` : ''}</div>`;
  const weakFull = t.weak.length ? `<div class="weak"><ul style="margin:0;padding-left:16px">${t.weak.map(w => `<li>${tick(w.label)} <span class="pill">${w.held}/2 held</span></li>`).join('')}</ul></div>` : '';
  S.reader = () => `<div class="muted mono" style="font-size:11px;text-transform:capitalize">${t.track} · ${esc(sectionName(t.section))}</div>
    <h2 style="margin:2px 0 8px;font-size:18px">${t.id} · ${esc(t.title)}</h2>
    <div class="k">Objective</div><div>${tick(t.objective)}</div>
    ${meta ? `<div class="k">Parts</div><ul class="parts">${meta}</ul>` : ''}
    ${weakFull ? `<div class="k">Weak spots</div>${weakFull}` : ''}
    ${document.getElementById('fx-caption')?.textContent ? `<div class="k">What the figure shows</div><p style="margin:0">${esc(document.getElementById('fx-caption').textContent)}</p>` : ''}
    ${fig && t.summaries.length ? `<div class="k">Summary card</div>${cardsOf(t)}` : ''}`;
  panel.innerHTML = `<div class="muted mono" style="font-size:11px;text-transform:capitalize">${t.track} · ${esc(sectionName(t.section))}</div>
    <h2 style="margin:2px 0 8px;font-size:17px">${t.id} · ${esc(t.title)} ${t.star === 'core' ? '★' : t.star === 'senior' ? '☆' : ''}</h2>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${statusPill(t)}${duePill(t)}</div>
    <div class="k">Objective</div><div class="clamp" style="--n:4">${tick(t.objective)}</div>
    <div class="k">Parts</div>${t.parts.length ? t.parts.slice(0, 4).map(short).join('') + (t.parts.length > 4 ? `<div class="muted">+${t.parts.length - 4} more</div>` : '') : '<div class="muted">No parts recorded.</div>'}
    ${t.weak.length ? `<div class="k">Weak spots · ${t.weak.length}</div><div class="weak">${t.weak.slice(0, 2).map(w => `<div class="one">• ${tick(w.label)}</div>`).join('')}${t.weak.length > 2 ? `<div class="muted">+${t.weak.length - 2} more</div>` : ''}</div>` : ''}
    ${fig && V.figs === 'course' ? '<div class="k">What the figure shows</div><div id="fx-caption" class="fade"></div>' : '<div style="flex:1"></div>'}
    <button class="link" data-reader>Read more ›</button>
    ${fig && t.summaries.length ? `<button class="pop on" data-reader style="width:100%;margin-top:8px">Open summary card ›</button>` : ''}`;
}
const cell = t => `<div class="pt" data-open="${key(t)}" style="background:${GREEN[lvl(t)]};color:${lvl(t) >= 3 ? '#fff' : '#1f3d27'};${t.due ? 'outline:2px solid var(--rust);outline-offset:1px;' : ''}">
  <div class="pt-id">${t.id}</div><div class="pt-name">${esc(t.title)}</div></div>`;
const dueList = () => due.map(({ t, p }) => `<div class="due-row" data-open="${key(t)}"><code>${p.id}</code><span style="flex:1">${esc(t.title)}</span><span class="pill">${p.review.due === TODAY ? 'today' : p.review.due}</span></div>`).join('') || '<p class="muted">Nothing due.</p>';
function renderProgress() {
  appEl.classList.add('wide');
  stage.innerHTML = `<div class="cols"><section class="card" style="min-width:0"><h2 style="margin:0 0 10px;font-size:15px">Every topic</h2>
      ${D.tracks.map(track => { const list = TOPICS.filter(t => t.track === track.name); return `
        <div class="ptrack"><div><b>${track.name}</b><div class="muted" style="font-size:11px">${list.filter(isDone).length}/${list.length}</div></div>
          <div class="secs">${track.sections.map(s => { const ts = list.filter(t => t.section === s.title); return `<div style="max-width:${Math.min(ts.length, 5) * 76}px">
            <div class="sec-l" title="${esc(s.title)}">${esc(sectionName(s.title))}</div><div class="cells">${ts.map(cell).join('')}</div></div>`; }).join('')}</div></div>`; }).join('')}
    </section>
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="card" style="overflow-x:auto"><h2 style="margin:0 0 8px;font-size:15px">Study days</h2>${calendar()}<div class="day muted" style="margin-top:8px;font-size:12.5px">Click a day to see what you did.</div></section>
      ${V.tabs === 'B' ? `<section class="card"><h2 style="margin:0 0 6px;font-size:15px">Due for review <span class="pill due">${due.length}</span></h2><div style="max-height:300px;overflow:auto">${dueList()}</div></section>` : ''}
    </div></div>`;
}
function renderReview() {
  appEl.classList.add('wide');
  stage.innerHTML = `<section class="card" style="max-width:760px;margin:0 auto"><h2 style="margin:0 0 6px;font-size:15px">Due for review <span class="pill due">${due.length}</span></h2>${dueList()}</section>`;
}
function renderCheats() {
  appEl.classList.add('wide');
  const sheets = Object.entries(D.summaries).filter(([, s]) => s.kind === 'cheat sheet');
  stage.innerHTML = sheets.map(([id, s]) => `<section class="card" style="max-width:860px;margin:0 auto 16px"><div class="md"><span class="pill">${id} · cheat sheet</span>${md(s.md)}</div></section>`).join('') || '<p class="muted">No cheat sheets yet.</p>';
}
function render() {
  cancelAnimationFrame(F10.raf);
  if (!TABSETS[V.tabs].includes(S.tab)) S.tab = 'Learn';
  renderSide();
  ({ Learn: renderLearn, Progress: renderProgress, Review: renderReview, 'Cheat sheets': renderCheats })[S.tab]();
  stage.scrollTop = 0;
  renderSwitcher();
}
function openTopic(t) {
  S.open = t; S.part = null; S.tab = 'Learn'; S.track = t.track; openFoldsFor(t);
  store.set('proto-v2-last', key(t));
  render();
  side.querySelector('.tp.on')?.scrollIntoView({ block: 'nearest' });
}

// ---------------- events ----------------
document.addEventListener('click', e => {
  const reader = document.getElementById('reader');
  if (e.target.closest('[data-reader]')) { reader.innerHTML = `<button class="pop close" data-close>✕</button>${S.reader()}`; reader.scrollTop = 0; return reader.classList.add('open'); }
  if (e.target.closest('[data-close]') || (reader.classList.contains('open') && !e.target.closest('#reader'))) reader.classList.remove('open');
  const el = e.target.closest('[data-open],[data-fold],[data-tab],[data-track],[data-part],[data-v],[data-frame],[data-f10],[data-key],.cal');
  if (!el) return;
  if (el.dataset.key) { // ◀ ▶ press the figure's own arrow keys
    const f = stage.querySelector('.fx-frame');
    try { const d = f.contentDocument, tgt = d.querySelector('.iso-stage') || d.body; tgt.focus();
      tgt.dispatchEvent(new f.contentWindow.KeyboardEvent('keydown', { key: el.dataset.key, bubbles: true })); } catch {}
    return;
  }
  if (el.dataset.frame) { F10.frame = +el.dataset.frame; F10.t = 0; return renderLearn(); }
  if (el.dataset.f10 === 'replay') { F10.t = 0; F10.paused = false; return renderLearn(); }
  if (el.dataset.f10 === 'pause') { F10.paused = !F10.paused; el.textContent = F10.paused ? '▶ Play' : '❚❚ Pause'; return; }
  if (el.dataset.open) return openTopic(find(el.dataset.open));
  if (el.dataset.fold !== undefined && e.target.closest('.fh')?.parentElement === el) {
    // toggle in place so the 0fr→1fr transition plays (a re-render would skip it)
    const k = el.dataset.fold; S.folds.has(k) ? S.folds.delete(k) : S.folds.add(k); el.classList.toggle('open'); return;
  }
  if (el.dataset.tab) { S.tab = el.dataset.tab; return render(); }
  if (el.dataset.track) { S.track = el.dataset.track; return renderSide(); }
  if (el.dataset.part) { S.part = el.dataset.part; return renderLearn(); }
  if (el.dataset.v) { const [k, v] = el.dataset.v.split('='); V[k] = v; return setVariant(); }
  if (el.classList.contains('cal')) {
    const list = events[el.dataset.day] || [];
    stage.querySelector('.day').innerHTML = `<b style="color:var(--ink)">${el.dataset.day}</b> — ` + (list.length
      ? list.map(x => `<span class="pill" ${x.t ? `data-open="${key(x.t)}" style="cursor:pointer"` : ''}>${x.id} · ${x.what}</span>`).join(' ') : 'nothing recorded.');
  }
});
function setVariant() {
  const u = new URL(location.href); u.searchParams.set('tabs', V.tabs); u.searchParams.set('tracks', V.tracks); u.searchParams.set('figs', V.figs);
  history.replaceState(null, '', u); render();
}
function renderSwitcher() {
  document.getElementById('switcher').innerHTML = `<span class="lbl">Tabs</span>${['A','B','C'].map(k => `<button class="${V.tabs === k ? 'on' : ''}" data-v="tabs=${k}" title="${TABSETS[k].join(' · ')}">${k}</button>`).join('')}
    <span class="lbl">${TABSETS[V.tabs].join(' · ')}</span>
    <span class="lbl" style="margin-left:10px">Tracks</span>${['switcher','nested'].map(k => `<button class="${V.tracks === k ? 'on' : ''}" data-v="tracks=${k}">${k}</button>`).join('')}
    <span class="lbl" style="margin-left:10px">Figures</span>${['anatomy','course','redesign'].map(k => `<button class="${V.figs === k ? 'on' : ''}" data-v="figs=${k}">${k}</button>`).join('')}`;
}
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'Escape') return document.getElementById('reader').classList.remove('open');
  const ks = ['A','B','C'];
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { V.tabs = ks[(ks.indexOf(V.tabs) + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; setVariant(); }
  if (e.key === 't' || e.key === 'T') { V.tracks = V.tracks === 'nested' ? 'switcher' : 'nested'; setVariant(); }
});

openFoldsFor(S.open);
render();
</script>
</body>
</html>
