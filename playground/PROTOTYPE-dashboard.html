// ======================= E · Trail (creative) =======================
function VariantE(root) {
  let track = D.tracks[0].name;
  const draw = () => {
    const list = trackTopics(track), cols = 6, W = 960, sx = 150, sy = 128, x0 = 105, y0 = 80;
    const pos = list.map((t, i) => { const r = Math.floor(i / cols), c = i % cols; return { t, x: x0 + (r % 2 ? cols - 1 - c : c) * sx, y: y0 + r * sy, r }; });
    const H = y0 + Math.ceil(list.length / cols) * sy;
    const seg = (a, b) => a.r === b.r ? `M${a.x},${a.y} L${b.x},${b.y}` : `M${a.x},${a.y} C${a.x + (a.r % 2 ? -90 : 90)},${a.y} ${b.x + (a.r % 2 ? -90 : 90)},${b.y} ${b.x},${b.y}`;
    const done = t => t.status !== 'not-started';
    const paths = pos.slice(1).map((b, i) => { const a = pos[i]; return `<path d="${seg(a, b)}" fill="none" stroke="${done(a.t) && done(b.t) ? '#8a7a5c' : '#dcd5c5'}" stroke-width="${done(a.t) && done(b.t) ? 7 : 5}" stroke-linecap="round" ${done(a.t) && done(b.t) ? '' : 'stroke-dasharray="2 10"'}/>`; }).join('');
    const flags = pos.filter((p, i) => i === 0 || p.t.section !== pos[i - 1].t.section).map(p => `
      <g transform="translate(${p.x - 26},${p.y - 58})"><line x1="0" y1="0" x2="0" y2="34" stroke="#6b5b3e" stroke-width="2"/><path d="M0,0 L18,5 L0,10 Z" fill="var(--accent)"/>
      <text x="4" y="-6" font-size="11.5" font-weight="600" fill="#6b5b3e">${esc(sectionName(p.t.section).slice(0, 34))}</text></g>`).join('');
    const nodes = pos.map(({ t, x, y }) => `<g data-open="${t.track}:${t.id}" transform="translate(${x},${y})"><title>${esc(t.id + ' · ' + t.title)}</title>
      ${t.due ? '<circle r="27" fill="none" stroke="var(--due)" stroke-width="3" style="animation:pulse 1.6s infinite"/>' : ''}
      <circle r="21" fill="${t.status === 'not-started' ? '#fff' : STATUS[t.status].color}" stroke="${t.status === 'not-started' ? '#cfc7b4' : '#fff'}" stroke-width="3"/>
      <text text-anchor="middle" dy="4" font-size="11.5" font-weight="700" font-family="ui-monospace,Consolas,monospace" fill="${t.status === 'not-started' ? '#8a8270' : '#fff'}">${t.id}</text>
      <text text-anchor="middle" y="40" font-size="11" fill="#5a5345">${esc(t.title.length > 22 ? t.title.slice(0, 21) + '…' : t.title)}</text>
      ${t.figures.length ? '<text x="16" y="-14" font-size="12">🖼</text>' : ''}
      ${t.isCurrent ? '<text x="-12" y="-26" font-size="22">🚩</text>' : ''}</g>`).join('');
    root.innerHTML = `<div class="wrap" style="max-width:1040px">
      <div class="head"><h1>The trail</h1>
        <div style="display:flex;gap:6px">${D.tracks.map(t => `<button data-track="${t.name}" style="border:1px solid var(--line);background:${t.name === track ? 'var(--text)' : 'var(--card)'};color:${t.name === track ? '#fff' : 'var(--text)'};border-radius:99px;padding:4px 12px;cursor:pointer;text-transform:capitalize">${t.name}</button>`).join('')}</div></div>
      ${legend('<span>🚩 current · 🖼 figure</span>')}
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px;background:#fbf7ee;border:1px solid #ece4d2;border-radius:16px">${paths}${flags}${nodes}</svg></div>`;
  };
  draw();
  root.onclick = e => { const b = e.target.closest('[data-track]'); if (b) { track = b.dataset.track; draw(); } };
}

// ======================= F · Star chart (creative) =======================
function VariantF(root) {
  const W = 1100, cw = 275, ch = 210;
  const sky = track => {
    const secs = sectionsOf(track), rows = Math.ceil(secs.length / 4);
    const body = secs.map((s, k) => {
      const ox = (k % 4) * cw, oy = Math.floor(k / 4) * ch, n = s.topics.length, ph = seeded(s.title) * 6;
      const pts = s.topics.map((t, i) => ({ t,
        x: ox + 40 + (n > 1 ? i / (n - 1) : .5) * (cw - 80) + (seeded(t.id + 'x') - .5) * 30,
        y: oy + 105 + Math.sin(i * 1.4 + ph) * 48 + (seeded(t.id + 'y') - .5) * 26 }));
      const lines = pts.slice(1).map((b, i) => `<line x1="${pts[i].x}" y1="${pts[i].y}" x2="${b.x}" y2="${b.y}" stroke="${isDone(pts[i].t) && isDone(b.t) ? '#3a3475' : '#cfcbe6'}" stroke-width="${isDone(pts[i].t) && isDone(b.t) ? 1.6 : 1}" ${isDone(pts[i].t) && isDone(b.t) ? '' : 'stroke-dasharray="3 4"'}/>`).join('');
      const stars = pts.map(({ t, x, y }) => { const r = t.star === 'core' ? 9 : t.star === 'senior' ? 7.5 : 6, lit = t.status !== 'not-started';
        return `<g data-open="${t.track}:${t.id}" transform="translate(${x},${y})"><title>${esc(t.id + ' · ' + t.title + ' — ' + STATUS[t.status].label)}</title>
          ${lit ? `<circle r="${r + 7}" fill="${STATUS[t.status].color}" opacity=".16"/>` : ''}
          ${t.due ? `<circle r="${r + 5}" fill="none" stroke="var(--due)" stroke-width="1.6" style="animation:pulse 1.6s infinite"/>` : ''}
          <path d="M0,${-r} L${r * .28},${-r * .28} L${r},0 L${r * .28},${r * .28} L0,${r} L${-r * .28},${r * .28} L${-r},0 L${-r * .28},${-r * .28} Z" fill="${lit ? STATUS[t.status].color : '#fff'}" stroke="${lit ? 'none' : '#a9a4c9'}" stroke-width="1.2"/>
          <text y="${r + 14}" text-anchor="middle" font-size="10" fill="#6a6590" font-family="ui-monospace,Consolas,monospace">${t.id}</text>
          ${t.isCurrent ? `<circle r="${r + 11}" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="2 3"/>` : ''}</g>`; }).join('');
      return `<text x="${ox + 22}" y="${oy + 30}" font-size="12.5" letter-spacing="2" fill="#3a3475" font-family="Georgia,serif">${esc(sectionName(s.title).toUpperCase().slice(0, 34))}</text>
        <text x="${ox + 22}" y="${oy + 46}" font-size="11" fill="#8f8ab0" font-family="Georgia,serif" font-style="italic">${s.topics.filter(isDone).length} of ${n} lit</text>${lines}${stars}`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${rows * ch}" style="width:100%;display:block">${body}</svg>`;
  };
  root.innerHTML = `<div class="wrap">
    <div class="head"><h1 style="font-family:Georgia,serif;font-weight:400;letter-spacing:.02em">A chart of the known sky</h1>${legend('<span>★ size = how often asked</span>')}</div>
    ${D.tracks.map(t => `<section style="margin-bottom:18px;background:radial-gradient(#fdfcff,#f3f1fb);border:1px solid #e3e0f2;border-radius:16px;padding:10px 6px;
        background-image:radial-gradient(#e9e6f6 1px,transparent 1px);background-size:22px 22px">
      <h2 style="font-family:Georgia,serif;font-weight:400;font-size:19px;margin:4px 16px;text-transform:capitalize;color:#3a3475">${t.name}</h2>${sky(t)}</section>`).join('')}
  </div>`;
}

    const p = (r, a) => `${(r * Math.sin(a)).toFixed(2)},${(-r * Math.cos(a)).toFixed(2)}`, L = a2 - a1 > Math.PI ? 1 : 0;
    return `M${p(r2, a1)} A${r2},${r2} 0 ${L} 1 ${p(r2, a2)} L${p(r1, a2)} A${r1},${r1} 0 ${L} 0 ${p(r1, a1)} Z`;
  };
  const ring = track => {
    const list = trackTopics(track.name), n = list.length, step = 2 * Math.PI / n, gap = Math.min(.012, step * .15);
    let i = 0;
    const secs = sectionsOf(track).map((s, k) => {
      const a1 = i * step; i += s.topics.length; const a2 = i * step;
      const done = s.topics.filter(isDone).length / s.topics.length;
      return `<path d="${arc(62, 98, a1 + gap, a2 - gap)}" fill="${k % 2 ? '#e4e1f3' : '#d6d1ee'}"><title>${esc(sectionName(s.title))} — ${s.topics.filter(isDone).length}/${s.topics.length}</title></path>
        ${done ? `<path d="${arc(62, 62 + 36 * done, a1 + gap, a2 - gap)}" fill="var(--accent)" opacity=".55" pointer-events="none"/>` : ''}`;
    }).join('');
    const tops = list.map((t, j) => `<path data-open="${t.track}:${t.id}" d="${arc(102, t.star === 'core' ? 158 : 146, j * step + gap, (j + 1) * step - gap)}"
      fill="${t.status === 'not-started' ? '#ebe9e2' : STATUS[t.status].color}" ${t.due ? 'stroke="var(--due)" stroke-width="2.5"' : t.isCurrent ? 'stroke="var(--accent)" stroke-width="2.5"' : ''}/>`).join('');
    const pct = Math.round(list.filter(isDone).length / n * 100);
    return `<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center">
      <svg viewBox="-170 -170 340 340" style="width:100%;max-width:380px">${secs}${tops}
        <text text-anchor="middle" y="-6" font-size="26" font-weight="700" fill="var(--text)">${pct}%</text>
        <text text-anchor="middle" y="16" font-size="13" fill="var(--muted)" style="text-transform:capitalize">${track.name}</text></svg></div>`;
  };
  root.innerHTML = `<div class="wrap" style="max-width:1100px">
    <div class="head"><h1>Rings</h1>${legend('<span>inner ring = sections, filled by progress · outer = topics, longer = asked more</span>')}</div>${hoverBar()}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">${D.tracks.map(ring).join('')}</div>
  </div>`;
  wireHover(root);
}

// ======================= round 4: from the user's two reference images =======================
// One colour, five shades: how far along a topic is, not which kind of status it has.
const LEVEL = { 'not-started':0, 'scratched':1, 'in-progress':1, 'shaky':2, 'ok':3, 'solid':4 };
const LEVEL_NAMES = ['Not started', 'Scratched', 'Done · shaky', 'Done · ok', 'Done · solid'];
const shadeLegend = shades => `<div class="legend">${shades.map((c, i) => `<span><span style="width:14px;height:14px;border-radius:3px;background:${c};display:inline-block"></span>${LEVEL_NAMES[i]}</span>`).join('')}
  <span><span class="dot" style="background:var(--due)"></span>Review due</span></div>`;

// ---------- F1 · Fields: a card per section, a grid of plain shaded plots ----------
function VariantF1(root) {
  const OR = ['#fdeedd', '#fbd9b0', '#f9c07f', '#f6a54a', '#f28c0f'];
  root.innerHTML = `<div class="wrap">
    <div class="head" style="justify-content:space-between"><h1>Fields</h1>${shadeLegend(OR)}</div>${hoverBar()}
    ${D.tracks.map(track => { const list = trackTopics(track.name); return `
      <h2 style="font-size:17px;text-transform:capitalize;margin:16px 0 8px">${track.name} <span style="font-weight:400;font-size:13px;color:var(--muted)">${list.filter(isDone).length}/${list.length}</span></h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">${sectionsOf(track).map(s => `
        <div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px">
          <div style="background:#efefef;border-radius:5px;text-align:center;font-size:12.5px;font-weight:600;padding:3px 6px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(s.title)}">${esc(sectionName(s.title))}</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">${s.topics.map(t => `
            <div class="plot" data-open="${t.track}:${t.id}" style="background:${OR[LEVEL[t.status]]};color:${LEVEL[t.status] >= 3 ? '#fff' : '#a0622a'};${t.isCurrent ? 'box-shadow:inset 0 0 0 2px var(--accent);' : ''}">
              <span>${t.id}</span>${t.due ? '<i></i>' : ''}</div>`).join('')}</div>
        </div>`).join('')}</div>`; }).join('')}
  </div>
  <style>.plot{ position:relative; aspect-ratio:1; border-radius:5px; transition:transform .1s }
    .plot:hover{ transform:scale(1.07) }
    .plot span{ position:absolute; left:5px; bottom:3px; font:600 10px ui-monospace,Consolas,monospace; opacity:.8 }
    .plot i{ position:absolute; right:4px; top:4px; width:7px; height:7px; border-radius:50%; background:var(--due) }</style>`;
  wireHover(root);
}

// ---------- F2 · Activity: study calendar on top, every topic as a green cell below ----------
const GR = ['#ebedf0', '#9be9a8', '#40c463', '#30a14e', '#216e39'];
function VariantF2(root) {
  const cal = activityCalendar();
  const matrix = track => { const list = trackTopics(track.name); return `
    <div style="display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;margin-bottom:14px">${trackHead(track, list)}
      <div style="display:flex;flex-direction:column;gap:4px">${sectionsOf(track).map(s => `
        <div style="display:flex;align-items:center;gap:4px"><div style="width:190px;flex:none;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(s.title)}">${esc(sectionName(s.title))}</div>
          ${s.topics.map(t => `<div class="gc" data-open="${t.track}:${t.id}" style="background:${GR[LEVEL[t.status]]};${t.isCurrent ? 'outline:2px solid var(--accent);outline-offset:1px;' : ''}">${t.due ? '<i></i>' : ''}</div>`).join('')}
        </div>`).join('')}</div></div>`; };
  root.innerHTML = `<div class="wrap">
    <div class="head"><h1>Activity</h1>${cal.stats}</div>
    ${cal.html}
    <section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px">
      <div class="head" style="margin-bottom:6px"><h2 style="margin:0;font-size:16px">Every topic</h2>${shadeLegend(GR)}</div>${hoverBar()}
      ${D.tracks.map(matrix).join('')}
    </section>
  </div>
  <style>.gc{ position:relative; width:18px; height:18px; border-radius:4px; flex:none; transition:transform .1s } .gc:hover{ transform:scale(1.25) }
    .gc i{ position:absolute; right:-2px; top:-2px; width:7px; height:7px; border-radius:50%; background:var(--due); border:1px solid #fff }</style>`;
  wireHover(root);
  cal.wire(root);
}

// ---------- M · Combined: F2's calendar on top, B3b's periodic cells below ----------
function VariantM(root) {
  const cal = activityCalendar();
  // Same green scale as the calendar: darker = further along.
  const green = t => `background:${GR[LEVEL[t.status]]};color:${LEVEL[t.status] >= 3 ? '#fff' : '#1f3d27'};`;
  root.innerHTML = `<div class="wrap">
    <div class="head"><h1>Learning dashboard</h1>${cal.stats}</div>
    <div class="m-grid">
      <section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0">
        <div class="head" style="margin-bottom:6px"><h2 style="margin:0;font-size:16px">Every topic</h2>${shadeLegend(GR)}</div>
        <div style="font-size:12px;color:var(--muted);margin:-6px 0 4px">★ asked in most interviews · ▣ has figure · purple ring = current lesson</div>${hoverBar()}
        ${periodicCells(green)}
      </section>
      <aside class="m-side">${cal.html}</aside>
    </div>
  </div>
  <style>.m-grid{ display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start }
    .m-side{ position:sticky; top:12px }
    @media (max-width:900px){ .m-grid{ grid-template-columns:1fr } .m-side{ position:static; order:-1 } }</style>`;
  wireHover(root);
  cal.wire(root);
}

// The study calendar: { stats, html, wire(root) }. Days are shaded by how many things happened on them.
function activityCalendar() {
  // events per day: lessons done, re-reviews, scratches, review re-reads
  const ev = {};
  const add = (day, id, what) => { const t = TOPICS.find(x => x.parts.some(p => p.id === id)); (ev[day] ||= []).push({ id, what, t }); };
  for (const c of D.completed) (c.date.match(/\d{4}-\d{2}-\d{2}/g) || []).forEach((d, i) => add(d, c.id, i ? 'reviewed' : 'lesson'));
  for (const s of D.scratched) add(s.date, s.id, 'scratched');
  for (const r of D.review) if (r.last) add(r.last, r.id, 're-read');
  const days = Object.keys(ev).sort();
  const start = new Date((days[0] || TODAY) + 'T00:00'); start.setDate(start.getDate() - start.getDay());
  const end = new Date(TODAY + 'T00:00'); end.setDate(end.getDate() + (6 - end.getDay()));
  const weeks = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 7)) weeks.push(new Date(d));
  const iso = d => d.toLocaleDateString('en-CA');
  const lvl = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
  const cal = `<div style="display:inline-grid;grid-template-columns:22px repeat(${weeks.length},16px);grid-template-rows:18px repeat(7,16px);gap:4px">
    ${weeks.map((w, i) => { const prev = weeks[i - 1]; return `<div style="grid-row:1;grid-column:${i + 2};font-size:11px;color:var(--muted);white-space:nowrap">${!prev || prev.getMonth() !== w.getMonth() ? w.toLocaleString('en', { month:'short' }) : ''}</div>`; }).join('')}
    ${'SMTWTFS'.split('').map((l, r) => `<div style="grid-row:${r + 2};grid-column:1;font-size:11px;color:var(--muted);line-height:16px">${l}</div>`).join('')}
    ${weeks.flatMap((w, c) => [...Array(7)].map((_, r) => { const d = new Date(w); d.setDate(d.getDate() + r); const k = iso(d), n = (ev[k] || []).length, future = k > TODAY;
      return `<div class="cal" data-day="${k}" title="${k}: ${n} item${n === 1 ? '' : 's'}" style="grid-row:${r + 2};grid-column:${c + 2};background:${future ? 'transparent' : GR[lvl(n)]};${k === TODAY ? 'outline:2px solid var(--accent);outline-offset:1px;' : ''}"></div>`; })).join('')}
  </div>`;
  return {
    stats: `<span style="color:var(--muted);font-size:14px">${days.length} study days · ${days.reduce((n, d) => n + ev[d].length, 0)} things done</span>`,
    html: `<section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;overflow-x:auto">
      ${cal}
      <div style="display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px">Less ${GR.map(c => `<span style="width:12px;height:12px;border-radius:3px;background:${c}"></span>`).join('')} More</div>
      <div class="day" style="margin-top:10px;font-size:13.5px;min-height:22px;color:var(--muted)">Click a day to see what you did.</div>
      <style>.cal{ width:16px; height:16px; border-radius:4px; cursor:pointer } .cal:hover{ outline:1px solid #0004 }</style>
    </section>`,
    wire: root => root.addEventListener('click', e => {
      const c = e.target.closest('.cal'); if (!c) return;
      const list = ev[c.dataset.day] || [];
      root.querySelector('.day').innerHTML = `<b style="color:var(--text)">${c.dataset.day}</b> — ` + (list.length
        ? list.map(x => `<span class="pill" ${x.t ? `data-open="${x.t.track}:${x.t.id}"` : ''} style="margin:2px">${x.id} · ${x.what}</span>`).join('')
        : 'nothing recorded.');
    }),
  };
}

// ======================= switcher =======================
const VARIANTS = { M:['Calendar + periodic table', VariantM], B3b:['Periodic table', VariantB3b], F1:['Fields', VariantF1], F2:['Activity', VariantF2] };
// Earlier rounds (B, B2, B3, B3a, B3c, B3d, B4, E, F, G, S) are still in this file, off the switcher.
const keys = Object.keys(VARIANTS);
function show(k) {
  if (!VARIANTS[k]) k = 'M';
  const url = new URL(location.href); url.searchParams.set('variant', k);
  try { history.replaceState(null, '', url); } catch {}
  const app = document.getElementById('app');
  app.replaceWith(Object.assign(document.createElement('div'), { id:'app' }));
  VARIANTS[k][1](document.getElementById('app'));
  document.getElementById('label').textContent = `${k} (${VARIANTS[k][0]})`;
  show.cur = k;
  drawerEl.classList.remove('open');
  console.log('variant', k, { topics:TOPICS.length, byStatus:counts(TOPICS), due:TOPICS.filter(t => t.due).length });
}
const step = d => show(keys[(keys.indexOf(show.cur) + d + keys.length) % keys.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
show(new URLSearchParams(location.search).get('variant') || 'M');
</script>
