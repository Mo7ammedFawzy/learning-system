"2026-11-17","rung":7,"last":"2026-11-16"},{"id":"17","track":"java","due":"2026-11-17","rung":3,"last":"2026-11-16"}],"weak":[{"topic":"05a","label":"`equals(Object)` that casts without a type check. 05a step 3","held":0},{"topic":"05b","label":"Overload resolution read as declaration order","held":0},{"topic":"05b","label":"`@Override` left off a real override. 05a and 05b step 3","held":0},{"topic":"06a","label":"Class loading and initialisation treated as one thing","held":0},{"topic":"08a","label":"\"`LinkedList` inserts in the middle in O(1)\"","held":0},{"topic":"08a","label":"Gives \"slower\" where a Big O is asked","held":0},{"topic":"08a","label":"`LinkedHashSet` read as a `LinkedList`; `HashSet` order called known","held":0},{"topic":"08b","label":"`HashMap` vs `Hashtable`: never says \"synchronized\"","held":0},{"topic":"08b","label":"Treeification given to `Hashtable`","held":0},{"topic":"09a","label":"\"A sorted set keeps elements that compare as zero\". Two rounds, capped in 09a step 2","held":0},{"topic":"09a","label":"Subtraction comparator: overflow not seen. Two rounds, capped in 09a step 2","held":0},{"topic":"09a","label":"`compareTo` and `compare` swapped","held":0}],"summaries":{"10":{"kind":"cheatsheet","src":"scratch-10-12-14/CHEATSHEET.md","md":"## 10 — Streams (the half after 10a lambdas) ★\n- **Model:** a stream is a lazy assembly line. Intermediate ops (`filter`, `map`, `flatMap`, `sorted`) only add stations. Nothing runs until one terminal op (`collect`, `toList`, `forEach`, `findFirst`), and then each element goes through every station before the next one starts — which is why `findFirst` and `limit` can stop early.\n- **Trap:** `list.stream().peek(System.out::println).filter(...)` with no terminal op prints nothing. A stream is single-use: a second terminal op throws `IllegalStateException`.\n- **map vs flatMap:** `map` is one-to-one (`map(w -> w.split(\" \"))` gives `Stream\u003cString[]>`); `flatMap` maps each element to a stream and flattens (`flatMap(w -> Arrays.stream(w.split(\" \")))` gives `Stream\u003cString>`).\n- **parallelStream:** splits work over the common ForkJoinPool. Worth it only for large, CPU-bound, stateless work; wrong for I/O, small lists, or a lambda that writes shared state.\n- **Interview:** \"Intermediate operations are lazy and return a new stream; a terminal operation triggers the pipeline and produces the result. Elements flow one at a time, so `findFirst` or `limit` can short-circuit. `map` is one-to-one; `flatMap` maps each element to a stream and flattens the results.\"\n\n‫الستريم زي خط إنتاج كسلان، الفلتر والماب بيحطوا محطات بس.‬\n‫مفيش حاجة بتتحرك غير لما تيجي عملية تيرمينال زي الكوليكت أو الفايند فيرست.‬\n‫كل عنصر بيعدي على كل المحطات للآخر قبل ما العنصر اللي بعده يبدأ.‬\n‫الفخ: لو مفيش تيرمينال، الكود اللي جوه البيك والفلتر مش هيتنفذ خالص.‬\n‫الماب واحد قصاد واحد، والفلات ماب واحد قصاد كتير وبيفردهم في ستريم واحد.‬\n"},"11":{"kind":"cheatsheet","src":"scratch-07-11-13-15/CHEATSHEET.md","md":"## 11 — Optional and null discipline ★\n\n**In one line:** `Optional` is a return type that says \"there may be no result\" — not a field, not a parameter.\n\n**⚠️ Trap:** `orElse` evaluates its argument every time; `orElseGet` only when empty.\n\n```java\nuser.orElse(loadDefault());          // ❌ loadDefault() runs even when user is present\nuser.orElseGet(this::loadDefault);   // ✅ runs only when empty\n```\n\n**🎤 Interview:**\n1. Built for methods that may have no result, so the caller cannot forget the empty case.\n2. Chain `map` / `filter` / `orElse`, not `isPresent()` then `get()` — that is a null check in disguise.\n3. Not for fields (not `Serializable`), parameters, or collections — return an empty list instead.\n4. `orElse` is eager, `orElseGet` is lazy.\n\n### بالمصري\n\n‫الأوبشنال معمول للنتيجة اللي ممكن ماتكونش موجودة، مش لأي حاجة ممكن تبقى نال.‬\n\n‫ماتسألش هو موجود وبعدين تاخده، ده نفس فحص النال القديم بشكل تاني.‬\n\n‫البديل الجاهز بيتحسب دايماً، والبديل اللي جوه لامدا بيتحسب بس لو فاضي.‬\n\n```java\nuser.orElse(loadDefault());        // ❌\nuser.orElseGet(this::loadDefault); // ✅\n```\n"},"12":{"kind":"cheatsheet","src":"scratch-10-12-14/CHEATSHEET.md","md":"## 12 — Exceptions ★\n- **Model:** `Throwable` splits into `Error` (the JVM is in trouble — `OutOfMemoryError`, `StackOverflowError`; don't catch) and `Exception`. Checked = `Exception` but not `RuntimeException`; the compiler forces catch-or-declare. `RuntimeException` and `Error` are unchecked.\n- **throw vs throws:** `throw new X()` is a statement in the body that throws one exception now; `throws X` in the signature declares what may escape to the caller.\n- **Trap:** `catch (IOException e)` above `catch (FileNotFoundException e)` does not compile — the child is unreachable. Specific first, general last; the first matching catch wins. Swallowing (`catch (Exception e) {}`) is a defect: the bug stays, the evidence goes.\n- **Also:** try-with-resources closes `AutoCloseable` resources in reverse order; an exception from `close()` is attached as *suppressed*.\n- **Interview:** \"`Error` signals unrecoverable JVM failure; `Exception` is for problems the application can handle. Checked exceptions must be caught or declared with `throws`; `RuntimeException` and its subclasses don't. `throw` throws an object, `throws` declares it in the signature, and catch blocks go from most specific to most general or it won't compile.\"\n\n‫الثروابل بيتقسم لاتنين: الإيرور ده الجي في إم نفسه بايظ وماتمسكهوش.‬\n‫والإكسبشن ده مشكلة في البرنامج تقدر تتعامل معاها.‬\n‫الشيكد لازم تمسكه أو تعلن عنه، والرن تايم مش لازم.‬\n‫ثرو بتنفذ الرمي، وثروز بس إعلان في توقيع الميثود.‬\n‫الفخ: الكاتش العام قبل الخاص مش هيعمل كومبايل، ابدأ دايما بالأخص.‬\n"},"13":{"kind":"cheatsheet","src":"scratch-07-11-13-15/CHEATSHEET.md","md":"## 13 — Records, sealed types, pattern matching ☆\n\n**In one line:** a record is a transparent data carrier; `sealed` closes the list of subtypes so a `switch` over them is exhaustive without `default`.\n\n**⚠️ Trap:** a record is only shallowly immutable — a `List` component can still be changed.\n\n```java\nrecord Team(List\u003cString> members) {}                       // ❌ caller can still add to members\nrecord Team(List\u003cString> members) {\n    Team { members = List.copyOf(members); }               // ✅ defensive copy, unmodifiable\n}\n```\n\n**🎤 Interview:**\n1. A record generates `private final` fields, the canonical constructor, accessors, `equals`, `hashCode`, `toString`.\n2. Immutability is shallow: copy mutable components in the compact constructor.\n3. `sealed ... permits` fixes the subtypes; a pattern `switch` over them is checked for exhaustiveness at compile time — add a subtype and every such `switch` stops compiling, which is the point.\n4. Not for JPA entities: they need a no-arg constructor, mutable state and proxies.\n\n### بالمصري\n\n‫الريكورد صندوق بيانات شفاف، والكومبايلر بيكتبلك كل الكود المكرر.‬\n\n‫الثبات بتاعه من بره بس، الليستة اللي جواه لسه تتغير لو ماعملتش نسخة.‬\n\n‫الكلاس المقفول بيحدد مين يورث منه، فالكومبايلر يعرف إنك غطيت كل الحالات.‬\n\n```java\nrecord Team(List\u003cString> members) {}                        // ❌\nTeam { members = List.copyOf(members); }                    // ✅\n```\n"},"14":{"kind":"cheatsheet","src":"scratch-10-12-14/CHEATSHEET.md","md":"## 14 — Immutability and defensive copying ☆\n- **Model:** an object is immutable only if no reference that can change its state crosses its boundary, in or out: `final` class, `private final` fields, no setters, copy mutable inputs in and mutable outputs out.\n- **Trap:** `final List\u003cString> tags` + `this.tags = tags` is still mutable — `final` freezes the reference, not the list, and the caller still holds the same `ArrayList`. `Collections.unmodifiableList(tags)` is only a read-only *view*, so the caller's changes still show through. Fix: `this.tags = List.copyOf(tags)` — a real, unmodifiable copy, safe to return as is.\n- **Also:** a `record` is only shallowly immutable — same copy rule for list components.\n- **Interview:** \"Make the class final, every field private final, no setters, and defensively copy mutable inputs in the constructor and mutable outputs in getters. Then state can't change after construction, so the object is thread-safe without locks and safe as a `HashMap` key. The cost is a new object for every change.\"\n\n‫الأوبجكت يبقى إميوتابل لو مفيش أي ريفرنس يقدر يغيره يخرج أو يدخل من حدوده.‬\n‫يعني انسخ الحاجات اللي بتتغير وهي داخلة وهي خارجة.‬\n‫الفاينال بيقفل الريفرنس بس، لكن الليستة اللي بيشاور عليها لسه تتغير.‬\n‫الفخ: لو خزنت ليستة الكولر زي ما هي، الكولر يقدر يضيف فيها ويغير الأوبجكت بتاعك.‬\n‫المكسب إنه ثريد سيف من غير لوكس، والتمن أوبجكت جديد مع كل تغيير.‬\n"},"15":{"kind":"cheatsheet","src":"scratch-07-11-13-15/CHEATSHEET.md","md":"## 15 — Testing: JUnit 5 and Mockito ★\n\n**In one line:** mock the boundaries you don't own (repository, HTTP client, clock); test your own logic with real objects.\n\n**⚠️ Trap:** stubbing a spy with `when(...)` calls the real method first.\n\n```java\nList\u003cString> spy = spy(new ArrayList\u003c>());\nwhen(spy.get(0)).thenReturn(\"x\");       // ❌ real get(0) runs → IndexOutOfBoundsException\ndoReturn(\"x\").when(spy).get(0);         // ✅ stubs without calling the real method\n```\n\n**🎤 Interview:**\n1. JUnit 5: `@Test`, `@BeforeEach`, assertions, `@ParameterizedTest` for many inputs.\n2. Mockito: `@Mock` makes a fake, `when(...).thenReturn(...)` stubs it, `verify(...)` checks it was called.\n3. Mock collaborators at the boundary — never the class under test, never simple value objects.\n4. A spy wraps a real object; stub it with `doReturn`, because `when` runs the real call.\n5. Unit vs slice vs `@SpringBootTest` is the Spring half — after topic 30.\n\n### بالمصري\n\n‫اعمل موك للحاجات اللي بره كودك، زي الداتابيز والسيرفرات التانية.‬\n\n‫المنطق بتاعك اختبره بأوبجكتس حقيقية، مش بموك.‬\n\n‫السباي أوبجكت حقيقي، فلو ستبته بالطريقة العادية الميثود الحقيقية هتشتغل الأول.‬\n\n```java\nwhen(spy.get(0)).thenReturn(\"x\"); // ❌\ndoReturn(\"x\").when(spy).get(0);   // ✅\n```\n"},"18":{"kind":"cheatsheet","src":"scratch-47-48-18-19/CHEATSHEET.md","md":"## 18 — JPA and Hibernate mapping ★\n\n**In one line:** in a two-way relationship only one side writes the foreign key — the side that holds the column.\n\n**⚠️ Trap:** adding to the collection alone saves the item with a `NULL` foreign key.\n\n```java\norder.getItems().add(item);   // ❌ inverse side only → order_id is NULL\nitem.setOrder(order);         // ✅ owning side set → order_id written\n```\n\n**🎤 Interview:**\n1. JPA is the spec, Hibernate the provider; an entity maps a class to a table.\n2. In a bidirectional relationship the owning side holds the foreign key (`@JoinColumn`); `mappedBy` marks the inverse.\n3. Only the owning side is written, so keep both in sync with a helper like `order.addItem(item)`.\n4. `@ManyToOne` is `EAGER` by default — set it to `LAZY`.\n5. `@MappedSuperclass` shares fields with subclasses: no table of its own, cannot be queried.\n\n**Source:** Hibernate ORM User Guide — *Associations*\n\n### بالمصري\n\n‫في أي علاقة من ناحيتين، ناحية واحدة بس هي اللي بتكتب الـ foreign key.‬\n\n‫الـ owning side هو اللي عنده الـ JoinColumn، والتاني عنده الـ mappedBy.‬\n\n‫الـ Hibernate بيبص على الـ owning side بس وقت الحفظ.‬\n\n```java\norder.getItems().add(item);   // ❌\nitem.setOrder(order);         // ✅\n```\n"},"19":{"kind":"cheatsheet","src":"scratch-47-48-18-19/CHEATSHEET.md","md":"## 19 — Persistence context and lazy loading ★\n\n**In one line:** the persistence context is a per-transaction map of `id → entity` that Hibernate watches; anything outside it is just a plain object.\n\n**⚠️ Trap:** touching a lazy collection after the transaction ended.\n\n```java\n// ❌ in the controller, after the service's transaction closed\norder.getItems().size();        // LazyInitializationException\n\n// ✅ load what the caller needs while the context is open\n\"select o from Order o join fetch o.items where o.id = :id\"\n```\n\n**🎤 Interview:**\n1. Transient: new, unknown to Hibernate. Persistent (managed): in the context, changes tracked. Detached: the context closed, changes ignored until `merge`.\n2. The context is the first-level cache — one instance per id per transaction, one `SELECT`.\n3. Dirty checking compares managed entities to their snapshot at flush and issues the updates — no `save()` needed.\n4. `LazyInitializationException` means a proxy was touched with no open context; fix with a fetch join or a DTO, not with `EAGER`.\n\n**Source:** Hibernate ORM User Guide — *Persistence Context*\n\n### بالمصري\n\n‫الـ persistence context عبارة عن map من الـ id للـ entity، عايشة طول الـ transaction.‬\n\n‫أي entity جواها الـ Hibernate بيراقبها، ولو اتغيرت بيعمل update لوحده.‬\n\n‫لما الـ transaction تخلص الـ entity بتبقى detached ومحدش بيراقبها.‬\n\n‫لو لمست lazy collection بعد كده هيطلع LazyInitializationException.‬\n"},"47":{"kind":"cheatsheet","src":"scratch-47-48-18-19/CHEATSHEET.md","md":"## 47 — PostgreSQL for a SQL Server developer ★\n\n**In one line:** same SQL, stricter database — PostgreSQL lowercases every unquoted name and compares text case-sensitively.\n\n**⚠️ Trap:** `LIKE` is case-sensitive in PostgreSQL; the SQL Server collation hid that.\n\n```sql\nWHERE name LIKE  'ahmed%'   -- ❌ finds 'Ahmed' on SQL Server, misses it on PostgreSQL\nWHERE name ILIKE 'ahmed%'   -- ✅ case-insensitive match\n```\n\n**🎤 Interview:**\n1. Unquoted identifiers fold to lowercase; quoted ones are case-sensitive, so never quote names.\n2. Ids come from sequences, which lets Hibernate batch inserts — identity columns cannot.\n3. String comparison is case-sensitive: `ILIKE`, or `lower()` with a matching index.\n4. One app, two databases: a Spring profile per database, and no vendor SQL in the queries.\n5. Swaps: `TOP 5` → `LIMIT 5`, `OUTPUT` → `RETURNING`, `BIT` → `boolean`, `ISNULL` → `COALESCE`.\n\n**Source:** [PostgreSQL — data types](https://www.postgresql.org/docs/current/datatype.html)\n\n### بالمصري\n\n‫الـ PostgreSQL بيحول أي اسم من غير quotes لـ lowercase.‬\n\n‫لو حطيت الاسم بين quotes بيبقى case-sensitive على طول.‬\n\n‫الـ LIKE هنا case-sensitive، مش زي الـ SQL Server.‬\n\n```sql\nWHERE name LIKE  'ahmed%'   -- ❌\nWHERE name ILIKE 'ahmed%'   -- ✅\n```\n"},"48":{"kind":"cheatsheet","src":"scratch-47-48-18-19/CHEATSHEET.md","md":"## 48 — Schema migrations with Flyway ★\n\n**In one line:** the schema is versioned SQL files applied once, in order, and remembered — never guessed by Hibernate at startup.\n\n**⚠️ Trap:** editing a migration that already ran changes its checksum, and the app refuses to start.\n\n```sql\n-- ❌ V2__add_orders.sql, edited after it was applied → checksum mismatch at startup\nALTER TABLE orders ADD COLUMN note text;\n\n-- ✅ V3__add_order_note.sql, a new file\nALTER TABLE orders ADD COLUMN note text;\n```\n\n**🎤 Interview:**\n1. `ddl-auto=update` is not repeatable or reviewable, and it cannot rename, drop or migrate data. Production uses `validate`.\n2. Flyway applies versioned files (`V2__name.sql`) in order and records each with a checksum in `flyway_schema_history`; repeatable files (`R__name.sql`) re-run when their checksum changes.\n3. An applied migration is immutable — a fix is a new version.\n4. An existing database joins with a baseline (`baseline-on-migrate`).\n5. A failed migration rolls back on PostgreSQL (DDL is transactional); on MySQL, clean up by hand and run `repair`.\n6. Liquibase: same job, changelogs (XML/YAML) and built-in rollback; Flyway is plain SQL and simpler.\n\n**Source:** [Spring Boot — database initialization](https://docs.spring.io/spring-boot/how-to/data-initialization.html)\n\n### بالمصري\n\n‫الـ schema بقى ملفات SQL مترقمة، كل ملف بيشتغل مرة واحدة بالترتيب.‬\n\n‫الـ Flyway بيسجل كل migration مع الـ checksum بتاعه في جدول.‬\n\n‫لو عدلت ملف اتنفذ قبل كده، الـ checksum بيتغير والـ application مش هيقوم.‬\n\n‫التصليح دايماً بيبقى في ملف جديد بـ version جديد.‬\n"},"01":{"kind":"summary","src":"01-types-values-references/SUMMARY.md","md":"# 01 — Types, values and references\r\n\r\nStudy sheet. Taught 2026-09-01, reviewed 2026-09-06.\r\n\r\n**The one sentence:** a variable never holds an object — it holds either a primitive value or the\r\naddress of an object, and everything in this topic follows from that.\r\n\r\n---\r\n\r\n## 1. Two kinds of variable\r\n\r\n| | Holds | `=` copies |\r\n|---|---|---|\r\n| primitive (`int`, `double`, `boolean`, …) | the value itself | the value |\r\n| reference (`String`, `List`, any class) | the address of an object on the heap | the **address**, not the object |\r\n\r\n```java\r\nint a = 5;  int b = a;         // two independent 5s\r\nList\u003cString> x = new ArrayList\u003c>();\r\nList\u003cString> y = x;            // one list, two names — aliases\r\n```\r\n\r\n`y.add(\"hi\")` is visible through `x`. That is aliasing, and it is the source of most of the bugs\r\nbelow.\r\n\r\n## 2. Java is always pass-by-value\r\n\r\nThere is no pass-by-reference in Java. For an object, the **reference is copied by value**.\r\n\r\nConsequences:\r\n\r\n- **Mutating through the parameter is visible to the caller.** `list.add(x)` changes the caller list.\r\n- **Reassigning the parameter is invisible to the caller.** `list = new ArrayList\u003c>()` rebinds only\r\n  the local copy of the address.\r\n\r\n**The proof — `swap` cannot be written:**\r\n\r\n```java\r\nstatic void swap(String a, String b) {\r\n    String t = a; a = b; b = t;   // rebinds two locals, caller sees nothing\r\n}\r\n```\r\n\r\nIf Java were pass-by-reference this would work. It cannot be written for any type. That is the\r\nanswer to give when an interviewer pushes back.\r\n\r\n### Rebinding then mutating\r\n\r\n```java\r\nstatic void f(int[] a) {\r\n    a[0] = 9;                 // hits the caller array\r\n    a = new int[]{7, 7};      // now points somewhere else\r\n    a[0] = 100;               // hits the new array — caller never sees it\r\n}\r\nint[] x = {1, 2};\r\nf(x);                         // x is {9, 2}\r\n```\r\n\r\nRebinding is invisible, but it **changes which object later mutations hit**. Read the whole method\r\nbefore predicting the output.\r\n\r\n## 3. `final` binds the box, not the contents\r\n\r\n```java\r\nfinal List\u003cString> tags = new ArrayList\u003c>();\r\ntags.add(\"a\");            // fine — the object is mutable\r\ntags = new ArrayList\u003c>(); // compile error — the binding is fixed\r\n```\r\n\r\n`final` on a field also buys a real guarantee: a final field assigned in the constructor is safely\r\npublished, so other threads cannot see it half-built. Non-final fields have no such guarantee.\r\n\r\n## 4. Exposing a collection — the core decision\r\n\r\nDo not memorise four rows. Ask **two yes/no questions**:\r\n\r\n1. Can the caller modify what they got?\r\n2. Does what they got change later?\r\n\r\n```\r\nmodify: no   change: no    →  List.copyOf(tags)                       ← default for a getter\r\nmodify: no   change: yes   →  Collections.unmodifiableList(tags)      ← live read-only window\r\nmodify: yes  change: no    →  new ArrayList\u003c>(tags)                   ← caller owns it\r\nmodify: yes  change: yes   →  return tags                             ← the leak, never on purpose\r\n```\r\n\r\nVocabulary that matters in an interview:\r\n\r\n- **unmodifiable** — *you* cannot change it. It can still change under you.\r\n- **immutable** — *nobody* can change it. `List.copyOf`, `List.of`, `Map.of`.\r\n\r\n`Collections.unmodifiableList` is a **view**: it wraps the original and refuses writes, but every\r\nread goes through to the live list. `List.copyOf` is a **snapshot**: frozen at the moment of the\r\ncall.\r\n\r\n`UnsupportedOperationException` from an unmodifiable list is **not a defect to design around**. It\r\nis the API refusing a caller who is about to write into a list that goes nowhere. Handing back a\r\nmutable copy to silence it makes the bug silent, not fixed. Return a mutable list only when adding\r\nto it is the point.\r\n\r\n## 5. Shallow copy\r\n\r\n`new ArrayList\u003c>(orders)` gives a **new list containing the same objects**.\r\n\r\n```java\r\nvoid process(List\u003cOrder> orders) {\r\n    orders = new ArrayList\u003c>(orders);   // protects the LIST\r\n    orders.get(0).setStatus(CANCELLED); // still hits the caller Order\r\n}\r\n```\r\n\r\nProtection from structural change only — adds, removes, sorts. Element mutation still leaks.\r\nA deep copy means copying the elements too, and Java gives you nothing for free there.\r\n\r\n## 6. Other views that surprise people\r\n\r\n| Expression | Returns |\r\n|---|---|\r\n| `Arrays.asList(arr)` | fixed-size view **backed by the array**; `add`/`remove` throw, `set` writes through to `arr` |\r\n| `list.subList(a, b)` | view backed by the original; changes flow both ways, and structurally modifying the parent invalidates it |\r\n| `List.of(...)` | genuinely immutable, rejects nulls |\r\n\r\n`new ArrayList\u003c>(Arrays.asList(x))` is the idiom when you actually want a mutable list from an array.\r\n\r\n## 7. Boxing\r\n\r\n`Integer a = 100` does not call `new Integer(100)`. The compiler rewrites it to\r\n`Integer.valueOf(100)`, which returns a **cached** object for small values.\r\n\r\n- The JLS **requires** caching for `-128..127` (also `Boolean`, `Byte`, `Character` ≤ 127, `Short`).\r\n- Above that, every call allocates a new object.\r\n- The upper bound is tunable: `-XX:AutoBoxCacheMax=1000` makes `Integer c = 1000, d = 1000; c == d`\r\n  print `true`. **The same code behaves differently on two JVMs.**\r\n\r\n```java\r\nInteger a = 127, b = 127;   a == b   // true   — same cached object\r\nInteger c = 128, d = 128;   c == d   // false  — two objects\r\nc.equals(d)                          // true   — compares values\r\n```\r\n\r\nSo `==` on boxed types is never correct. Use `equals`, or `Objects.equals` when either side can be\r\nnull.\r\n\r\n### Unboxing NPE — the most common NPE in Java\r\n\r\n```java\r\nint n = counts.get(key);\r\n```\r\n\r\nIf the key is absent, `get` returns `null`, and the compiler inserted `.intValue()` you cannot see.\r\nNPE on a line with no visible method call. Java 14+ says so: *\"Cannot invoke\r\njava.lang.Integer.intValue() because the return value of java.util.Map.get(Object) is null.\"*\r\n\r\nFix: `counts.getOrDefault(key, 0)` when absent means zero; an `Integer` plus an explicit branch when\r\nabsent means something else. Assigning to `Integer` alone is **not** a fix — it just moves the NPE\r\ndownstream.\r\n\r\n`Integer` is immutable. `x++` on an `Integer` is: unbox → increment the `int` → **rebox into a new\r\nobject** → reassign the local. The caller `Integer` is untouched.\r\n\r\n### Normalise once\r\n\r\nIf two methods each handle \"absent\" their own way, they will disagree:\r\n\r\n```java\r\nlimitFor(\"ghost\")                 // 0        — absent normalised to 0\r\nonSameTier(\"ghost\", \"freetier\")   // false    — Objects.equals(null, 0)\r\n```\r\n\r\nDefine one in terms of the other — `return limitFor(a) == limitFor(b);` — and the contradiction\r\ncannot arise. Both sides are `int`, so no boxing question remains either.\r\n\r\n---\r\n\r\n## Interview answers\r\n\r\n**Is Java pass-by-value or pass-by-reference?**\r\nAlways pass-by-value. For objects the reference is copied by value, so mutation through it is\r\nvisible and reassignment is not. *Follow-up:* \"write `swap`\" — it cannot be done, and that is the\r\nproof.\r\n\r\n**`Integer a = 127, b = 127; a == b`? And 128?**\r\n`true`, then `false`. `valueOf` caches −128..127. *Follow-up:* \"is the boundary guaranteed?\" — the\r\nlower range is required by the JLS, the top is tunable with `-XX:AutoBoxCacheMax`.\r\n\r\n**Your class holds a `List`. How do you expose it?**\r\nTwo questions — can the caller modify it, does it change under them — then the four rows, with\r\n`List.copyOf` as the default and the raw field never on purpose.\r\n\r\n**`unmodifiableList` vs `copyOf` — when is `unmodifiableList` right?**\r\nWhen the caller must see later changes: a dashboard or monitor reading config that reloads.\r\n`copyOf` freezes at the call and the screen silently goes stale. *Risk of the view:* the owner can\r\nno longer write freely — someone is iterating, and that is a `ConcurrentModificationException`.\r\n\r\n**`orders = new ArrayList\u003c>(orders)` at the top of a method — does it work?**\r\nYes for structural protection, and the rebinding is invisible to the caller. *Follow-up:* it is a\r\n**shallow** copy — the `Order` objects are shared, so element mutation still leaks.\r\n\r\n**`==` on boxed Integers \"works, we tested it\".**\r\nIt works below 128 and fails on the first real id. Passing tests is the *worst* property of this\r\nbug. Use `equals` / `Objects.equals`.\r\n\r\n---\r\n\r\n## Mistakes actually made, and the correction\r\n\r\n| Mistake | Correction |\r\n|---|---|\r\n| \"Objects are passed by reference\" | Always by value; the *reference* is what is copied |\r\n| Predicted `1,2` where the answer was `1,100` | Rebinding redirects which object later mutations hit |\r\n| Returned `new ArrayList\u003c>(items)` where the caller must not modify | `List.copyOf` — a mutable copy protects the owner, not the API |\r\n| Called `unmodifiableList` \"immutable\" | Unmodifiable is not immutable; it is a live window |\r\n| Said `Integer 127 == 127` is `false` | `true` — cached. `false` at 128 |\r\n| Proposed a mutable copy to avoid `UnsupportedOperationException` (twice) | The throw is the feature; silence it and the bug goes silent, not away |\r\n| Answered \"defensive copy, it works\" and stopped | It is *shallow*; volunteer that before the interviewer asks |\r\n| `if (v == null) return 0; else return map.get(key);` | Two lookups, dead variable — `getOrDefault(key, 0)` |\r\n\r\n## Code in this folder\r\n\r\n- `Main.java` — the step-3 exercise (`OrderBasket`)\r\n- `task/Main.java` — the step-5 task (`CurrencyRegistry`, ticket PAY-1042)\r\n- `../review-01-values-and-views/Main.java` — the review exercise (`Inventory`)\r\n- `../review-01-values-and-views/task/Main.java` — the review task (ticket PAY-2207)\r\n"},"02":{"kind":"summary","src":"02-strings/SUMMARY.md","md":"# 02a — Strings: immutability, the pool, `==` vs `equals`\r\n\r\n## Mental model\r\n\r\nA `String` object never changes. Every \"modifying\" method returns a **new** one — so the only\r\nquestions left are *which* object you are holding, and whether it came from the pool.\r\n\r\n## The rules\r\n\r\n- **Immutable means the object.** `s.toUpperCase()` returns a new string and leaves `s` alone.\r\n  Ignoring the return value is the whole bug.\r\n- **A literal is interned at compile time.** `new String(...)` always allocates. Anything computed at\r\n  runtime — `split`, `substring`, `concat`, `+` on variables, I/O — is a fresh heap object, never\r\n  pooled.\r\n- **`==` on strings compares references.** Never the right tool for comparing text. Use `equals`, and\r\n  reverse it — `REFUND.equals(cmd)` — for null-safety for free.\r\n- **`intern()`** returns the pooled instance with that value. A memory tool, not a comparison tool.\r\n- **Constant variable** = `final` **+** primitive or `String` **+** *initialised in its own declarator\r\n  with a constant expression*. All three. Its value is then inlined into every class that reads it.\r\n\r\n## Constant or not\r\n\r\n| Declaration | Constant? | Because |\r\n|---|---|---|\r\n| `final String p = \"HI\";` | yes | literal in the declarator |\r\n| `final String q = \"H\" + \"I\";` | yes | both operands constant, folded to `\"HI\"` |\r\n| `final String r = p.toLowerCase();` | **no** | a method call is runtime, always |\r\n| `final String s = String.valueOf(\"HI\");` | **no** | same — a constant argument changes nothing |\r\n| `static final String t;` assigned in a static block | **no** | blank final, assigned at class-init time |\r\n\r\n**Why the last row matters in production:** a constant variable's value is *copied into every class\r\nthat reads it* at compile time. Ship a library with `public static final String VERSION = \"1.0\";`,\r\nchange it to `\"2.0\"`, recompile only the library — every client still prints `1.0` until it is\r\nrecompiled too. Move the assignment into a static block and the inlining stops.\r\n\r\n## The traps\r\n\r\n- Calling a `String` method and discarding the result. The compiler will not warn you.\r\n- `==` that passes every test because the test uses literals and production does not.\r\n- Judging \"is it constant?\" by the obvious value rather than by what the expression is made of.\r\n- Reaching for `intern()` to make `==` work instead of using `equals`.\r\n\r\n## Interview answers worth having ready\r\n\r\n**\"`String a = \"hi\"; String b = new String(\"hi\");` — how many objects?\"**\r\nTwo. The literal is folded into the pool at compile time; `new String` always allocates a fresh heap\r\nobject that copies it. `a == b` is false. `a == b.intern()` is true, because `intern()` looks the\r\n*value* up in the pool and hands back the pooled instance — the very object `a` points at.\r\n*Follow-up:* delete the first line — still two objects.\r\n\r\n**\"`==` on strings: tests green, production red. How?\"**\r\nIn the test both strings are **literals written in the source**, so the compiler pools them and both\r\nnames point at the same instance — `==` is true by accident. In production the string arrives at\r\nruntime (socket, DB column, JSON parse, `split`, `substring`, `new String`, concatenation of\r\nnon-constants), which is always a fresh un-interned heap object. The test never exercised the path\r\nthe bug lives on.\r\n*Follow-up:* \"would `intern()` fix it?\" — it would make `==` work, and it is still the wrong fix:\r\na pool lookup on every comparison, and correctness now depends on every caller remembering to intern.\r\n\r\n## Mistakes actually made\r\n\r\n- **Constant variables — third time.** Step 2 took four rounds; the drill still ticked the blank\r\n  final assigned in a static block. The missing piece is consistently the same one: *initialised in\r\n  its own declarator*. Not \"is it final\", not \"does the value look fixed\".\r\n- **Answered the rule instead of the question.** The `==` question explicitly granted that `==`\r\n  compares references and that `equals` is the fix, and asked *why the test was green*. The answer\r\n  given was the definition of `==`. Right fact, wrong question — and the interviewer scores the\r\n  second one.\r\n- **One line where five reasons were asked for.** The question said \"including the ones you left\r\n  unticked\". Reasoning is the graded part; skipping it costs the point even when the ticks are right.\r\n\r\n## What went well\r\n\r\n- Q1 fully correct *with* the mechanism — object count, reference identity, and what `intern()` hands\r\n  back, all three.\r\n- Exercise: four bug reports, no TODOs, all four found and fixed in one attempt — including spotting\r\n  that `ticketId` was discarding the result of `toUpperCase()`.\r\n- `p.toLowerCase()` and `String.valueOf(\"HI\")` both correctly rejected. The method-call half of the\r\n  constant rule has landed.\r\n"},"02b":{"kind":"summary","src":"02b-stringbuilder/SUMMARY.md","md":"# 02b — StringBuilder, and when concatenation actually costs\r\n\r\n## Mental model\r\n\r\nThe compiler already turns `a + b` into a `StringBuilder` for you. The cost is not concatenation —\r\nit is that a loop does it **once per iteration**, and each pass copies every character accumulated\r\nso far.\r\n\r\n## What the compiler actually writes\r\n\r\n```text\r\ns += part;\r\n\r\n  becomes\r\n\r\ns = new StringBuilder().append( s ).append( part ).toString()\r\n                          ▲             ▲\r\n                          │             └── flat: the new part only\r\n                          └── grows every pass — this is the O(n²)\r\n```\r\n\r\nFour iterations of `s += \"ab\"` to build 8 characters costs **20** copies: `0+2, 2+2, 4+2, 6+2`.\r\nA thousand iterations costs half a million.\r\n\r\n## The rules\r\n\r\n- **One expression gets one builder.** `a + b + c + d` is linear and already optimal — rewriting it\r\n  by hand buys nothing. A loop body is one expression *per iteration*, so `n` iterations is `n`\r\n  builders.\r\n- **Hoist the builder out of the loop.** That is the entire fix. One buffer, reused and doubled when\r\n  it runs out, so each `append` is amortised O(1).\r\n- **Anything that rebuilds the buffer is the same bug in disguise.**\r\n  `sb = new StringBuilder(sb).append(x)` inside a loop *uses* `StringBuilder` and is still quadratic —\r\n  the copy hides in the constructor.\r\n- **Quadratic ≠ slow.** It is a statement about growth. Judge by `n`, not by a stopwatch at small `n`.\r\n- **Separator before, not after.** `if (sb.length() > 0) sb.append(\", \");` at the top of the loop\r\n  leaves nothing to clean up afterwards.\r\n- **`StringBuffer`** is the synchronised twin. Legacy only.\r\n\r\n## Boundary\r\n\r\n| Situation | Builder needed? |\r\n|---|---|\r\n| `a + b + c + d`, one expression | no — already one builder |\r\n| `\"a\" + \"b\"`, constants | no — folded at compile time, zero runtime work |\r\n| Loop of 5 | no — readability wins |\r\n| Loop of 10,000 | **yes** |\r\n| Joining with a delimiter | `String.join` / `StringJoiner` / `Collectors.joining` beats both |\r\n| Java 9+ | `+` compiles to `invokedynamic`, not a literal builder — same shape of bug |\r\n\r\n## The traps\r\n\r\n- Describing the lowering without the accumulator in it. Say `append(out)` out loud — leave it out\r\n  and you have described a loop with no performance problem.\r\n- `trim()` to remove a trailing separator. It only strips whitespace, and it corrupts items that\r\n  legitimately carry spaces.\r\n- Benchmarking at n=1,000 and concluding the quadratic version is fine.\r\n- Fixing one method and leaving the identical bug in the method above it.\r\n\r\n## Mistakes actually made\r\n\r\n- **Q1 — right count, wrong expression.** Wrote `new StringBuilder(row).append(\"\\n\")`. `out` was\r\n  missing, and `append(out)` *is* the quadratic. The same lowering was written correctly in Q2·C one\r\n  question later, so it is a slip in articulation, not a gap in knowledge.\r\n- **Q2·A — called four variables \"literals\".** `a + b + c + d` folds nothing; it is linear because\r\n  it is one expression, one builder. Same shape as the 02a constant miss: judged by what the code\r\n  looks like, not what the expression is made of.\r\n- **Q3 — answered \"1000\".** No sentence, no consequence. The direction was probably right.\r\n- **Re-test — gave the four strings, never the counts.** Two rounds, capped. The strings were the\r\n  inputs to the arithmetic; the arithmetic did not follow. Pattern: the mechanism is known, the\r\n  *number* does not come out when a number is asked for.\r\n- **Step 3 — `toCsv` left untouched.** The headline case of the whole lesson, and the identical fix\r\n  had already been written one method below in `bullets`.\r\n- **Step 3 — `joinWithComma`: changed the data to fit the tool.** Switched the separator to `\" \"` so\r\n  `trim()` would work, which deleted the comma from the output.\r\n\r\n## What went well\r\n\r\n- Q1 count correct, and all four Q2 classifications correct including D, the disguised one.\r\n- `bullets` fixed by hoisting the builder — the right fix, for the right reason.\r\n- `label` correctly left alone. That was the planted trap and the direct re-test of the Q2·A miss.\r\n"},"03a":{"kind":"summary","src":"03a-equals-hashcode/SUMMARY.md","md":"# 03a — equals and hashCode: the contract, and how breaking it corrupts a HashMap\r\n\r\n## Mental model\r\n\r\nA `HashMap` never searches. `hashCode` picks the bucket, `equals` picks the entry inside it.\r\nIf `hashCode` sends you to the wrong bucket, `equals` never even runs.\r\n\r\n```text\r\nget(key)\r\n  │\r\n  ├─ 1. key.hashCode()  → bucket index        ── wrong hash? empty bucket → null. equals never ran.\r\n  │\r\n  └─ 2. walk that bucket: stored.equals(key)  ── right bucket, stored key changed? equals false → null.\r\n```\r\n\r\nA bucket is a **list**, not a slot: two different keys with the same hash sit side by side in it.\r\n\r\n## The contract\r\n\r\n| Rule | Why the map needs it |\r\n|---|---|\r\n| `a.equals(b)` ⇒ `a.hashCode() == b.hashCode()` | equal keys must land in the same bucket, or `equals` is never asked |\r\n| same hash does **not** imply equal | collisions are legal; `equals` sorts them out inside the bucket |\r\n| `hashCode` stable while the object is a key | the entry stays in the bucket it was put in — it is never re-filed |\r\n\r\n- Override **both or neither**. `equals` alone → each instance gets its identity hash → duplicates.\r\n- Build `hashCode` from **exactly the fields `equals` uses** (`code.hashCode()`, `Objects.hash(a, b)`).\r\n\r\n## Which method failed? (ask this every time)\r\n\r\n| Situation | hashCode | equals | Result |\r\n|---|---|---|---|\r\n| `equals` overridden, `hashCode` not; add two equal objects | different buckets | **never called** | set size 2 |\r\n| key mutated; `get(sameObject)` | new hash → empty bucket | **never called** | `null` |\r\n| key mutated; `get(new Key(oldName))` | old hash → right bucket | **false** (stored key changed) | `null` |\r\n| `put(k, 99)` where an equal key exists | same bucket | true | value overwritten, size unchanged |\r\n\r\n## Renaming a key safely\r\n\r\n```java\r\n// take it out while the hash still matches, then put it back under the new key\r\nstock.put(north = new Warehouse(\"north-2\"), stock.remove(new Warehouse(\"north-1\")));\r\n```\r\n\r\nArguments evaluate left to right: the `remove` runs before the `put`. Better still, use immutable keys\r\nso this can't happen at all.\r\n\r\n## The traps\r\n\r\n- The row is \"still in there\" (`size() == 1`) and unreachable, because `size()` counts entries and\r\n  doesn't look them up.\r\n- Fixing the test instead of the code: a check changed to assert the buggy value passes, and the\r\n  bug is still there.\r\n- `put` with the new key without `remove` of the old leaves an orphan entry nobody can reach.\r\n\r\n## Mistakes actually made\r\n\r\n- **Step 2, two rounds:** said \"`equals` is wrong\" when a mutated key missed. `equals` never ran,\r\n  because the hash sent the probe to an empty bucket. Then called `get(new Tag(\"java\"))` a hit. It\r\n  was the right bucket, but the stored key had changed, so `equals` is the one that fails.\r\n- **Step 2:** treated a bucket as one slot, and answered size 1 for two distinct equal-hash items.\r\n  Fixed on the re-test.\r\n- **Step 3, check A** ended up asserting `size() == 2`, the buggy value. The real fix is `hashCode`\r\n  on `Sku`.\r\n- **Step 3, Report B, two wrong tries:** renamed to the same name, then `put` the new key without\r\n  removing the old one. Needed hints on left-to-right argument evaluation and on a fresh equal key\r\n  finding the entry.\r\n- **Step 3:** couldn't say unaided whether `Sku.equals` was called in Report A. It wasn't: different\r\n  identity hashes put the two objects in different buckets.\r\n- **Drill Q1:** opened with \"`equals` compares values\". `Object.equals` is `==`. It compares values\r\n  only when the class overrides it.\r\n- **Drill Q2:** called `equals` without `hashCode` \"not a bug, just mini buckets\". It is a bug: the\r\n  `HashSet` keeps duplicates and `get` returns `null` for a key that is present.\r\n"},"04a":{"kind":"summary","src":"04a-abstract-vs-interface/SUMMARY.md","md":"# 04a — Abstract class vs interface\r\n\r\n**Mental model:** an interface is a *type* a class can take on as many times as it likes; an abstract\r\nclass is a *partial implementation with state*, and a class gets exactly one.\r\n\r\n## Rules\r\n\r\n| | Abstract class | Interface |\r\n|---|---|---|\r\n| Per-instance state | Yes — instance fields | **No** — every field is implicitly `public static final` |\r\n| Constructors | Yes (run via `super(...)`) | No |\r\n| How many per class | **One** (`extends`) | Any number (`implements`) |\r\n| Method bodies | Any | `default`, `static`, `private` (Java 9+) |\r\n| Member visibility | Any | Abstract/default/static are `public`; `private` only for helpers |\r\n\r\n## Decision\r\n\r\n- Need shared **state** or a constructor, and the implementors have no other superclass → abstract class.\r\n- Need a **capability** that unrelated classes (ones that already extend something) can take on → interface.\r\n- Need both → interface for the type; the default method reaches state through an **abstract accessor**\r\n  (`increaseExport()`, `exported()`) that each class implements with its own field.\r\n\r\n## Traps\r\n\r\n- `int count = 0;` in an interface is a shared constant, not a field. `count++` → *cannot assign a value\r\n  to static final variable*.\r\n- Fixing that with a `static` field in the class compiles but shares one count across all instances.\r\n- `private` interface method: callable **only inside the interface body**, never by an implementor. It\r\n  must have a body, so it can't be the abstract hook.\r\n- Diamond (two defaults with the same signature): the class must override and pick with `A.super.who()`.\r\n- The accessor pattern's price: the hooks are `public`, so any caller can bump the counter, and the field\r\n  is duplicated in every implementor.\r\n\r\n## Mistakes actually made\r\n\r\n- **Step 2:** read a `private` interface method as a `default` one and said an implementor can call it\r\n  (two rounds, capped). It can't — `private` means inside the interface only.\r\n- **Step 3:** first proposed moving `exported` into `FileSink`. Wrong twice over: `JsonExporter` doesn't\r\n  extend `FileSink`, and `Exporter`'s default method can't see a field of a class that implements it.\r\n  Then solved it cleanly: abstract hooks in the interface, own field per class. The reason came out right:\r\n  `CsvExporter` already spends its one `extends` on `FileSink`.\r\n"},"04b":{"kind":"summary","src":"04b-composition/SUMMARY.md","md":"# 04b — Composition over inheritance\r\n\r\n**Mental model:** inheritance ties you to how the parent is *implemented*; composition ties you only\r\nto what it *promises*.\r\n\r\n## The failure: fragile base class\r\n\r\nOverriding `add` makes you depend on whether the parent's *other* methods call `add`. The docs don't\r\nsay, and it goes both ways:\r\n\r\n| Parent | `addAll` does | Your `add` override |\r\n|---|---|---|\r\n| `HashSet` (via `AbstractCollection`) | loops `this.add(e)` | runs **twice** → count doubles (6, not 3) |\r\n| `ArrayList` | `System.arraycopy` in bulk | runs **zero** times → limit bypassed |\r\n\r\n```text\r\nextends:  parent.addAll ──► this.add  ──► YOUR add     (calls back into you — or doesn't)\r\nhas-a:    inner.addAll  ──► inner.add                  (never comes back to the wrapper)\r\n```\r\n\r\n## When `extends` is allowed — both must hold\r\n\r\n1. **is-a**: every subclass can stand in for the parent.\r\n2. The parent is **designed and documented for extension** (says which methods call which, like\r\n   `AbstractList`), **or you own it**.\r\n\r\nis-a says inheritance is *allowed*. A parent built for extension says it is *safe*.\r\n\r\n## Association / aggregation / composition\r\n\r\nAll three are just a field holding a reference. The difference is **lifecycle — who else can reach it**.\r\n\r\n| Relation | Java shape | Outlives the whole? |\r\n|---|---|---|\r\n| Association | uses it (parameter / non-owning field) | n/a |\r\n| Aggregation | field set from outside (`Team(List\u003cPlayer>)`) | yes |\r\n| Composition | created inside, **never leaks** | no — dies with it |\r\n\r\nIt's about **objects** at runtime. The class design only decides whether composition is *guaranteed*.\r\n\r\n## Traps\r\n\r\n- `new` inside is half of composition. A getter returning the part turns it into aggregation:\r\n  `Engine e = new Car().getEngine();` → the `Car` is collectable, the `Engine` is not (`e` holds it).\r\n- Getter for an internal collection → `List.copyOf(list)`. The `UnsupportedOperationException` on\r\n  `add`/`clear` is the class refusing a bad caller, not a bug to avoid.\r\n- `public final List\u003c> list` still leaks. `final` freezes the **reference**, not the object:\r\n  `cart.list.addAll(...)` still works. The field must be `private`.\r\n- A wrapper is **not** the wrapped object: if `inner` passes `this` to a callback, the callback skips\r\n  the wrapper.\r\n- In a composed class, route `addAll` through **your own** `add` on purpose. Now the self-use is yours\r\n  and known.\r\n\r\n## Mistakes actually made\r\n\r\n- **Set size.** Predicted `3 3` for `addAll([a, b, a])` on a counting `HashSet`. `count` counts\r\n  *calls* (3), `size` counts *stored* elements (2).\r\n- **A leaking getter called \"composition\"**, because `new` was inside. The re-test left GC reachability\r\n  unanswered: a leaked part outlives its owner.\r\n- **\"Inheritance is fine when is-a holds\"**: missed the second condition (designed for extension)\r\n  twice. `CountingSet` *is* a `Set` and still broke.\r\n- **Exercise:** made the field `public`, then `public final`, before `private`.\r\n- **Why `ArrayList` skipped the limit:** said \"a different method with return type boolean\". Wrong\r\n  reason. `addAll` copies the array in bulk and never calls `add`.\r\n"},"04c":{"kind":"summary","src":"04c-constructors/SUMMARY.md","md":"# 04c — Constructors\r\n\r\n**Mental model:** a constructor is not a method — it initialises an object `new` already allocated,\r\nbelongs to exactly one class, and is never inherited or overridden.\r\n\r\n**Key rule:** the first line of every constructor is `super(...)` — yours, or `super()` inserted by javac.\r\n\r\n```text\r\nnew C() → allocate + zero fields → C(){super();} → B(){super();} → A() → Object()\r\n          prints run on the way back: A, then B        new returns the reference\r\n```\r\n\r\n| Modifier | Why illegal |\r\n|---|---|\r\n| `final` | nothing to override — constructors are never inherited |\r\n| `static` | needs a `this` to initialise |\r\n| `abstract` | a subclass cannot supply the parent's constructor body |\r\n\r\nDefault constructor = `C() { super(); }`, generated **only** when you declare none. It does not give\r\nfields default values — allocation already zeroed them.\r\n\r\n**Classic trap:**\r\n```java\r\nclass Parent { Parent(String n) {} }\r\nclass Child extends Parent { }   // ✗ javac inserts super(); Parent() does not exist\r\n```\r\n\r\n**Interview answer (30 s):** Constructors aren't inherited — each class initialises its own part, and\r\nevery constructor starts by calling a parent one, implicitly `super()`. So if the parent has only an\r\narg constructor, the child must call `super(args)` explicitly. They can't be `final`/`static`/`abstract`\r\nbecause none of those mean anything for code that is never inherited, needs `this`, and must have a body.\r\n\r\n**My mistake:** diagnosed the missing-`super` error as \"missing field `id`\" → the field is inherited;\r\nthe failure is the hidden `super()` finding no no-arg constructor. Also said the chain happens at\r\ncompile time → it runs at `new`, at runtime. Drill: \"not inherited because they can't be overridden\"\r\n→ backwards; the reason is that an inherited parent constructor would leave the child's own fields\r\nuninitialised. \"Returns the new instance\" → the constructor returns nothing; `new` returns the reference.\r\n"},"05a":{"kind":"summary","src":"05a-overriding-overloading/SUMMARY.md","md":"# 05a — Overriding vs overloading, static hiding\r\n\r\n**Mental model:** The compiler picks the *signature* from declared types; the JVM picks the *body*\r\nfrom the real object — and only for instance methods.\r\n\r\n**Key rule:**\r\n\r\n| | Decided by | Looks at |\r\n|---|---|---|\r\n| Overload (same name, different parameters) | compiler | declared type of the arguments |\r\n| `static` method (hiding) | compiler | declared type of the receiver |\r\n| Override (same signature, instance method) | JVM at runtime | actual object of the receiver |\r\n\r\nPut `@Override` on every intended override. It is a compiler check, not a note for the reader.\r\n\r\n**Classic trap:**\r\n\r\n```java\r\npublic boolean equals(Tag other) { ... }    // an OVERLOAD, not an override\r\nList.of(new Tag(\"java\")).contains(new Tag(\"java\"));   // false\r\n```\r\n\r\n`contains` calls `equals(Object)`. Nobody overrode that one, so `Object.equals` runs, which is `==`.\r\n\r\n**Interview answer (30 s):** Overloading is resolved at compile time from the declared argument\r\ntypes; overriding is resolved at runtime from the receiver's actual object. Static methods cannot be\r\noverridden, only hidden: a static call is bound to the declared type and never dispatched. So when\r\nbehaviour must vary by runtime type, it goes in an overridden instance method on the receiver.\r\n\r\n**My mistake:** Said the subclass's static method lost because it \"only exists in the parent\" → it\r\nexists in both; the compiler bound the call to the declared type. And my `equals(Object)` cast\r\nwithout a type check → use `obj instanceof Tag t && name.equals(t.name)`, with `@Override`.\r\n"},"05b":{"kind":"summary","src":"05b-dynamic-dispatch/SUMMARY.md","md":"# 05b — Dynamic dispatch, the four OOP concepts, varargs\r\n\r\n**Mental model:** A method runs where it is written, but `this` is always the real object — so an\r\ninstance call is dispatched on the object, wherever the calling code sits.\r\n\r\n**Key rule:**\r\n\r\n| Concept | Hides | Java tool |\r\n|---|---|---|\r\n| Encapsulation | state — the class guards its own rules | `private` field + methods that validate |\r\n| Abstraction | how it is done | `abstract` method, interface |\r\n| Inheritance | nothing, it reuses | `extends` |\r\n| Polymorphism | which body runs | overriding + dynamic dispatch |\r\n\r\nDispatch covers instance methods only. `static`, `private` and fields bind to the declared type.\r\nVarargs `T... xs` is a `T[]` built by the compiler: last parameter, one per method, tried last —\r\nphase 1 exact/widening, phase 2 boxing, phase 3 varargs. First phase with a match wins.\r\n\r\n**Classic trap:**\r\n\r\n```java\r\nclass Config     { String env() { return \"prod\"; }  String show() { return env(); } }\r\nclass TestConfig extends Config { @Override String env() { return \"test\"; } }\r\nnew TestConfig().show();                     // \"test\": env() is this.env()\r\nArrays.asList(new int[]{1, 2, 3}).size();    // 1: an int[] is one object\r\n```\r\n\r\n**Interview answer (30 s):** Encapsulation keeps state private and lets the class enforce its own\r\ninvariants; abstraction exposes what without how; inheritance reuses a parent; polymorphism lets one\r\ncall site run different bodies. The mechanism is dynamic dispatch: the compiler checks the method\r\nexists on the declared type, the JVM picks the body from the object's actual class at runtime.\r\n\r\n**My mistake:** Said a call inside a parent method stays in the parent → an unqualified call is\r\n`this.call()` and dispatches. Said `private` + getter/setter is encapsulation → a raw setter is a\r\npublic field; the setter must enforce the rule. Said `f(5)` picks `int...` as \"closest\", and that an\r\n`int` is an object → boxing (phase 2) beats varargs; `7` becomes an `Integer`. Left `@Override` off.\r\n"},"06a":{"kind":"summary","src":"06a-static/SUMMARY.md","md":"# 06a — `static` and class initialisation\r\n\r\n**Mental model:** A static member belongs to the class, and the class is initialised once, top to\r\nbottom, by the JVM on its first active use.\r\n\r\n**Key rule:**\r\n\r\n| Step | What happens |\r\n|---|---|\r\n| 1 | Static fields get defaults (`0`, `null`, `false`) |\r\n| 2 | Static initialisers and `static { }` blocks run in textual order, **once** |\r\n| 3 | Only then: `main`, the constructor, or the static method that was called |\r\n\r\nFirst active use = `new`, a static method call, a non-constant static field read or write, or being\r\nthe main class. Reading a constant variable (`static final` primitive or `String`, initialised in\r\nits declarator with a constant expression) triggers nothing: `javac` inlines the value.\r\nA static method has no `this`, so it cannot touch instance members and is never dispatched.\r\n`static public void main` compiles: modifier order is only a convention.\r\n\r\n**Classic trap:**\r\n\r\n```java\r\nstatic final Registry INSTANCE = new Registry();  // constructor runs: count 0 -> 1\r\nstatic int count = 10;                            // then overwritten: count is 10, not 11\r\n```\r\n\r\n**Interview answer (30 s):** `static` means one copy owned by the class, not by each object. The JVM\r\ninitialises a class once, on first active use, running static field initialisers and static blocks\r\nin the order they are written — that is how code runs before `main`. Static methods cannot be\r\noverridden, only hidden, because the compiler binds the call to the declared class.\r\n\r\n**My mistake:** Said static initialisation re-runs on every `new` → it runs once per class; the JVM\r\nremembers. Said reading `Lib.A` triggers the static block → a constant variable is inlined, the\r\nclass is never touched. Said \"the compiler initialises statics\" → the JVM does, at runtime.\r\n"},"08a":{"kind":"summary","src":"08a-list-set/SUMMARY.md","md":"# 08a — List and Set: the backing structure decides the cost\r\n\r\n**Mental model:** The interface is the promise, the backing structure is the price.\r\n\r\n**Key rule:** Big O states how the work grows with `n`, constants dropped.\r\n\r\n| | Backing | `get(i)` | add at end | front / middle | `contains` | Order |\r\n|---|---|---|---|---|---|---|\r\n| `ArrayList` | array | O(1) | O(1) amortised | O(n) shift | O(n) | insertion |\r\n| `LinkedList` | linked nodes | O(n) walk | O(1) | front O(1); middle O(n) walk | O(n) | insertion |\r\n| `HashSet` | hash table | no index | O(1) | no position | O(1) | none promised |\r\n| `LinkedHashSet` | hash table + links | no index | O(1) | no position | O(1) | insertion |\r\n| `TreeSet` | red-black tree | no index | O(log n) | no position | O(log n) | sorted |\r\n\r\n**Classic trap:**\r\n\r\n```java\r\nfor (int i = 0; i \u003c list.size(); i++) total += list.get(i);   // list is a LinkedList\r\n```\r\n\r\nRight result, O(n²): every `get(i)` walks again from the nearer end. A for-each uses the\r\niterator, which remembers its position, so the same loop is O(n).\r\n\r\n**Interview answer (30 s):** `ArrayList` is an array, so reading by index is O(1) and inserting at\r\nthe front or middle shifts elements, O(n). `LinkedList` is nodes, so it inserts in O(1) only where it\r\nalready is — the two ends, or at an iterator — and reaching any other position costs O(n). That is\r\nwhy `ArrayList` is the default. A `Set` forbids duplicates; `HashSet` gives O(1) with no order,\r\n`LinkedHashSet` adds insertion order at the same cost, `TreeSet` is sorted at O(log n).\r\n\r\n**My mistake:**\r\n- Read `LinkedHashSet` as a `LinkedList` (\"fast insertion, slow read\") → \"Linked\" there buys\r\n  insertion order, not a different cost. It is still a hash table.\r\n- Said `contains` on a hash set is O(1) because \"it walks and reads\" → it is O(1) because it does\r\n  not walk: the hash jumps to the bucket.\r\n- Predicted a `HashSet`'s print order → no order is promised; it follows the hashes.\r\n- Fixed the slow loop by copying into an `ArrayList` → works, but a for-each needs no copy.\r\n"},"08b":{"kind":"summary","src":"08b-maps/SUMMARY.md","md":"# 08b — Maps: the backing structure decides order, cost and null\r\n\r\n**Mental model:** A map's backing structure decides everything else: order, cost, and what it does\r\nwith `null`.\r\n\r\n**Key rule:** `hashCode` picks the bucket, `equals` picks the entry — except in a `TreeMap`, which\r\ncalls neither and uses only `compareTo` / the comparator.\r\n\r\n| | Backing | Order | `get`/`put` | `null` key | Synchronized |\r\n|---|---|---|---|---|---|\r\n| `HashMap` | buckets; a bucket of 8+ becomes a red-black tree | none promised | O(1) avg, O(log n) worst | one | no |\r\n| `LinkedHashMap` | `HashMap` + linked list through entries | insertion | O(1) avg | one | no |\r\n| `TreeMap` | red-black tree | sorted by key | O(log n) | no | no |\r\n| `Hashtable` | buckets, always chains | none promised | O(1) avg, O(n) worst | no (nor `null` values) | every method |\r\n\r\n`HashSet` is a `HashMap` that uses only the keys.\r\n\r\n**Classic trap:**\r\n\r\n```java\r\nMap\u003cString, Integer> t = new TreeMap\u003c>(String.CASE_INSENSITIVE_ORDER);\r\nt.put(\"Java\", 1);  t.put(\"java\", 2);      // size 1, {Java=2}\r\n```\r\n\r\nThe comparator returned 0, so they are the same key — `equals` was never asked.\r\n\r\n**Interview answer (30 s):** `HashMap` is a hash table: O(1) on average, no order, one `null` key,\r\nnot thread-safe; since Java 8 a long bucket becomes a tree, so the worst case is O(log n).\r\n`LinkedHashMap` adds insertion order at the same cost. `TreeMap` is a red-black tree: sorted keys,\r\nO(log n), no `null` key. `Hashtable` is the legacy synchronized one, no nulls at all; for\r\nconcurrency use `ConcurrentHashMap` instead. `HashSet` is a `HashMap` of keys only.\r\n\r\n**My mistake:**\r\n- Swapped the worst cases (`HashMap` O(n), `Hashtable` O(log n)) → only `HashMap` treeifies a\r\n  bucket; `Hashtable` stays a chain, so it is the O(n) one.\r\n- Said no map accepts a `null` key → `HashMap` and `LinkedHashMap` take one (`null` hashes to\r\n  bucket 0); `TreeMap` and `Hashtable` throw `NullPointerException`.\r\n- Drill: opened \"the difference is the Big O\" and never said \"synchronized\" → `HashMap` and\r\n  `Hashtable` cost the same on average; the difference is that every `Hashtable` method is\r\n  `synchronized`, and it takes no `null`.\r\n- Warm-up: named `equals` for a lookup that died in `hashCode` → a method that never ran cannot be\r\n  the one that failed.\r\n\r\n**Source:** Java SE API, class Javadoc of `java.util.HashMap`.\r\n"},"09a":{"kind":"summary","src":"09a-comparable-comparator/SUMMARY.md","md":"# 09a — Comparable vs Comparator\r\n\r\n**Mental model:** sorting asks \"which of these two comes first?\" — `Comparable` answers from inside\r\nthe class (one natural order), `Comparator` answers from a separate object (any number of orders).\r\n\r\n**Key rule:** negative → first argument first, zero → tie, positive → second first.\r\n\r\n| | `Comparable\u003cT>` | `Comparator\u003cT>` |\r\n|---|---|---|\r\n| Method | `compareTo(T other)` | `compare(T a, T b)` |\r\n| Lives in | the class being sorted | outside it |\r\n| How many | one per class | unlimited |\r\n| Needs the source | yes | no (`String`, library classes) |\r\n\r\n**Classic trap:** a sorted collection treats zero as \"the same element\" and never calls `equals`.\r\n\r\n```java\r\nSet\u003cString> s = new TreeSet\u003c>(Comparator.comparingInt(String::length));\r\ns.add(\"fig\"); s.add(\"kiwi\"); s.add(\"pea\");   // 2 [fig, kiwi] — \"pea\" compares 0 with \"fig\", dropped\r\n```\r\n\r\nFix: add a tie-breaker, `.thenComparing(...)`, until zero means truly equal.\r\n\r\n**Interview answer (30 s):** `Comparable` is implemented by the class itself and defines its single\r\nnatural order through `compareTo`; `Comparator` is a separate object with `compare(a, b)`, so one\r\nclass can have many orders and I can sort classes I do not own. I use `Comparable` for the one\r\nobvious order and a `Comparator` for everything else, built with `comparing` and `thenComparing`.\r\nIn a `TreeSet` or `TreeMap` the comparison, not `equals`, decides what a duplicate is.\r\n\r\n**My mistake:** said a `TreeSet` keeps elements that compare as zero (twice) → zero means \"already\r\nhere\", the add is dropped. And read `x - y` on ±2 billion as zero, then as \"won't sort\" → the\r\ndifference overflows `int`, the sign flips, the order comes out reversed; use `Integer.compare`.\r\nThen swapped the method names in the drill → `Comparable.compareTo(other)` takes one argument\r\n(`this` is the other side); `Comparator.compare(a, b)` takes two (it is neither object). A `TreeSet`\r\nwith a comparator calls `comparator.compare`, never the element's `compareTo`.\r\n\r\n**Source:** Javadoc of `java.lang.Comparable` — natural ordering *consistent with equals*.\r\n"},"10a":{"kind":"summary","src":"10a-lambdas/SUMMARY.md","md":"# 10a — Lambdas, functional interfaces, method references\r\n\r\n**Mental model:** a lambda is the body of the one abstract method of a functional interface. The\r\ntarget type decides which method it is and what its parameters mean.\r\n\r\n**Key rule:** a lambda can read a local only if that local is *effectively final*, meaning it is\r\nnever reassigned. It captures the value, not the variable.\r\n\r\n| Method reference | Same as | Example |\r\n|---|---|---|\r\n| `Type::staticMethod` | `(a) -> Type.staticMethod(a)` | `Integer::parseInt` |\r\n| `obj::method` | `(a) -> obj.method(a)` | `System.out::println` |\r\n| `Type::instanceMethod` | `(a, b) -> a.method(b)` (first arg is the receiver) | `String::startsWith` |\r\n| `Type::new` | `() -> new Type()` | `ArrayList::new` |\r\n\r\n**Classic trap:** a `Supplier` that hands back one shared object.\r\n\r\n```java\r\nstatic final List\u003cBook> EMPTY = new ArrayList\u003c>();\r\nSupplier\u003cList\u003cBook>> cart = () -> EMPTY;     // every get() returns the SAME list\r\nSupplier\u003cList\u003cBook>> fixed = ArrayList::new; // new runs inside, so each get() builds a fresh list\r\n```\r\n\r\n**Interview answer (30 s):** a functional interface has exactly one abstract method, and a lambda\r\nor method reference is a short way to implement it. The compiler uses the target type to infer the\r\nparameter types. Captured locals must be effectively final because the lambda copies their value\r\nand may run later, on another thread. Mutable state belongs in a field or a return value, not in a\r\nreassigned local.\r\n\r\n**My mistake:** forgot that `Comparable` uses `compareTo(T other)` (one arg, `this` is the left\r\nside) for the third time, and said `String::compare`. Also, in R2 I flagged the loop line instead\r\nof the line where the lambda reads `total`, and gave no fix (fix: copy it into a never-reassigned\r\nlocal). Exercise C: had `() -> EMPTY` return a shared list → `ArrayList::new` makes a new one on\r\neach call.\r\n\r\n**Source:** JLS §15.27 (lambda expressions), §15.13 (method references); the `java.util.function` Javadoc.\r\n"},"07":{"kind":"cheatsheet","src":"scratch-07-11-13-15/CHEATSHEET.md","md":"## 07 — Generics and erasure ★\n\n**In one line:** generics are a compile-time check; at runtime `List\u003cString>` and `List\u003cInteger>` are both plain `List`.\n\n**⚠️ Trap:** generics are invariant — a list of `Integer` is not a list of `Number`.\n\n```java\nList\u003cNumber> nums = new ArrayList\u003cInteger>();            // ❌ does not compile\nList\u003c? extends Number> nums = new ArrayList\u003cInteger>();  // ✅ read from it (producer)\nList\u003c? super Integer> sink = new ArrayList\u003cNumber>();    // ✅ write into it (consumer)\n```\n\n**🎤 Interview:**\n1. The compiler checks type parameters, then erases them to their bound (`Object` if none).\n2. So no `new T()`, no `new T[]`, no `instanceof List\u003cString>`.\n3. Invariance is fixed with wildcards: PECS — producer `extends`, consumer `super`.\n4. After erasure the compiler adds bridge methods so overriding still works.\n\n### بالمصري\n\n‫الجينريكس شغلها وقت الكومبايل بس، ووقت التشغيل النوع بيتمسح خالص.‬\n\n‫ليستة الأعداد الصحيحة مش ليستة أرقام، حتى لو الصحيح نوع من الأرقام.‬\n\n‫لو هتقرا بس استخدم الحد الأعلى، ولو هتكتب استخدم الحد الأدنى.‬\n\n```java\nList\u003cNumber> n = new ArrayList\u003cInteger>();           // ❌\nList\u003c? extends Number> n = new ArrayList\u003cInteger>(); // ✅\n```\n"}},"figures":{"10":"atlas/10-figure.html","11":"atlas/11-figure.html","12":"atlas/12-figure.html","13":"atlas/13-figure.html","14":"atlas/14-figure.html","15":"atlas/15-figure.html","16":"atlas/16-figure.html","17":"atlas/17-figure.html","18":"scratch-jpa/18-figure.html","23":"scratch-portal-backend/23-figure.html","44":"atlas/44-figure.html","45":"atlas/45-figure.html","47":"scratch-47-48-18-19/47-figure.html","02a":"atlas/02a-figure.html","02b":"atlas/02b-figure.html","03a":"atlas/03a-figure.html","04a":"atlas/04a-figure.html","04b":"atlas/04b-figure.html","04c":"atlas/04c-figure.html","07":"atlas/07-figure.html","08a":"atlas/08a-figure.html","10a":"atlas/10a-figure.html","09a":"09a-comparable-comparator/figure.html"}}</script>
<script>
// ======================= data model (shared by every variant) =======================
const D = JSON.parse(document.getElementById('data').textContent);
const TODAY = new Date().toLocaleDateString('en-CA'); // yyyy-mm-dd, local
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const tick = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

const STATUS = {
  'solid':       { label:'Done · solid',  color:'var(--solid)' },
  'ok':          { label:'Done · ok',     color:'var(--ok)' },
  'shaky':       { label:'Done · shaky',  color:'var(--shaky)' },
  'scratched':   { label:'Scratched',     color:'var(--scratched)' },
  'in-progress': { label:'In progress',   color:'var(--progress)' },
  'not-started': { label:'Not started',   color:'var(--none)' },
};

// A curriculum row ("02") can be taught in parts ("02a", "02b"); every part found anywhere joins its row.
const partIds = new Set([
  ...D.completed.map(c => c.id), ...D.scratched.map(s => s.id), ...D.review.map(r => r.id),
  ...Object.keys(D.summaries || {}), ...Object.keys(D.figures || {}),
]);
const byId = (list, id) => list.find(x => x.id === id);

const TOPICS = [];
for (const track of D.tracks || []) for (const section of track.sections) for (const t of section.topics) {
  const ids = [...partIds].filter(p => p === t.id || new RegExp(`^${t.id}[a-z]$`).test(p)).sort();
  const parts = ids.map(id => ({
    id,
    completed: byId(D.completed, id),
    scratched: byId(D.scratched, id),
    review:    byId(D.review, id),
    summary:   D.summaries[id],
    figure:    D.figures[id],
    weak:      D.weak.filter(w => w.topic === id),
  }));
  const isCurrent = new RegExp(`Topic: ${t.id}[a-z]? `).test(D.current[track.name] || '') && !/not started/.test(D.current[track.name]);
  const topic = { ...t, track: track.name, section: section.title, parts, isCurrent };
  topic.status = statusOf(topic);
  const dues = parts.map(p => p.review?.due).filter(Boolean).sort();
  topic.nextDue = dues[0] || '';
  topic.due = !!topic.nextDue && topic.nextDue <= TODAY;
  topic.summaries = parts.filter(p => p.summary);
  topic.figures = parts.filter(p => p.figure);
  topic.weak = parts.flatMap(p => p.weak);
  TOPICS.push(topic);
}

// Decides the one status every variant colours a topic by. Must return a key of STATUS.
// topic.parts: [{ id, completed:{confidence,date,notes}?, scratched:{date}?, review:{due,rung}?, ... }]
// topic.isCurrent: true when this row is the one being taught right now on its track.
function statusOf(topic) {
  // Same rule as the progress band: a split topic shows its weakest finished part.
  if (topic.isCurrent) return 'in-progress';
  const conf = topic.parts.map(p => p.completed?.confidence).filter(Boolean);
  if (conf.length) return conf.includes('shaky') ? 'shaky' : conf.includes('ok') ? 'ok' : 'solid';
  return topic.parts.some(p => p.scratched) ? 'scratched' : 'not-started';
}

// ---------- small shared helpers (content, not layout) ----------
const sDot = st => `<span class="dot" style="background:${STATUS[st].color}"></span>`;
const sPill = st => `<span class="pill">${sDot(st)}${STATUS[st].label}</span>`;
const duePill = t => t.due ? `<span class="pill due">Due ${t.nextDue === TODAY ? 'today' : t.nextDue}</span>` : t.nextDue ? `<span class="pill">Review ${t.nextDue}</span>` : '';
const counts = list => Object.fromEntries(Object.keys(STATUS).map(k => [k, list.filter(t => t.status === k).length]));
const trackTopics = name => TOPICS.filter(t => t.track === name);
const isDone = t => ['solid', 'ok', 'shaky', 'scratched'].includes(t.status);
function md(text) {
  const html = window.marked ? marked.parse(text) : `<pre>${esc(text)}</pre>`;
  return html.replace(/<(p|li|h[1-6]|td|blockquote)>/g, '<$1 dir="auto">');
}
function detail(t, { figHeight = 560 } = {}) {
  const meta = t.parts.map(p => {
    const c = p.completed, s = p.scratched, r = p.review;
    return `<li><b>${p.id}</b> — ${c ? `done ${esc(c.date)}, <b>${esc(c.confidence)}</b>` : s ? `scratched ${esc(s.date)}` : 'no record'}${r ? ` · review ${r.due} (rung ${r.rung}d)` : ''}</li>`;
  }).join('');
  return `
    <p style="color:var(--muted);margin:0 0 10px">${tick(t.objective)}</p>
    ${meta ? `<ul style="margin:0 0 12px;padding-left:18px;font-size:13.5px">${meta}</ul>` : ''}
    ${t.weak.length ? `<div style="background:#fff7ea;border:1px solid #f0dcb4;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13.5px"><b>Weak spots</b><ul style="margin:4px 0 0;padding-left:18px">${t.weak.map(w => `<li>${tick(w.label)} <span class="pill">${w.held}/2 held</span></li>`).join('')}</ul></div>` : ''}
    ${t.figures.map(p => `<iframe class="fig" loading="lazy" style="height:${figHeight}px;margin-bottom:14px" src="${p.figure}" title="${p.id} figure"></iframe>`).join('')}
    ${t.summaries.map(p => `<div class="md"><div class="pill" style="margin-bottom:6px">${p.id} · ${p.summary.kind} · ${esc(p.summary.src)}</div>${md(p.summary.md)}</div>`).join('') || '<p class="empty">No summary yet.</p>'}`;
}

// ======================= shared: B's drawer, a legend, a seeded random =======================
document.head.insertAdjacentHTML('beforeend', `<style>
  #drawer{ position:fixed; top:0; right:0; bottom:0; width:min(640px,100vw); background:var(--card); border-left:1px solid var(--line);
    box-shadow:-10px 0 30px #0002; transform:translateX(105%); transition:transform .25s ease; z-index:60; overflow:auto; padding:18px 20px 100px }
  #drawer.open{ transform:none }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; font-size:12.5px; color:var(--muted) }
  .legend span{ display:inline-flex; gap:5px; align-items:center }
  [data-open]{ cursor:pointer }
  .wrap{ max-width:1400px; margin:0 auto; padding:20px 16px }
  .head{ display:flex; flex-wrap:wrap; gap:14px; align-items:baseline; margin-bottom:14px }
  .head h1{ margin:0; font-size:24px }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }
</style>`);
const findTopic = key => TOPICS.find(x => `${x.track}:${x.id}` === key);
const drawerEl = Object.assign(document.createElement('aside'), { id:'drawer' });
document.body.appendChild(drawerEl);
function openTopic(t) {
  drawerEl.innerHTML = `<button id="dr-close" style="float:right;border:0;background:var(--soft);border-radius:8px;padding:4px 10px;cursor:pointer">✕</button>
    <div style="font-size:12px;color:var(--muted);text-transform:capitalize">${t.track} · ${esc(t.section)}</div>
    <h2 style="margin:2px 0 8px">${t.id} · ${esc(t.title)}</h2>
    <div style="display:flex;gap:6px;margin-bottom:12px">${sPill(t.status)}${duePill(t)}${t.isCurrent ? '<span class="pill" style="background:#f1effb;color:var(--accent)">Current lesson</span>' : ''}</div>
    ${detail(t, { figHeight:440 })}`;
  drawerEl.classList.add('open'); drawerEl.scrollTop = 0;
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) return openTopic(findTopic(o.dataset.open));
  if (e.target.id === 'dr-close' || (!e.target.closest('#drawer') && !e.target.closest('#switcher'))) drawerEl.classList.remove('open');
});
const legend = (extra = '') => `<div class="legend">${Object.keys(STATUS).map(k => `<span>${sDot(k)}${STATUS[k].label}</span>`).join('')}
  <span><span class="dot" style="box-shadow:0 0 0 2px var(--due)"></span>Review due</span>${extra}</div>`;
const sectionName = s => s.replace(/^Track /, '');
const seeded = s => { let x = 7; for (const c of s) x = (x * 31 + c.charCodeAt(0)) | 0; return ((x >>> 0) % 10000) / 10000; };
const onColor = st => st === 'not-started' ? 'var(--muted)' : '#fff';
const sectionsOf = track => track.sections.map(s => ({ title:s.title, topics:trackTopics(track.name).filter(t => t.section === s.title) }));

// ======================= B · Roadmap map (the pick) =======================
function VariantB(root) {
  root.innerHTML = `<div class="wrap">
    <div class="head"><h1>The map</h1>${legend('<span>▣ has figure</span>')}</div>
    ${D.tracks.map(track => { const list = trackTopics(track.name); return `<section style="margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <h2 style="margin:0;font-size:17px;text-transform:capitalize">${track.name}</h2>
        <span style="color:var(--muted);font-size:13px">${list.filter(isDone).length} of ${list.length}</span>
        <div style="flex:1;height:1px;background:var(--line)"></div></div>
      <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px">
        ${sectionsOf(track).map(s => `<div style="flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:170px;max-width:260px">
          <div style="font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">${esc(sectionName(s.title))}</div>
          <div style="display:flex;flex-wrap:wrap;gap:7px">${s.topics.map(t => `<button data-open="${t.track}:${t.id}" title="${esc(t.id + ' · ' + t.title)}"
            class="b-node${t.isCurrent ? ' cur' : ''}" style="--c:${STATUS[t.status].color};color:${onColor(t.status)};${t.due ? 'box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--due);' : ''}">
            ${t.id}${t.figures.length ? '<i>▣</i>' : ''}</button>`).join('')}</div></div>`).join('')}
      </div></section>`; }).join('')}
  </div>
  <style>.b-node{ position:relative; width:46px; height:46px; border-radius:50%; border:0; font:600 12px ui-monospace,Consolas,monospace; background:var(--c); transition:transform .12s }
    .b-node:hover{ transform:scale(1.12) }
    .b-node i{ position:absolute; right:-3px; top:-5px; font-style:normal; font-size:11px; color:var(--text); background:var(--card); border-radius:4px; padding:0 2px }
    .b-node.cur{ outline:2px dashed var(--accent); outline-offset:3px }</style>`;
}

// ======================= B2 · Metro lines (close to B) =======================
function VariantB2(root) {
  root.innerHTML = `<div class="wrap">
    <div class="head"><h1>Metro</h1>${legend('<span>📍 you are here</span>')}</div>
    ${D.tracks.map(track => { const list = trackTopics(track.name); return `
      <section style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 6px;margin-bottom:16px">
        <div style="display:flex;gap:10px;align-items:baseline"><h2 style="margin:0;font-size:17px;text-transform:capitalize">${track.name} line</h2>
          <span style="color:var(--muted);font-size:13px">${list.filter(isDone).length} / ${list.length} stations</span></div>
        <div style="display:flex;overflow-x:auto;padding:10px 0 10px">
          ${sectionsOf(track).map(s => `<div class="m-zone">
            <div class="m-zname">${esc(sectionName(s.title))}</div>
            <div style="display:flex">${s.topics.map(t => `
              <div class="m-st" data-open="${t.track}:${t.id}" title="${esc(t.title)}">
                <div class="m-rail" style="background:${t.status === 'not-started' ? 'var(--soft)' : STATUS[t.status].color}"></div>
                ${t.isCurrent ? '<div class="m-here">📍</div>' : ''}
                <div class="m-stop" style="border-color:${t.status === 'not-started' ? 'var(--none)' : STATUS[t.status].color};${t.due ? 'box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--due)' : ''}"></div>
                <div class="m-id">${t.id}${t.figures.length ? ' ▣' : ''}</div><div class="m-title">${esc(t.title)}</div>
              </div>`).join('')}</div></div>`).join('')}
        </div></section>`; }).join('')}
  </div>
  <style>.m-zone{ flex:none; border-left:1px dashed var(--line); padding:0 4px }
    .m-zname{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:0 8px 6px; white-space:nowrap }
    .m-st{ position:relative; width:92px; padding-top:22px; text-align:center }
    .m-st:hover .m-title{ color:var(--text) }
    .m-rail{ position:absolute; top:30px; left:0; right:0; height:6px }
    .m-stop{ position:relative; width:22px; height:22px; margin:0 auto; border-radius:50%; background:#fff; border:5px solid }
    .m-here{ position:absolute; top:-2px; left:50%; transform:translateX(-50%); font-size:16px }
    .m-id{ font:600 12px ui-monospace,Consolas,monospace; margin-top:6px }
    .m-title{ font-size:11.5px; color:var(--muted); line-height:1.25; padding:0 4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }</style>`;
}

// ======================= B3 · Tile heatmap (close to B, denser) =======================
function VariantB3(root) {
  root.innerHTML = `<div class="wrap">
    <div class="head"><h1>Heatmap</h1>${legend()}</div>
    <div id="b3-hover" style="height:24px;font-size:14px;color:var(--muted);margin-bottom:6px">Hover a tile.</div>
    ${D.tracks.map(track => { const list = trackTopics(track.name); return `
      <div style="display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;margin-bottom:14px">
        <div><b style="text-transform:capitalize">${track.name}</b><div style="font-size:12px;color:var(--muted)">${list.filter(isDone).length}/${list.length}</div></div>
        <div style="display:flex;flex-wrap:wrap;gap:14px">${sectionsOf(track).map(s => `
          <div><div style="font-size:10.5px;color:var(--faint);text-transform:uppercase;margin-bottom:3px;max-width:${Math.max(3, s.topics.length) * 32}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sectionName(s.title))}</div>
