mparator chaining, `ConcurrentModificationException` and fail-fast iterators"}]},{"title":"Track C — Modern Java","topics":[{"id":"10","title":"Streams and lambdas","star":"core","objective":"Lazy pipelines, intermediate vs terminal, `Collectors` including `groupingBy`, functional interfaces, method references, where streams are the wrong tool"},{"id":"11","title":"Optional and null discipline","star":"core","objective":"The intended use, the anti-patterns (`isPresent`/`get`, `Optional` fields and parameters), and how this repo does it instead with `ObjectChecker`"},{"id":"12","title":"Exceptions","star":"core","objective":"Checked vs unchecked and the design argument, custom hierarchies, try-with-resources and `AutoCloseable`, suppressed exceptions, swallowing as a defect"},{"id":"13","title":"Records, sealed types, pattern matching","star":"senior","objective":"Modern Java data modelling, exhaustive switch, when a record is right and when it is not"},{"id":"14","title":"Immutability and defensive copying","star":"senior","objective":"Building genuinely immutable types, why it buys thread safety for free, and what it costs"}]},{"title":"Track D — Testing","topics":[{"id":"15","title":"Testing","star":"core","objective":"JUnit 5, Mockito, what is worth mocking, unit vs slice vs `@SpringBootTest`, judging the real coverage of whatever codebase the lab profile points at, and what its gaps cost. *Prereq: 30 for the slice and `@SpringBootTest` half; the JUnit and Mockito half needs nothing earlier*"}]},{"title":"Track E — SQL and persistence","topics":[{"id":"16","title":"SQL fundamentals","star":"core","objective":"`SELECT` and the logical order of evaluation, the join types and what each does to row counts, `GROUP BY`/`HAVING` vs `WHERE`, subqueries vs joins, set operations, and three-valued logic — why `NULL = NULL` is not true and what that does to `NOT IN`"},{"id":"44","title":"Schema design and DDL","star":"core","objective":"Keys and constraints (primary, foreign irty checking"},{"id":"20","title":"Queries","star":"core","objective":"Reading: same text, query sections. JPQL/HQL, Criteria, native SQL, projections, pagination"},{"id":"21","title":"Transactions","star":"core","objective":"Reading: same text, transaction sections. `@Transactional`, propagation, isolation, rollback rules, read-only, and the self-invocation trap again. *Prereq: 27 — self-invocation is a consequence of proxying, which is taught there*"},{"id":"22","title":"Performance: N+1 and caching","star":"senior","objective":"Diagnosing N+1, fetch joins and entity graphs, first vs second level cache, when caching is the wrong answer"}]},{"title":"Track F — Spring core","topics":[{"id":"23","title":"IoC and dependency injection","star":"core","objective":"What the container actually does, why inversion of control matters, the problem DI solves"},{"id":"24","title":"Beans: definition, scopes, lifecycle","star":"core","objective":"`@Component`/`@Service`/`@Repository`, `@Configuration` plus `@Bean`, singleton vs prototype vs request, lifecycle callbacks and their ordering"},{"id":"25","title":"Injection styles","star":"core","objective":"Constructor vs field vs setter and why constructor wins, `@Qualifier`, `@Primary`, resolving ambiguity, circular dependencies"},{"id":"26","title":"Configuration and properties","star":"core","objective":"`@Value`, `@ConfigurationProperties`, profiles, property precedence, externalised config"},{"id":"27","title":"AOP and proxies","star":"core","objective":"JDK dynamic proxies vs CGLIB, aspects and pointcuts, and **why self-invocation silently defeats `@Transactional` and `@Cacheable`**"},{"id":"28","title":"Events and listeners","star":"senior","objective":"`ApplicationEvent`, listener registration, synchronous vs asynchronous publication"},{"id":"29","title":"The container at startup","star":"senior","objective":"Refresh phases, `BeanPostProcessor`, `@Conditional`, what \"the context failed to start\" really means"}]},{"title":"Track G — Spring Boot and web","topics":[{"id":"30","title":"Spring Boot auto-configuration","star":"core","objective":"What `@SpringBootApplication` unpacks to, starters, conditional configuration, how to see and override what Boot decided"},{"id":"31","title":"REST controllers","star":"core","objective":"`@RestController`, mapping and binding, `@RequestBody`/`@PathVariable`/`@RequestParam`, status codes, content negotiation, DTOs vs entities"},{"id":"46","title":"The Spring MVC request pipeline","star":"senior","objective":"`DispatcherServlet`, handler mapping and adapters, view resolution, interceptors vs servlet filters and where each runs"},{"id":"32","title":"Error handling","star":"core","objective":"`@ControllerAdvice`, `@ExceptionHandler`, designing an error contract, what must never leak into a response"}]},{"title":"Track H — Security","topics":[{"id":"33","title":"Spring Security basics","star":"senior","objective":"The filter chain, authentication vs authorisation, method security, common misconfigurations, JWT and stateless auth, password hashing and salting"},{"id":"49","title":"OAuth2 resource server and Keycloak","star":"senior","objective":"A hand-rolled JWT vs an identity provider, the OAuth2 roles (client, resource server, authorization server), validating a JWT against a JWKS endpoint, mapping Keycloak roles to authorities, the authorization code flow with PKCE for a SPA. *Prereq: 33.*"}]},{"title":"Track I — JVM, memory and concurrency","topics":[{"id":"34","title":"JVM memory model","star":"core","objective":"Heap, stack, metaspace, what lives where, `OutOfMemoryError` vs `StackOverflowError`, reading a stack trace properly"},{"id":"35","title":"Garbage collection","star":"core","objective":"Generational collection, what makes an object unreachable, why finalizers are gone, GC pauses as a production symptom"},{"id":"36","title":"Class loading","star":"senior","objective":"Loaders and delegation, static init timing, `NoClassDefFoundError` vs `ClassNotFoundException`, reflection and what it costs"},{"id":"37","title":"Threads and the Java Memory Model","star":"core","objective":"Reading: the active lab profile's concurrency text, if it declares one. Visibility, happens-before, volatile vs synchronized, instruction reordering"},{"id":"38","title":"Synchronisation and locks","star":"core","objective":"`synchronized` mechanics, `ReentrantLock`, deadlock and how to prove one from a thread dump, race conditions"},{"id":"39","title":"Executors and async","star":"core","objective":"Reading: same text, executor sections. Thread pools and sizing, correct shutdown, `CompletableFuture` composition, rejection policies"},{"id":"40","title":"Concurrent collections, atomics, ThreadLocal","star":"senior","objective":"Reading: same text, concurrent-collection sections. `ConcurrentHashMap` vs a synchronised map, CAS and atomics, `ThreadLocal` leaks in a pooled server"}]},{"title":"Track J — System design and engineering judgement","topics":[{"id":"41","title":"Design patterns in real code","star":"senior","objective":"Factory, builder, strategy, template method, observer — each identified in this codebase rather than in a textbook"},{"id":"42","title":"SOLID and review judgement","star":"senior","objective":"The principles as review arguments, plus the coding standards declared by the active lab profile"},{"id":"43","title":"System design for Java interviews","star":"senior","objective":"Layering, transaction boundaries, idempotency, API versioning — the questions that follow \"tell me about a system you built\""}]}]},{"name":"react","sections":[{"title":"Track RA — Core, by contrast","topics":[{"id":"R01","title":"JSX","star":"","objective":"JSX is JavaScript that returns a description of UI, not a template compiled with directives: `{}` for expressions, `className`, one root, fragments. *From Vue:* `\u003ctemplate>` with `v-if`/`v-for`/`:prop`; here control flow is plain JavaScript."},{"id":"R02","title":"Components and props","star":"","objective":"A component is a function called on every render; props are its arguments, read-only, typed with a plain interface. `children` is a prop. *From Vue:* SFC with `defineProps`; there is no `emit`, a callback prop does that job."},{"id":"R03","title":"State with `useState`","star":"core","objective":"State is memory React keeps between calls of the component function. `setX` requests a re-render; it does not change the variable in the running function. *From Vue:* `ref()` — but there is no `.value` and no proxy; nothing is tracked."},{"id":"R04","title":"The render model","star":"core","objective":"Trigger → render → commit. A render is a snapshot: props, state and handlers all belong to that one call. Why reading state right after setting it gives the old value. *From Vue:* fine-grained reactivity re-runs only the effects that read a changed ref; React re-runs the whole component function and its children. *Prereq: R03.*"},{"id":"R05","title":"Updating state: immutability and batching","star":"core","objective":"Mutating an object or array in state changes nothing on screen, because React compares by reference. Copy-then-replace for objects and arrays; updater functions (`setN(n => n + 1)`); batching. *From Vue:* `state.items.push(x)` works there because of the proxy. Here it is the single most common bug a Vue developer writes. *Prereq: R04.*"},{"id":"R06","title":"Events and controlled inputs","star":"","objective":"Handlers are props (`onClick={fn}`, not `onClick={fn()}`); synthetic events; a controlled input is `value` + `onChange`, and omitting one of them is a bug with a known symptom. *From Vue:* `@click` and `v-model`; there is no two-way binding, you write both directions."},{"id":"R07","title":"Lists, keys and conditional rendering","star":"","objective":"`map` with a stable `key`; why the index is the wrong key; `&&` and its `0` trap, ternaries, early return. *From Vue:* `v-for` with `:key`, `v-if`/`v-else`, `v-show` (no built-in equivalent)."},{"id":"R08","title":"Purity and Strict Mode","star":"","objective":"Rendering must be a pure calculation: same inputs, same JSX, no side effects. Strict Mode calls components and effects twice in development to expose the ones that are not. *From Vue:* `setup()` runs once, so impure setup code goes unnoticed; here the function body runs on every render. *Prereq: R04.*"}]},{"title":"Track RB — State and hooks","topics":[{"id":"R09","title":"Structuring and lifting state","star":"core","objective":"Avoid redundant, duplicated and contradictory state; derive during render instead of storing. Lift state to the closest common parent; \"controlled\" vs \"uncontrolled\" component. *From Vue:* `computed` for derived values, props down and `emit` up."},{"id":"R10","title":"`useReducer`","star":"","objective":"State transitions as a pure `(state, action) => state` function; when it beats several `useState` calls; typing actions as a union. *From Vue:* a Pinia store's actions, minus the mutation."},{"id":"R11","title":"Context","star":"core","objective":"`createContext`, a provider, `useContext`. It is dependency injection, not a state manager: every consumer re-renders when the value changes, and an inline object value changes on every render. *From Vue:* `provide`/`inject`, where an injected ref updates only its readers."},{"id":"R12","title":"Refs","star":"","objective":"`useRef` holds a mutable value that survives renders and does not trigger one; DOM refs; `ref` as a prop. Never read or write `ref.current` during render. *From Vue:* template refs for the DOM half; for the value half, a plain variable in `setup()` — which React cannot have, because the function re-runs."},{"id":"R13","title":"`useEffect`","star":"core","objective":"An effect synchronises the component with something outside React: setup, cleanup, dependency array. Think \"start and stop synchronising\", not \"mounted and unmounted\". Why it runs twice in development. *From Vue:* `watchEffect` plus `onMounted`/`onUnmounted`; dependencies are declared by hand rather than tracked. *Prereq: R04, R08.*"},{"id":"R14","title":"You might not need an effect","star":"core","objective":"The effects that should not exist: deriving state, resetting state on a prop change, reacting to a user event, chains of effects. What to write instead. Data fetching in an effect and its race condition. *From Vue:* the reflex to reach for `watch`; most of those become a calculation during render or code in an event handler. *Prereq: R13.*"},{"id":"R15","title":"Rules of hooks, dependencies and stale closures","star":"core","objective":"Hooks only at the top level, only in components and hooks, and why (call order is the identity). Every reactive value an effect reads is a dependency; a stale closure is a snapshot captured by an old render. Removing a dependency by changing the code, not by lying to the linter; `useEffectEvent`. *From Vue:* none of this exists, since `setup()` runs once and refs are live. *Prereq: R04, R13.*"},{"id":"R16","title":"`useMemo` and `useCallback`","star":"core","objective":"Caching a calculation or a function identity between renders. They are performance tools with a cost, useful only when something downstream compares by reference. What the React Compiler changes. *From Vue:* `computed` is cached by default and tracked automatically; here caching is opt-in and the dependencies are yours. *Prereq: R05.*"},{"id":"R17","title":"Custom hooks","star":"core","objective":"Extracting stateful logic into a `use…` function. Hooks share logic, not state: two callers get two independent states. *From Vue:* composables — the closest match in the whole track, with one difference: a composable runs once, a hook runs on every render. *Prereq: R15.*"}]},{"title":"Track RC — TypeScript in React","topics":[{"id":"R18","title":"Typing components, events and hooks","star":"","objective":"Props as an interface; `React.ReactNode` for children; `React.ChangeEvent\u003cHTMLInputElement>` and friends; `useState\u003cT>`, `useRef\u003cT>(null)`, typed context with a non-null guard. Why `React.FC` is not needed. *From Vue:* `defineProps\u003cT>()` and `defineEmits\u003cT>()`."},{"id":"R19","title":"Generic components","star":"","objective":"A component whose prop types are linked by a type parameter, e.g. `List\u003cT>` with `items: T[]` and `render: (item: T) => ReactNode`. *From Vue:* `\u003cscript setup generic=\"T\">`. *Prereq: R18.*"},{"id":"R20","title":"Discriminated unions for state and props","star":"senior","objective":"Modelling loading / error / success as one union so impossible states cannot be represented; narrowing on the discriminant; props that depend on each other. *Prereq: R18.*"}]},{"title":"Track RD — Patterns and performance","topics":[{"id":"R21","title":"Composition with `children` and render props","star":"","objective":"Passing JSX as a prop is the whole slot mechanism. Named slots are extra props; a scoped slot is a function prop. Composition as the fix for prop drilling before reaching for context. *From Vue:* default, named and scoped slots."},{"id":"R22","title":"Reconciliation: preserving and resetting state","star":"senior","objective":"State belongs to a position in the render tree, not to the component function. Same component at the same position keeps its state; a different `key` resets it. Why a component defined inside another loses its state on every render. *From Vue:* `:key` on a component forces a remount there too, but the \"position\" rule is new. *Prereq: R07.*"},{"id":"R23","title":"`memo` and when it does nothing","star":"senior","objective":"`memo` skips a re-render when props are shallowly equal — so an inline object, array or function prop defeats it. Measure first; fixes that need no memoisation (move state down, pass children). *From Vue:* children do not re-render unless their own dependencies change, so this problem never appears. *Prereq: R16.*"},{"id":"R24","title":"Suspense, `lazy` and transitions","star":"","objective":"A Suspense boundary shows a fallback while something below it is not ready; `lazy` for code splitting; `useTransition` and `useDeferredValue` to keep the UI responsive during a non-urgent update. *From Vue:* `\u003cSuspense>` with async `setup`, and `defineAsyncComponent`."},{"id":"R25","title":"Error boundaries","star":"","objective":"A boundary catches errors thrown during rendering below it and shows a fallback. What it does not catch: event handlers, async code. Still a class component, or a library wrapper. *From Vue:* `onErrorCaptured`."},{"id":"R26","title":"Portals","star":"","objective":"`createPortal` renders children into a different DOM node while keeping them in the React tree — so context still works and events still bubble to the React parent. *From Vue:* `\u003cTeleport>`."},{"id":"R27","title":"Forms and actions","star":"","objective":"`\u003cform action={fn}>`, `useActionState`, `useFormStatus`, `useOptimistic`; controlled vs uncontrolled forms and when each is right. *From Vue:* `v-model` on every field plus a submit handler. *Prereq: R06.*"},{"id":"R28","title":"React 19 and the compiler","star":"senior","objective":"What changed and what it removed: `use`, actions, `ref` as a prop, and the React Compiler, which memoises automatically and makes most hand-written `useMemo`/`useCallback`/`memo` unnecessary. What the compiler requires of your code (the rules from R08 and R15). *Prereq: R16, R23.*"}]},{"title":"Track RE — State and data libraries","topics":[{"id":"R29","title":"Zustand","star":"","objective":"A store is a hook; components subscribe with a selector and re-render only when the selected value changes. Selector identity and the object-selector trap. *From Vue:* Pinia — the nearest equivalent, without `storeToRefs` because nothing is reactive; the selector does that job. *Prereq: R11.*"},{"id":"R30","title":"Redux Toolkit","star":"core","objective":"Store, slices, actions, reducers, selectors, `useSelector`/`useDispatch`; why reducers look mutable (Immer) and are not; thunks. Asked because it is in most existing codebases, not because it is the default choice today. *From Vue:* Vuex, more than Pinia. *Prereq: R10.*"},{"id":"R31","title":"TanStack Query","star":"core","objective":"Server state is not client state: it is a cache of something you do not own. Query keys, `staleTime` vs `gcTime`, background refetch, mutations and invalidation, optimistic updates. Why it replaces the fetch-in-effect from R14. *From Vue:* `useFetch`/`useAsyncData` in Nuxt, or a hand-written composable with `loading` and `error` refs. *Prereq: R14.*"},{"id":"R32","title":"React Router","star":"","objective":"Routes, nested routes and `\u003cOutlet>`, params, navigation, loaders; its three modes (declarative, data, framework). *From Vue:* Vue Router and `\u003cRouterView>`; there are no navigation guards, a loader or a wrapper route does that."}]},{"title":"Track RF — Next.js","topics":[{"id":"R33","title":"The App Router","star":"","objective":"File conventions: `page`, `layout`, `loading`, `error`, route groups, dynamic segments; `\u003cLink>` and prefetching. *From Vue:* Nuxt `pages/` and `layouts/`; here layouts nest by folder and persist across navigation."},{"id":"R34","title":"Server and Client Components","star":"core","objective":"Components are Server Components by default: they run only on the server, can be `async`, and ship no JavaScript. `'use client'` marks a boundary, not a single file. What can cross it (serialisable props, and Server Components as `children`). *From Vue:* nothing equivalent in production Nuxt; every Nuxt component hydrates. *Prereq: R21.*"},{"id":"R35","title":"Fetching, caching and revalidating","star":"senior","objective":"Fetch in an `async` Server Component; stream with Suspense. With Cache Components, nothing is cached unless marked: `'use cache'` + `cacheLife`, tags with `cacheTag`, on-demand revalidation. Know that the previous model cached differently, and say which one you are describing. *From Vue:* `useAsyncData` and Nitro route rules. *Prereq: R24, R34.*"},{"id":"R36","title":"Server Functions and mutations","star":"","objective":"`'use server'`: a function the client calls like a local one and the framework turns into a POST. Using one as a form action; validating input, because it is a public endpoint; revalidating after the write. *From Vue:* a Nuxt server route called with `$fetch`. *Prereq: R27, R34.*"},{"id":"R37","title":"Rendering strategies","star":"core","objective":"CSR, SSR, SSG, ISR and Partial Prerendering as one spectrum: what is produced at build time, what at request time, and what streams. The static shell; `generateStaticParams`; hydration and hydration mismatches. *From Vue:* Nuxt's `ssr`, `prerender` and `swr`/`isr` route rules. *Prereq: R35.*"},{"id":"R38","title":"Proxy, metadata and error handling","star":"","objective":"Proxy (called Middleware before Next.js 16) runs before a request completes: redirects, rewrites, headers — and why it is not the place for authorisation logic. The Metadata API; `error.tsx` and `not-found.tsx`. *From Vue:* Nuxt route middleware, `useHead`/`useSeoMeta`, `error.vue`."}]},{"title":"Track RG — Build","topics":[{"id":"R39","title":"Milestone 1 — a client-side app","star":"","objective":"A typed, filterable list with add, edit and delete, using only React: derived state, lifted state, one custom hook, no effect that R14 would remove. *Prereq: tracks RA–RC.*"},{"id":"R40","title":"Milestone 2 — state and data","star":"","objective":"The same app against a real HTTP API: TanStack Query for server state with an optimistic mutation, one small store for client state, routing with a detail page. *Prereq: R39, track RE.*"},{"id":"R41","title":"Milestone 3 — move it to Next.js","star":"","objective":"The same app on the App Router: the list as a Server Component, the mutation as a Server Function, one cached and one streamed region, and a written note on what stayed a Client Component and why. *Prereq: R40, track RF.*"}]}]},{"name":"node","sections":[{"title":"Track NA — The runtime","topics":[{"id":"N01","title":"The event loop and async code","star":"core","objective":"One JS thread, the libuv pool behind it, and the phases of the loop; microtasks (promises) vs macrotasks (timers, I/O); why a CPU-heavy loop in one request stalls every other request; `async`/`await` as promise syntax; `Promise.all` vs awaiting in a loop. *From Spring:* a thread per request, where a slow request blocks only its own thread."},{"id":"N02","title":"Modules, TypeScript and the build","star":"core","objective":"CommonJS vs ES modules and why mixing them fails, `\"type\"` in `package.json`, `tsconfig` essentials (`strict`, `module`, `outDir`), running TS in development vs compiling for production, `dependencies` vs `devDependencies`, the lockfile. *From Spring:* Maven, the classpath, `javac`."}]},{"title":"Track NB — Express","topics":[{"id":"N03","title":"Routing and middleware","star":"core","objective":"An Express app is a list of `(req, res, next)` functions run in order; routers, path and query params, `express.json()`; why middleware order matters (auth after the route is no auth); a request that never calls `res` or `next` hangs. *From Spring:* `@RestController` mappings plus servlet filters and interceptors, ordered for you."},{"id":"N04","title":"Errors and validation","star":"core","objective":"The four-argument error handler; Express 5 forwards rejected promises from handlers, Express 4 did not; an error contract for responses; validating `req.body` at the boundary with a schema (zod) and inferring the TS type from it, because TypeScript types vanish at run time; `unhandledRejection` and why the process should exit. *From Spring:* `@ControllerAdvice` and Bean Validation. *Prereq: N03.*"},{"id":"N05","title":"Authentication with bcrypt and JWT","star":"core","objective":"Hashing with a cost factor, never encrypting passwords; issuing and verifying a JWT in middleware; what a JWT does not give you (revocation); access vs refresh tokens; cookie vs `Authorization` header and the XSS/CSRF trade-off. *From Spring:* the Spring Security filter chain and `PasswordEncoder`. *Prereq: N03.*"}]},{"title":"Track NC — Data, config and tests","topics":[{"id":"N06","title":"MongoDB with Mongoose","star":"core","objective":"Documents vs rows, schemas and models, embedding vs referencing and `populate`, indexes, `lean()`, validation in the schema vs at the boundary, the N+1 of populate in a loop. *From Spring:* JPA entities, relationships and fetch strategy."},{"id":"N07","title":"Configuration and production hardening","star":"senior","objective":"Environment variables and validating them at startup, `NODE_ENV`, CORS configured to an allow-list, security headers (helmet), rate limiting a login route, structured logging, graceful shutdown on `SIGTERM`. *From Spring:* `application.properties`, profiles and Actuator."},{"id":"N08","title":"Testing an API with Vitest and Supertest","star":"core","objective":"Exporting the app separately from `listen` so tests can call it; Supertest requests against the app in memory; a real test database vs mocking the model; testing the error contract and auth, not only the happy path. *From Spring:* `MockMvc` and `@SpringBootTest`. *Prereq: N04.*"}]}]},{"name":"delivery","sections":[{"title":"Track DA — Containers","topics":[{"id":"D01","title":"Images, containers and the Dockerfile","star":"core","objective":"Image vs container, layers and the build cache (why `COPY pom.xml` comes before `COPY src`), `CMD` vs `ENTRYPOINT`, `EXPOSE` is documentation, `.dockerignore`, multi-stage builds that ship a JRE and not a JDK, running as non-root."},{"id":"D02","title":"Docker Compose","star":"core","objective":"Services, the default network and service-name DNS (why `localhost` inside a container is the container), named volumes vs bind mounts, `env_file`, `depends_on` with a healthcheck vs without, rebuilding one service. *Prereq: D01.*"},{"id":"D03","title":"A Spring Boot API in a container","star":"core","objective":"Config through environment variables (relaxed binding: `SPRING_DATASOURCE_URL`), profiles per environment, secrets kept out of the image and the repo, layered jars, JVM memory inside a container limit, a health endpoint for the healthcheck. *Prereq: D01.*"},{"id":"D04","title":"A single-page app behind Nginx","star":"core","objective":"Build stage with Node, serve stage with Nginx; the SPA fallback (`try_files … /index.html`) and why a refresh on `/books/5` 404s without it; proxying `/api` to the backend service so the browser sees one origin and CORS disappears; build-time vs runtime environment variables in Vite. *Prereq: D02.*"}]},{"title":"Track DB — CI/CD","topics":[{"id":"D05","title":"GitHub Actions","star":"core","objective":"Workflow, job, step, runner; triggers (`push`, `pull_request`); jobs run in parallel on clean machines, so artifacts and caches move state between them; caching Maven and npm; service containers for a database in tests; secrets and why they are not passed to fork PRs; the status badge."},{"id":"D06","title":"Building and publishing images","star":"senior","objective":"Building images in CI, tagging by commit SHA vs `latest`, pushing to GitHub Container Registry with `GITHUB_TOKEN`, what \"continuous delivery\" vs \"continuous deployment\" means, a deploy job gated on the tests. *Prereq: D01, D05.*"}]},{"title":"Track DC — Frontend testing","topics":[{"id":"D07","title":"Unit and component tests with Vitest","star":"core","objective":"The test pyramid for a frontend; Vitest with jsdom; testing a component through what the user sees (roles, labels, text) rather than its internals; user events; mocking the HTTP layer instead of the component; testing a store or hook on its own. The React variant uses Testing Library, the Vue variant Vue Test Utils."},{"id":"D08","title":"End-to-end tests with Playwright","star":"core","objective":"What only an E2E test catches; locators by role, auto-waiting and why `sleep` is a defect; one login done once and reused; seeding test data; running headless in CI against a compose stack; traces for a failure that only happens in CI. *Prereq: D05.*"}]},{"title":"Track DD — Cloud and orchestration","topics":[{"id":"D09","title":"AWS basics for one application","star":"core","objective":"EC2 (an instance, a security group, an SSH key), RDS (a managed database, why it lives in a private subnet), S3 + CloudFront for a static frontend, IAM users vs roles, what costs money while idle. Only claim what was actually deployed."},{"id":"D10","title":"Kubernetes basics","star":"senior","objective":"Pod, Deployment, Service, ConfigMap, Secret; desired state and the control loop; what a Deployment adds over a pod; readiness vs liveness probes; moving a compose stack to a local `kind` cluster. *Prereq: D02.*"}]}]}],"completed":[{"id":"01","title":"Types, values and references","date":"2026-09-01, reviewed 2026-09-06","confidence":"solid","notes":"Review closed four of five weak spots. Exercise and task both clean on first attempt, diagnosed from symptoms with no TODOs."},{"id":"02a","title":"Strings — immutability, the pool, `==` vs `equals`","date":"2026-09-21","confidence":"ok","notes":"Exercise clean in one attempt. Drill: Q1 fully right with mechanism; Q2a answered the rule not the question; Q2b still ticked the blank final."},{"id":"02b","title":"Strings — `StringBuilder` and loop concatenation","date":"2026-09-22","confidence":"ok","notes":"Spotted the disguised `new StringBuilder(sb)` bug unprompted and fixed it. But located the cost in allocation rather than copying, and left the headline `toCsv` case untouched after writing the identical fix one method below."},{"id":"03a","title":"equals and hashCode — the contract, and how breaking it corrupts a `HashMap`","date":"2026-09-23","confidence":"shaky","notes":"Step 2 capped at two rounds. Nee o hints, each with the reason in a comment. Drill: Q2 (is `get` O(1)?) passed on the second asking with the tree reason; Q1 opened with \"the difference is the Big O\" and never said \"synchronized\", even when probed for it. Resizing and load factor not taught (08c)."},{"id":"09a","title":"`Comparable` vs `Comparator`","date":"2026-10-14","confidence":"shaky","notes":"Hands right, words wrong. Step 2: one of three (Comparator for `String` by length); `TreeSet` zero-means-duplicate and subtraction overflow both capped. Step 3: all three reports fixed first try, no hints (`thenComparing`, `Comparable` by name, `comparingInt`). Drill: lives-where and when-to-pick passed; the method names swapped in both questions and stayed swapped after both probes. Q2 got \"no, size 1, returned 0\" right. Iteration and fail-fast not taught (09b)."},{"id":"10a","title":"Lambdas, functional interfaces, method references","date":"2026-10-19","confidence":"shaky","notes":"The rule landed, the mechanism didn't. Step 3: A (plain loop instead of capturing `count`) and B (`String::startsWith` receiver order) fixed first try, with no *why* comments. C (`() -> EMPTY` shared list) needed the solution after hint 1. Drill: Q1 got \"the lambda copies the value\" but not the stack frame, and said a field is copied too. Q2 called a functional interface \"an annotation\" (corrected after a probe) and never reached why `equals` doesn't count. Streams not taught (10b), so SOURCES row 20 stays open."}],"scratched":[{"id":"10","title":"Streams — lazy pipelines, intermediate vs terminal, `map` vs `flatMap`, `parallelStream`","date":"2026-10-27"},{"id":"12","title":"Exceptions — hierarchy, checked vs unchecked, `throw` vs `throws`, catch ordering","date":"2026-10-27"},{"id":"14","title":"Immutability and defensive copying","date":"2026-10-27"},{"id":"07","title":"Generics and erasure — erasure, invariance, PECS, bridge methods","date":"2026-10-28"},{"id":"11","title":"Optional — return type only, `map` ch
