<!doctype html>
<!-- The learning dashboard, laid out like a course (docs/specs/dashboard-redesign.md): a nested track tree,
     the open topic on a stage, its details on the right, and a Progress tab with the cell grid, calendar
     and due list. Draws window.DASHBOARD from dashboard-data.js, which `node dashboard.mjs` writes (the
     progress band's dashboard button runs it first). Figures talk to this page through atlas/course-figure.js. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="dashboard-data.js"></script>
<style>
:root {
  --paper:#f4ebe0; --card:#f7efe4; --line:#ddd3c5; --edge:#46413b; --ink:#1d1b18; --muted:#6f6961;
  --green:#cfe3b2; --violet:#e7ddf5; --orange:#fcdcbd; --mint:#dff0de; --rust:#d0683a;
  --g0:#e6ddd0; --g1:#9be9a8; --g2:#40c463; --g3:#30a14e; --g4:#216e39;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --lift:inset 0 1px 0 #ffffffa6, 0 10px 22px -16px rgba(80,60,35,.35);
}
* { box-sizing:border-box; }
html { color-scheme:light; }
html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:14px/1.55 Inter,system-ui,sans-serif; }
body { display:flex; flex-direction:column; overflow:hidden; }
code { font:12.5px var(--mono); background:#0000000d; padding:1px 5px; border-radius:4px; }
pre { background:#fffaf3; border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; }
pre code { background:none; padding:0; }
h1, h2, h3, .mono { font-family:var(--mono); }
.muted { color:var(--muted); }
.ar-summary { flex:none; direction:rtl; text-align:right; margin:0; padding:7px 16px; background:var(--mint); border-bottom:1.2px solid var(--line); font-size:13.5px; }
.top { flex:none; display:flex; align-items:center; gap:14px; padding:7px 14px; border-bottom:1.2px solid var(--line); }
.top b { font:700 14px var(--mono); }
.top .upd { margin-left:auto; font-size:11.5px; color:var(--muted); white-space:nowrap; }
.search { display:flex; align-items:center; justify-content:space-between; gap:18px; width:320px; white-space:nowrap; padding:4px 10px; font:12.5px Inter,system-ui,sans-serif; color:var(--muted); background:var(--card); border:1.2px solid var(--line); border-radius:8px; cursor:pointer; }
.search kbd { font:500 10.5px var(--mono); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
.app { flex:1; min-height:0; display:grid; grid-template-columns:248px minmax(0,1fr) 320px; }
.app.wide { grid-template-columns:248px minmax(0,1fr); }
.app.wide #panel { display:none; }

.pop { font:500 13px var(--mono); border:1.2px solid var(--edge); background:var(--card); color:var(--ink); border-radius:8px; padding:5px 10px; cursor:pointer;
  box-shadow:inset 0 1px 0 #fff8, 1.5px 2.5px 0 #1d1b18; transition:transform .08s, box-shadow .08s; }
.pop.on { background:var(--green); }
.pop:active { transform:translate(1px,2px); box-shadow:none; }
.card { background:var(--card); border:1.2px solid var(--line); border-radius:12px; box-shadow:var(--lift); padding:14px 16px; }

#side { border-right:1.2px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.tabs { display:flex; gap:8px; padding:12px 12px 10px; }
.tree { flex:1; overflow:auto; padding:2px 8px 12px; }
.fold { margin:3px 0; }
.fh { display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:8px; cursor:pointer; font:500 12.5px var(--mono); user-select:none; }
.fh:hover { filter:brightness(.97); }
.chev { transition:transform .34s var(--ease); font-size:10px; width:10px; flex:none; }
.fold.open > .fh .chev { transform:rotate(90deg); }
.fh .n { margin-left:auto; font-size:11px; color:var(--muted); flex:none; }
.fh .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kids { display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s var(--ease); }
.fold.open > .kids { grid-template-rows:1fr; }
.kids > div { overflow:hidden; min-height:0; padding-left:12px; }
.trackf > .fh { border:1.2px solid var(--line); text-transform:capitalize; }
.tp { display:flex; align-items:center; gap:7px; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; }
.tp:hover { background:#0000000a; }
.tp.on { background:var(--card); box-shadow:inset 0 0 0 1.2px var(--edge); }
.tp .id { font:500 11px var(--mono); color:var(--muted); min-width:28px; }
.tp .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:9px; height:9px; border-radius:50%; flex:none; border:1px solid #0002; }
.due-mark { color:var(--rust); font-size:11px; }
.bar { padding:12px; border-top:1.2px solid var(--line); font:500 11.5px var(--mono); color:var(--muted); }
.track-bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px; }
.fill { height:100%; background:var(--g2); border-radius:99px; }

#stage { position:relative; overflow:auto; min-width:0; min-height:0; padding:22px;
  background-color:var(--paper); background-image:radial-gradient(#cfc3b2 1px, transparent 1.2px); background-size:18px 18px; }
#stage.fit { overflow:hidden; padding:14px 22px 16px; }
.fx { display:flex; flex-direction:column; height:100%; min-height:0; font-family:var(--mono); }
.crumb { font-size:12px; color:var(--muted); text-transform:capitalize; }
.fx-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.fx-head h1 { margin:2px 0; font-size:24px; letter-spacing:-.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chips { display:flex; gap:6px; flex:none; }
.chips span { font-size:11.5px; padding:3px 10px; border:1.2px solid var(--edge); border-radius:99px; box-shadow:1px 1.5px 0 #1d1b18; white-space:nowrap; }
.fx-sub { color:var(--muted); font:12.5px Inter,system-ui,sans-serif; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fx-parts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 8px; font-size:11.5px; color:var(--muted); }
.fx-parts .pop { font-size:11.5px; padding:3px 10px; max-width:300px; display:flex; gap:6px; }
.fx-parts .pn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:400; }
.fx-card { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding:12px 14px;
  background-image:repeating-linear-gradient(30deg, #e6dccd 0 1px, transparent 1px 26px), repeating-linear-gradient(150deg, #e6dccd 0 1px, transparent 1px 26px); }
.fx-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.tiles { display:flex; gap:8px; flex-wrap:wrap; min-width:0; max-height:50px; overflow:hidden; }
.mt { background:#fffaf2; border:1.2px solid var(--line); border-left:4px solid #5fae5a; border-radius:8px; padding:3px 10px; min-width:90px; }
.mt-k { font-size:10.5px; color:var(--muted); } .mt-v { font-size:14px; font-weight:700; }
.fx-nav { display:flex; gap:8px; align-items:center; flex:none; font-size:11px; color:var(--muted); }
.fx-nav .hint { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fx-nav .pop { padding:3px 9px; font-size:12px; }
.fx-wrap { position:relative; flex:1; min-height:0; }
.fx-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; display:block; }
.zoom { display:flex; align-items:center; gap:2px; padding:2px; background:#fffaf2; border:1.2px solid var(--line); border-radius:9px; font-size:11px; color:var(--muted); }
.zoom button { width:24px; height:22px; padding:0; font:600 13px var(--mono); border:0; border-radius:6px; background:none; color:var(--ink); cursor:pointer; }
.zoom button:hover { background:var(--green); }
.zoom span { min-width:38px; text-align:center; }
.empty-state { max-width:520px; margin:12vh auto 0; text-align:center; }
.empty-state .big { font:700 48px var(--mono); color:var(--muted); }
.md { font-size:14px; max-width:820px; margin:0 auto; }
.md h1 { font-size:19px; } .md h2 { font-size:16px; margin-top:20px; } .md h3 { font-size:14.5px; }
.md table { border-collapse:collapse; margin:8px 0; font-size:13px; } .md td, .md th { border:1px solid var(--line); padding:4px 8px; text-align:left; }
.md [dir="rtl"] { text-align:right; }

#panel { border-left:1.2px solid var(--line); overflow:hidden; padding:16px 16px 14px; background:var(--card); display:flex; flex-direction:column; min-height:0; font-size:13px; }
#panel > * { flex:none; }
.clamp { display:-webkit-box; -webkit-line-clamp:var(--n); -webkit-box-orient:vertical; overflow:hidden; }
.one { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12.5px; }
#panel .fade { flex:1 1 0; min-height:2.6em; overflow:hidden; font-size:12.5px; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
.spacer { flex:1 1 0 !important; }
.ar { direction:rtl; text-align:right; font:13.5px/1.85 "Segoe UI",Tahoma,system-ui,sans-serif; }
.ar p { margin:0 0 4px; }
.ar bdi { font-family:var(--mono); font-size:12px; }
.link { background:none; border:0; padding:4px 0; font:600 12px var(--mono); color:var(--rust); cursor:pointer; text-align:left; }
.k { font:500 11px var(--mono); color:var(--muted); text-transform:uppercase; margin:12px 0 4px; }
.pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:1px 8px; border-radius:99px; background:#0000000d; color:var(--muted); white-space:nowrap; }
.pill.due { background:#f6d9cb; color:var(--rust); font-weight:600; }
.weak { background:var(--orange); border-radius:8px; padding:8px 12px; font-size:13px; }
ul.parts { margin:0; padding-left:16px; font-size:12.5px; }

#reader { position:fixed; top:0; right:0; bottom:0; width:min(620px,100vw); background:var(--card); border-left:1.2px solid var(--edge); box-shadow:-14px 0 30px -18px rgba(80,60,35,.5);
  transform:translateX(105%); visibility:hidden; transition:transform .34s var(--ease), visibility 0s .34s; z-index:60; overflow:auto; padding:18px 22px 60px; }
#reader.open { transform:none; visibility:visible; transition:transform .34s var(--ease); }
#reader .close { float:right; }

#pal { position:fixed; inset:0; z-index:80; background:#1d1b1833; display:flex; justify-content:center; align-items:flex-start; padding:9vh 16px 16px; }
#pal[hidden] { display:none; }
.pal-box { width:min(620px,100%); max-height:72vh; display:flex; flex-direction:column; padding:0; overflow:hidden; border-color:var(--edge); }
#pal-q { flex:none; width:100%; border:0; border-bottom:1.2px solid var(--line); background:none; padding:12px 16px; font:15px Inter,system-ui,sans-serif; color:var(--ink); outline:none; }
#pal-list { overflow:auto; padding:6px 8px 10px; }
.pal-h { display:flex; justify-content:space-between; gap:10px; font:500 10.5px var(--mono); color:var(--muted); text-transform:uppercase; padding:8px 8px 3px; }
.pal-i { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; cursor:pointer; font-size:13px; }
.pal-i.on { background:var(--green); }
.pal-i .id { font:500 11px var(--mono); color:var(--muted); min-width:30px; }
.pal-i .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.cols { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start; }
@media (max-width:1100px) { .cols { grid-template-columns:minmax(0,1fr); } }
.ptrack { display:grid; grid-template-columns:80px 1fr; gap:10px; margin-bottom:16px; }
.ptrack b { text-transform:capitalize; font-family:var(--mono); }
.secs { display:flex; flex-wrap:wrap; gap:10px 12px; }
.sec-l { font:500 10px var(--mono); color:var(--muted); text-transform:uppercase; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cells { display:flex; flex-wrap:wrap; gap:4px; }
.pt { width:72px; height:72px; border-radius:6px; padding:3px 5px; display:flex; flex-direction:column; cursor:pointer; transition:transform .1s; }
.pt:hover { transform:scale(1.06); position:relative; z-index:2; }
.pt-id { font:700 18px/1.1 var(--mono); text-align:center; margin:8px 0 2px; }
.pt-name { font-size:8.5px; line-height:1.15; text-align:center; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.cal { width:14px; height:14px; border-radius:3px; cursor:pointer; }
.due-row { display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; }
.due-row:hover { background:#0000000a; }
</style>
</head>
<body>
<p class="ar-summary">‫على الشمال كل الـ tracks والمواضيع، في النص الـ figure أو الملخص بتاع الموضوع، وعلى اليمين تفاصيله. تاب Progress فيه المربعات والأيام والمراجعات، و Ctrl K بيدور في كل حاجة.‬</p>
<header class="top"><b>Learning dashboard</b><button class="search" data-search><span>Search topics and summary cards</span><kbd>Ctrl K</kbd></button><span class="upd" id="upd"></span></header>
<div class="app" id="app"><nav id="side"></nav><main id="stage"></main><aside id="panel"></aside></div>
<aside id="reader"></aside>
<div id="pal" hidden><div class="card pal-box"><input id="pal-q" placeholder="Search topic id, title, objective, summary card" aria-label="Search" autocomplete="off"><div id="pal-list"></div></div></div>
<script>
const D = window.DASHBOARD;
if (!D) {
  document.getElementById('app').innerHTML = '<div style="padding:24px"><h1>No data yet</h1><p>Run <code>node dashboard.mjs</code> in the repo root, then reload this page.</p></div>';
  throw new Error('dashboard-data.js missing');
}

// ---------------- the model ----------------
const TODAY = new Date().toLocaleDateString('en-CA');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const tick = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const GREEN = ['var(--g0)', 'var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)'];
// One green scale for cells and calendar: how far along a topic is.
const STATUS = {
  'not-started': { label:'Not started', level:0 }, 'scratched': { label:'Scratched', level:1 },
  'in-progress': { label:'In progress', level:1 }, 'shaky': { label:'Done · shaky', level:2 },
  'ok': { label:'Done · ok', level:3 }, 'solid': { label:'Done · solid', level:4 },
};
// A curriculum row ("02") can be taught in parts ("02a", "02b"): every part found anywhere joins its row.
const partIds = new Set([...D.completed.map(c => c.id), ...D.scratched.map(s => s.id), ...D.review.map(r => r.id),
  ...Object.keys(D.summaries), ...Object.keys(D.figures)]);
const byId = (list, id) => list.find(x => x.id === id);
// Same rule as the progress band: a split topic shows its weakest finished part.
function statusOf(topic) {
  if (topic.isCurrent) return 'in-progress';
  const conf = topic.parts.map(p => p.completed?.confidence).filter(Boolean);
  if (conf.length) return conf.includes('shaky') ? 'shaky' : conf.includes('ok') ? 'ok' : 'solid';
  return topic.parts.some(p => p.scratched) ? 'scratched' : 'not-started';
}
const TOPICS = [];
for (const track of D.tracks) for (const section of track.sections) for (const t of section.topics) {
  const parts = [...partIds].filter(p => p === t.id || new RegExp(`^${t.id}[a-z]$`).test(p)).sort().map(id => ({
    id, completed: byId(D.completed, id), scratched: byId(D.scratched, id), review: byId(D.review, id),
    summary: D.summaries[id], figure: D.figures[id], weak: D.weak.filter(w => w.topic === id),
  }));
  const cur = D.current[track.name] || '';
  const topic = { ...t, track: track.name, section: section.title, parts,
    isCurrent: new RegExp(`^Topic: ${t.id}[a-z]? `).test(cur) && !/Step: not started/.test(cur) };
  topic.status = statusOf(topic);
  topic.nextDue = parts.map(p => p.review?.due).filter(Boolean).sort()[0] || '';
  topic.due = !!topic.nextDue && topic.nextDue <= TODAY;
  topic.summaries = parts.filter(p => p.summary);
  topic.figures = parts.filter(p => p.figure);
  topic.weak = parts.flatMap(p => p.weak);
  topic.head = `${t.id} ${t.title} ${t.objective}`.toLowerCase();
  topic.body = topic.summaries.map(p => p.summary.md).join('\n').toLowerCase();
  TOPICS.push(topic);
}
const key = t => `${t.track}:${t.id}`;
const find = k => TOPICS.find(t => key(t) === k);
const isDone = t => STATUS[t.status].level >= 1 && t.status !== 'in-progress';
const lvl = t => STATUS[t.status].level;
const sectionName = s => s.replace(/^Track /, '');
const countDone = list => `${list.filter(isDone).length}/${list.length}`;
const md = text => (window.marked ? marked.parse(text) : `<pre>${esc(text)}</pre>`).replace(/<(p|li|h[1-6]|td|blockquote)>/g, '<$1 dir="auto">');
const due = TOPICS.flatMap(t => t.parts.filter(p => p.review && p.review.due <= TODAY).map(p => ({ t, p }))).sort((a, b) => a.p.review.due.localeCompare(b.p.review.due));
// The focused track: the one whose Current line is not "Paused".
const FOCUS = D.tracks.map(t => t.name).find(n => !/Paused/.test(D.current[n] || '')) || D.tracks[0].name;

// ---------------- the study calendar ----------------
const events = {};
const addEvent = (day, id, what) => (events[day] ||= []).push({ id, what, t: TOPICS.find(x => x.parts.some(p => p.id === id)) });
for (const c of D.completed) (c.date.match(/\d{4}-\d{2}-\d{2}/g) || []).forEach((d, i) => addEvent(d, c.id, i ? 'reviewed' : 'lesson'));
for (const s of D.scratched) addEvent(s.date, s.id, 'scratched');
for (const r of D.review) if (r.last) addEvent(r.last, r.id, 're-read');
function calendar() {
  const days = Object.keys(events).sort();
  const start = new Date((days[0] || TODAY) + 'T00:00'); start.setDate(start.getDate() - start.getDay());
  const end = new Date(TODAY + 'T00:00'); end.setDate(end.getDate() + 6 - end.getDay());
  const weeks = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 7)) weeks.push(new Date(d));
  const shown = weeks.slice(-16);
  const level = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
  return `<div style="display:inline-grid;grid-template-columns:20px repeat(${shown.length},14px);grid-template-rows:16px repeat(7,14px);gap:4px">
    ${shown.map((w, i) => `<div style="grid-row:1;grid-column:${i + 2};font-size:10px;color:var(--muted);white-space:nowrap">${i === 0 || shown[i - 1].getMonth() !== w.getMonth() ? w.toLocaleString('en', { month:'short' }) : ''}</div>`).join('')}
    ${'SMTWTFS'.split('').map((l, r) => `<div style="grid-row:${r + 2};grid-column:1;font-size:10px;color:var(--muted);line-height:14px">${l}</div>`).join('')}
    ${shown.flatMap((w, c) => [...Array(7)].map((_, r) => {
      const d = new Date(w); d.setDate(d.getDate() + r);
      const k = d.toLocaleDateString('en-CA'), n = (events[k] || []).length;
      return `<div class="cal" data-day="${k}" title="${k}: ${n} item${n === 1 ? '' : 's'}" style="grid-row:${r + 2};grid-column:${c + 2};background:${k > TODAY ? 'transparent' : GREEN[level(n)]};${k === TODAY ? 'outline:2px solid var(--rust);outline-offset:1px;' : ''}"></div>`;
    })).join('')}
  </div>`;
}

// ---------------- page state ----------------
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const LAST = 'dashboard-last-topic', RECENT = 'dashboard-recent-topics';
const curId = (D.current[FOCUS] || '').match(/^Topic: (\S+)/)?.[1];
const S = {
  tab: 'Learn', part: null, folds: new Set(), info: null,
  open: find(store.get(LAST)) || TOPICS.find(t => t.track === FOCUS && (t.id === curId || (curId && /[a-z]$/.test(curId) && curId.startsWith(t.id)))) || TOPICS.find(t => t.track === FOCUS),
};
let recent = [];
try { recent = JSON.parse(store.get(RECENT) || '[]').filter(find); } catch {}
const FOLD_COLORS = ['var(--green)', 'var(--violet)', 'var(--orange)', 'var(--mint)'];
const foldKey = (track, sec) => sec ? `${track}|${sec}` : track;
const [side, stage, panel, appEl, reader, pal, palQ, palList] = ['side', 'stage', 'panel', 'app', 'reader', 'pal', 'pal-q', 'pal-list'].map(id => document.getElementById(id));
document.getElementById('upd').textContent = `updated ${new Date(D.generated).toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' })}`;

// ---------------- sidebar ----------------
const tpRow = t => `<div class="tp ${t === S.open ? 'on' : ''}" data-open="${key(t)}"><span class="dot" style="background:${GREEN[lvl(t)]}"></span><span class="id">${t.id}</span><span class="t">${esc(t.title)}</span>${t.due ? '<span class="due-mark" title="review due">●</span>' : ''}${t.figures.length ? '<span class="muted" style="font-size:10px" title="has figure">▣</span>' : ''}</div>`;
const fold = (k, label, count, color, inner, cls = '') =>
  `<div class="fold ${cls} ${S.folds.has(k) ? 'open' : ''}" data-fold="${esc(k)}"><div class="fh" style="${color ? `background:${color}` : ''}"><span class="chev">▶</span><span class="nm">${esc(label)}</span><span class="n">${count}</span></div><div class="kids"><div>${inner}</div></div></div>`;
function renderSide() {
  const top = side.querySelector('.tree')?.scrollTop || 0;
  const tree = D.tracks.map(track => {
    const inTrack = TOPICS.filter(t => t.track === track.name);
    const sections = track.sections.map((s, i) => {
      const list = inTrack.filter(t => t.section === s.title);
      return fold(foldKey(track.name, s.title), sectionName(s.title), countDone(list), FOLD_COLORS[i % FOLD_COLORS.length], list.map(tpRow).join(''));
    }).join('');
    return fold(foldKey(track.name), track.name, countDone(inTrack), '', sections, 'trackf');
  }).join('');
  const done = TOPICS.filter(isDone).length;
  side.innerHTML = `<div class="tabs">${['Learn', 'Progress'].map(n => `<button class="pop ${n === S.tab ? 'on' : ''}" data-tab="${n}">${n}</button>`).join('')}</div>
    <div class="tree">${tree}</div>
    <div class="bar">all tracks · ${done}/${TOPICS.length} topics<div class="track-bar"><div class="fill" style="width:${(100 * done / TOPICS.length).toFixed(1)}%"></div></div></div>`;
  side.querySelector('.tree').scrollTop = top;
}
function openFoldsFor(t) { S.folds.add(foldKey(t.track)); S.folds.add(foldKey(t.track, t.section)); }

// ---------------- stage and right panel ----------------
const statusPill = t => `<span class="pill"><span class="dot" style="background:${GREEN[lvl(t)]}"></span>${STATUS[t.status].label}</span>`;
const duePill = t => t.due ? `<span class="pill due">Due ${t.nextDue === TODAY ? 'today' : t.nextDue}</span>` : t.nextDue ? `<span class="pill">Review ${t.nextDue}</span>` : '<span class="pill">No review yet</span>';
const cardsOf = t => t.summaries.map(p => `<div class="md"><span class="pill">${p.id} · ${p.summary.kind}</span>${md(p.summary.md)}</div>`).join('');
// A part's name: its summary card heading; the figure's own title replaces it once loaded.
const FIG_TITLES = {};
const partName = p => FIG_TITLES[p.id] || p.summary?.md.match(/^#+\s*\S+\s+—\s+(.+)$/m)?.[1].replace(/\s*★\s*$/, '') || 'figure';
const tilesFrom = text => text.split(/\s+·\s+/).filter(Boolean).map(part => {
  const i = part.lastIndexOf(' '), k = i > 0 ? part.slice(0, i).replace(/\s+[=:]$/, '') : '', v = i > 0 ? part.slice(i + 1) : part;
  return `<div class="mt"><div class="mt-k">${esc(k) || '&nbsp;'}</div><div class="mt-v">${esc(v)}</div></div>`;
}).join('');
const figureShell = (t, fig) => `<div class="fx">
    <div class="crumb">${t.track} · ${esc(sectionName(t.section))} / Topic ${t.id}${fig.id !== t.id ? ` · part ${fig.id}` : ''}</div>
    <div class="fx-head"><h1>${esc(t.title)}</h1><div class="chips">
      ${t.figures.length > 1 ? '' : `<span style="background:var(--violet)" id="fx-fig">Fig ${fig.id}</span>`}${t.star === 'core' ? '<span style="background:var(--green)">★ core</span>' : ''}<span style="background:var(--orange)">${STATUS[t.status].label}</span></div></div>
    ${t.figures.length > 1 ? `<div class="fx-parts"><span>${t.figures.length} parts, one figure each:</span>${t.figures.map(p =>
      `<button class="pop ${p === fig ? 'on' : ''}" data-part="${p.id}" title="${esc(partName(p))}"><b>${p.id}</b> <span class="pn" ${p === fig ? 'id="fx-fig"' : ''}>${esc(partName(p))}</span></button>`).join('')}</div>` : ''}
    <div class="fx-sub">${tick(t.objective)}</div>
    <div class="card fx-card">
      <div class="fx-top"><div class="tiles" id="fx-tiles"></div>
        <div class="fx-nav"><span class="hint" id="fx-hint"></span>
          <div class="zoom"><button data-zoom="-1" title="Zoom out" aria-label="Zoom out">−</button><span id="fx-zoom">100%</span><button data-zoom="1" title="Zoom in" aria-label="Zoom in">+</button><button data-zoom="0" title="Reset" aria-label="Reset zoom">⟲</button></div>
          <span id="fx-arrows" hidden><button class="pop" data-key="ArrowLeft" title="Previous" aria-label="Previous">◀</button> <button class="pop" data-key="ArrowRight" title="Next" aria-label="Next">▶</button></span></div></div>
      <div class="fx-wrap"><iframe class="fx-frame" src="${fig.figure}#course" title="${fig.id} figure"></iframe></div>
    </div></div>`;
function renderLearn() {
  const t = S.open, fig = t.figures.find(p => p.id === S.part) || t.figures[0];
  appEl.classList.remove('wide');
  stage.classList.toggle('fit', !!fig);
  S.info = null;
  if (fig) stage.innerHTML = figureShell(t, fig);
  else if (t.summaries.length) stage.innerHTML = `<div class="card">${cardsOf(t)}</div>`;
  else stage.innerHTML = `<div class="empty-state card"><div class="big">${t.id}</div><h2 style="margin:4px 0">${esc(t.title)}</h2><p class="muted">Not studied yet.</p><p>${tick(t.objective)}</p></div>`;
  const short = p => `<div class="one"><b class="mono">${p.id}</b> ${p.completed ? `${esc(p.completed.confidence)} · ${esc(p.completed.date.slice(0, 10))}` : p.scratched ? 'scratched' : '—'}${p.review ? ` · review ${p.review.due.slice(5)}` : ''}</div>`;
  panel.innerHTML = `<div class="muted mono" style="font-size:11px;text-transform:capitalize">${t.track} · ${esc(sectionName(t.section))}</div>
    <h2 style="margin:2px 0 8px;font-size:17px">${t.id} · ${esc(t.title)} ${t.star === 'core' ? '★' : t.star === 'senior' ? '☆' : ''}</h2>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${statusPill(t)}${duePill(t)}</div>
    <div class="k">Objective</div><div class="clamp" style="--n:4">${tick(t.objective)}</div>
    <div class="k">Parts</div>${t.parts.length ? t.parts.slice(0, 4).map(short).join('') + (t.parts.length > 4 ? `<div class="muted">+${t.parts.length - 4} more</div>` : '') : '<div class="muted">No parts recorded.</div>'}
    ${t.weak.length ? `<div class="k">Weak spots · ${t.weak.length}</div><div class="weak">${t.weak.slice(0, 2).map(w => `<div class="one">• ${tick(w.label)}</div>`).join('')}${t.weak.length > 2 ? `<div class="muted">+${t.weak.length - 2} more</div>` : ''}</div>` : ''}
    ${fig ? '<div class="k" dir="rtl" style="text-align:right">باختصار</div><div id="fx-caption" class="fade ar"></div>' : '<div class="spacer"></div>'}
    <button class="link" data-reader>Read more ›</button>
    ${fig && t.summaries.length ? '<button class="pop on" data-reader="card" style="width:100%;margin-top:8px">Open summary card ›</button>' : ''}`;
}
function readerHTML() {
  const t = S.open, hasFig = t.figures.length > 0;
  const meta = t.parts.map(p => `<li><b class="mono">${p.id}</b> — ${p.completed ? `done ${esc(p.completed.date)}, <b>${esc(p.completed.confidence)}</b>` : p.scratched ? `scratched ${esc(p.scratched.date)}` : 'no record'}${p.review ? ` · review ${p.review.due} (every ${p.review.rung} days)` : ''}</li>`).join('');
  return `<button class="pop close" data-close aria-label="Close">✕</button>
    <div class="muted mono" style="font-size:11px;text-transform:capitalize">${t.track} · ${esc(sectionName(t.section))}</div>
    <h2 style="margin:2px 0 8px;font-size:18px">${t.id} · ${esc(t.title)}</h2>
    ${S.info?.ar ? `<div class="k" dir="rtl" style="text-align:right">باختصار</div><div class="ar">${S.info.ar}</div>` : ''}
    ${S.info?.caption ? `<div class="k">What the figure shows</div><p style="margin:0">${esc(S.info.caption)}</p>` : ''}
    <div class="k">Objective</div><div>${tick(t.objective)}</div>
    ${meta ? `<div class="k">Parts</div><ul class="parts">${meta}</ul>` : ''}
    ${t.weak.length ? `<div class="k">Weak spots</div><div class="weak"><ul style="margin:0;padding-left:16px">${t.weak.map(w => `<li>${tick(w.label)} <span class="pill">${w.held}/2 held</span></li>`).join('')}</ul></div>` : ''}
    ${hasFig && t.summaries.length ? `<div class="k" id="rd-card">Summary card</div>${cardsOf(t)}` : ''}`;
}
// What the open figure reports. Only the iframe on the stage is listened to.
addEventListener('message', e => {
  const f = stage.querySelector('.fx-frame'), m = e.data;
  if (!f || e.source !== f.contentWindow || !m?.course) return;
  const el = id => document.getElementById(id);
  if (m.course === 'readout') el('fx-tiles').innerHTML = tilesFrom(m.text);
  if (m.course === 'zoom') el('fx-zoom').textContent = `${Math.round(m.z * 100)}%`;
  if (m.course === 'search') openSearch();
  if (m.course === 'ready') {
    S.info = m;
    const id = f.title.split(' ')[0], figEl = el('fx-fig');
    if (m.title) { FIG_TITLES[id] = m.title; if (figEl) figEl.textContent = figEl.classList.contains('pn') ? m.title : `Fig ${id} · ${m.title}`; }
    el('fx-hint').textContent = m.hint;
    el('fx-arrows').hidden = !m.nav;
    el('fx-tiles').innerHTML = tilesFrom(m.readout);
    const cap = el('fx-caption');
    if (m.ar) cap.innerHTML = m.ar; else cap.textContent = m.caption;
  }
});

// ---------------- progress tab ----------------
const cell = t => `<div class="pt" data-open="${key(t)}" title="${esc(`${t.id} · ${t.title} — ${STATUS[t.status].label}`)}" style="background:${GREEN[lvl(t)]};color:${lvl(t) >= 3 ? '#fff' : '#1f3d27'};${t.due ? 'outline:2px solid var(--rust);outline-offset:1px;' : ''}">
  <div class="pt-id">${t.id}</div><div class="pt-name">${esc(t.title)}</div></div>`;
const dueList = () => due.map(({ t, p }) => `<div class="due-row" data-open="${key(t)}"><code>${p.id}</code><span style="flex:1">${esc(t.title)}</span><span class="pill">${p.review.due === TODAY ? 'today' : p.review.due}</span></div>`).join('') || '<p class="muted">Nothing due.</p>';
function renderProgress() {
  appEl.classList.add('wide');
  stage.classList.remove('fit');
  stage.innerHTML = `<div class="cols"><section class="card" style="min-width:0"><h2 style="margin:0 0 10px;font-size:15px">Every topic</h2>
      ${D.tracks.map(track => { const list = TOPICS.filter(t => t.track === track.name); return `
        <div class="ptrack"><div><b>${track.name}</b><div class="muted" style="font-size:11px">${countDone(list)}</div></div>
          <div class="secs">${track.sections.map(s => { const ts = list.filter(t => t.section === s.title); return `<div style="max-width:${Math.min(ts.length, 5) * 76}px">
            <div class="sec-l" title="${esc(s.title)}">${esc(sectionName(s.title))}</div><div class="cells">${ts.map(cell).join('')}</div></div>`; }).join('')}</div></div>`; }).join('')}
    </section>
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="card" style="overflow-x:auto"><h2 style="margin:0 0 8px;font-size:15px">Study days</h2>${calendar()}<div class="day muted" style="margin-top:8px;font-size:12.5px">Click a day to see what you did.</div></section>
      <section class="card"><h2 style="margin:0 0 6px;font-size:15px">Due for review <span class="pill due">${due.length}</span></h2><div style="max-height:300px;overflow:auto">${dueList()}</div></section>
    </div></div>`;
}
function render() {
  renderSide();
  (S.tab === 'Learn' ? renderLearn : renderProgress)();
  stage.scrollTop = 0;
}
function openTopic(t) {
  S.open = t; S.part = null; S.tab = 'Learn'; openFoldsFor(t);
  store.set(LAST, key(t));
  recent = [key(t), ...recent.filter(k => k !== key(t))].slice(0, 5);
  store.set(RECENT, JSON.stringify(recent));
  render();
  side.querySelector('.tp.on')?.scrollIntoView({ block: 'nearest' });
}

// ---------------- search ----------------
let palItems = [], palAt = 0;
function renderPal() {
  const q = palQ.value.trim().toLowerCase();
  const hit = t => !q || t.head.includes(q) || t.body.includes(q);
  const row = t => { palItems.push(t); const i = palItems.length - 1;
    return `<div class="pal-i ${i === palAt ? 'on' : ''}" data-open="${key(t)}" data-i="${i}"><span class="dot" style="background:${GREEN[lvl(t)]}"></span><span class="id">${t.id}</span><span class="t">${esc(t.title)}</span>${q && !t.head.includes(q) ? '<span class="pill">summary card</span>' : ''}</div>`; };
  palItems = [];
  const rec = recent.map(find).filter(hit);
  let html = rec.length ? `<div class="pal-h"><span>Recent</span></div>${rec.map(row).join('')}` : '';
  for (const track of D.tracks) for (const s of track.sections) {
    const all = TOPICS.filter(t => t.track === track.name && t.section === s.title);
    const list = all.filter(t => hit(t) && !rec.includes(t));
    if (list.length) html += `<div class="pal-h"><span>${esc(track.name)} · ${esc(sectionName(s.title))}</span><span>${countDone(all)}</span></div>${list.map(row).join('')}`;
  }
  palList.innerHTML = html || '<p class="muted" style="padding:8px">No topic matches.</p>';
  palList.querySelector('.pal-i.on')?.scrollIntoView({ block: 'nearest' });
}
function openSearch() { reader.classList.remove('open'); pal.hidden = false; palQ.value = ''; palAt = 0; renderPal(); palQ.focus(); }
const closeSearch = () => { pal.hidden = true; };
palQ.addEventListener('input', () => { palAt = 0; renderPal(); });
palQ.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (palItems.length) { palAt = (palAt + (e.key === 'ArrowDown' ? 1 : palItems.length - 1)) % palItems.length; renderPal(); }
  } else if (e.key === 'Enter' && palItems[palAt]) { closeSearch(); openTopic(palItems[palAt]); }
});

// ---------------- events ----------------
const toFigure = m => stage.querySelector('.fx-frame')?.contentWindow.postMessage(m, '*');
document.addEventListener('click', e => {
  if (e.target.closest('[data-search]')) return openSearch();
  if (e.target === pal) return closeSearch();
  const rd = e.target.closest('[data-reader]');
  if (rd) {
    reader.innerHTML = readerHTML(); reader.scrollTop = 0; reader.classList.add('open');
    if (rd.dataset.reader === 'card') document.getElementById('rd-card')?.scrollIntoView();
    return;
  }
  if (e.target.closest('[data-close]') || (reader.classList.contains('open') && !e.target.closest('#reader'))) reader.classList.remove('open');
  const el = e.target.closest('[data-open],[data-fold],[data-tab],[data-part],[data-key],[data-zoom],.cal');
  if (!el) return;
  if (el.dataset.key) return toFigure({ course: 'key', key: el.dataset.key });
  if (el.dataset.zoom !== undefined) return toFigure({ course: 'zoom', dir: +el.dataset.zoom });
  if (el.dataset.open) { closeSearch(); return openTopic(find(el.dataset.open)); }
  if (el.dataset.fold !== undefined) {
    if (e.target.closest('.fh')?.parentElement !== el) return;
    // toggled in place so the 0fr → 1fr transition plays (a re-render would skip it)
    const k = el.dataset.fold; S.folds.has(k) ? S.folds.delete(k) : S.folds.add(k); el.classList.toggle('open');
    return;
  }
  if (el.dataset.tab) { S.tab = el.dataset.tab; return render(); }
  if (el.dataset.part) { S.part = el.dataset.part; return renderLearn(); }
  if (el.classList.contains('cal')) {
    const list = events[el.dataset.day] || [];
    stage.querySelector('.day').innerHTML = `<b style="color:var(--ink)">${el.dataset.day}</b> — ` + (list.length
      ? list.map(x => `<span class="pill" ${x.t ? `data-open="${key(x.t)}" style="cursor:pointer"` : ''}>${x.id} · ${x.what}</span>`).join(' ') : 'nothing recorded.');
  }
});
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return pal.hidden ? openSearch() : closeSearch(); }
  if (e.key === 'Escape') { if (!pal.hidden) closeSearch(); else reader.classList.remove('open'); }
});

openFoldsFor(S.open);
render();
</script>
</body>
</html>
