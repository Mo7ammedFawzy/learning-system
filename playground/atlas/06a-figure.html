<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Class init machine</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(700px,100% - 32px);margin:64px auto 96px}

.cl-stage{display:grid;gap:10px}
.cl-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 12px}
.cl-row button{font:12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;padding:7px 9px;border-radius:6px;border:1px solid var(--anatomy-lo);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer}
.cl-row button:hover{border-color:var(--anatomy-mid)}
.cl-row button:focus-visible{outline:2px solid var(--anatomy-lit);outline-offset:1px}
.cl-row button[data-kind="A"]{border-style:dashed}
.cl-row button.cl-sys{color:var(--anatomy-text)}
.cl-row button:disabled{opacity:.45;cursor:default}
.cl-code{margin:0 12px 12px;padding:10px 12px;border-radius:8px;border:1px solid var(--anatomy-faint);font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--anatomy-text);overflow-x:auto;white-space:pre}
.cl-code span{display:block;padding:0 6px;border-radius:4px;transition:background .25s,color .25s}
.cl-code span.on{background:var(--anatomy-faint);color:var(--anatomy-strong)}
.cl-code span.skip{text-decoration:line-through;text-decoration-color:var(--anatomy-mid)}
.cl-vals{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--anatomy-text)}
.cl-vals b{color:var(--anatomy-strong);font-weight:600}
.ar-summary{max-width:880px;margin:0 auto 16px;padding:12px 18px;border-radius:10px;background:rgba(0,0,0,.035);border:1px solid rgba(0,0,0,.09);font:15px/1.85 'Segoe UI',Tahoma,system-ui,sans-serif;color:#1f2328;text-align:right}
.ar-summary p{margin:0}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><aside class="ar-summary" dir="rtl" lang="ar"><p>الشكل ده ماكينة بتعمل الـ <bdi dir="ltr">initialization</bdi> للـ <bdi dir="ltr">class</bdi> مرة واحدة بس.</p><p>أول <bdi dir="ltr">active use</bdi> زي <bdi dir="ltr">new</bdi> أو <bdi dir="ltr">static method call</bdi> بيشغّلها، من فوق لتحت بالترتيب.</p><p>قراءة الـ <bdi dir="ltr">constant</bdi> مابتشغّلهاش، لأن الـ <bdi dir="ltr">javac</bdi> حط القيمة مكانها.</p><p>جرّب ترتيب الـ <bdi dir="ltr">static fields</bdi> وشوف الـ <bdi dir="ltr">count</bdi> بيطلع 10 مش 11.</p></aside><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 06a</span><span class="iso-plate-corner" data-corner="title">One-shot class initialisation</span><span class="iso-plate-corner" data-corner="hint">Press a use below</span><span class="iso-plate-corner" data-corner="readout" data-readout>class not loaded · gate closed</span></div><div class="cl-stage"><div class="iso-stage"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 640 350" role="img" aria-label="A one-shot class-initialisation machine. Five push buttons on the left stand for five uses of class Registry. Four of them are wired through a bus bar to a gate; the fifth, reading the compile-time constant A, is wired only to a plate where javac already stamped the value 5. The first pulse that reaches the closed gate lifts its arm, a pawl latches it up, and a carriage runs once along a rail under three stamping stations in textual order: defaults, then each static initialiser, writing into the count and INSTANCE registers. Later pulses pass the open gate straight to the bell at the end."><path class="iso-halo" d="M38.1 151.6L38.3 150.4L39 149.2L40.2 148.1L142 72.7L143.5 71.7L145.5 70.9L147.6 70.4L150 70L152.4 69.9L154.9 70L157.2 70.4L159.4 71L596.4 218.3L598.3 219.1L599.8 220.1L601 221.2L601.7 222.4L6 const P = {"origin":[313.70621640251005,199.47834167528794],"scale":1.2402383702638635,"azimuth":56,"elevation":30};
const C = {"BUTTONS":{"A":-40,"main":-20,"new":0,"get":20,"count":40},"LAND":{"main":7,"new":13,"get":19,"count":25},"MANIFOLD":{"x":-114,"y":2,"w":13,"d":30,"r":2},"CONSOLE":{"x":-172,"y":-54,"w":40,"d":102,"r":4},"BUS_Y":17,"GATE_X":-74,"PIVOT_Y":-30,"PIVOT_Z":34,"ARM":58,"ARM_TAIL":11,"PARK":-46,"END":128,"STATIONS":[-12,40,92],"PLUNGE":7,"INLINE":{"x":-116,"y":-56,"w":22,"d":16,"r":2}};

const codeBox = $(".cl-code");
const V = (n) => $('[data-v="' + n + '"]');
const S = { loaded: false, count: null, inst: null, objects: 0, runs: 0, trap: true, theta: 0, busy: false };
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

    const t0 = performance.now();

const put = (el, p) => { const [x, y] = iso(p, P); el.setAttribute("cx", x.toFixed(1)); el.setAttribute("cy", y.toFixed(1)); };
function drawArm() {
  const c = Math.cos(S.theta), s = Math.sin(S.theta);
  const tail = [C.GATE_X, C.PIVOT_Y - C.ARM_TAIL * c, C.PIVOT_Z - C.ARM_TAIL * s];
  const tip = [C.GATE_X, C.PIVOT_Y + C.ARM * c, C.PIVOT_Z + C.ARM * s];
  arm.setAttribute("d", pathOf([iso(tail, P), iso(tip, P)]));
  put(weight, tail); put(hub, [C.GATE_X, C.PIVOT_Y, C.PIVOT_Z]);
}
const carAt = (x) => car.setAttribute("transform", translateAlong(P, [x, 0, 0]));
const ramAt = (i, dz) => part("ram" + i).setAttribute("transform", dz ? translateAlong(P, [0, 0, -dz]) : "");

const flash = (win) => { win.setAttribute("data-tone", "lit"); win.style.strokeWidth = "1.4"; setTimeout(() => { win.setAttribute("data-tone", "lo"); win.style.strokeWidth = ""; }, still.matches ? 600 : 700); };
function show() {
  countText.textContent = S.count === null ? "" : String(S.count);
  instText.textContent = S.inst === null ? (S.loaded || S.count !== null ? "null" : "") : S.inst;
  V("loaded").textContent = S.loaded ? "yes" : "no";
  V("count").textContent = S.count === null ? "–" : String(S.count);
  V("inst").textContent = S.inst === null ? (S.count === null ? "–" : "null") : "Registry" + S.inst;
  V("runs").textContent = String(S.runs);
}
const say = (t) => { readout.textContent = t; };
function order() {
  const keys = S.trap ? ["head", "A", "inst", "count", "ctor", "get", "main", "tail"] : ["head", "A", "count", "inst", "ctor", "get", "main", "tail"];
  keys.forEach((key) => codeBox.appendChild(lines[key]));

const hl = (key, cls = "on") => { Object.values(lines).forEach((n) => n.classList.remove("on", "skip")); if (key) [].concat(key).forEach((k) => lines[k].classList.add(cls)); };
function along(pts, ms) {
  const segs = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1], p[2] - pts[i][2]));
  const total = segs.reduce((a, b) => a + b, 0);

    put(pulse, [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]);

async function press(kind) {

const ctor = () => { S.objects += 1; S.count += 1; hl("ctor"); flash(countWin); };
async function initialise() {

  hl(null); say("step 1 · defaults: count = 0, INSTANCE = null");
  await stamp(0, () => { S.count = 0; S.inst = null; flash(countWin); flash(instWin); });
  // 2. static initialisers, textual order, once
  const steps = S.trap ? ["inst", "count"] : ["count", "inst"];
  for (let i = 0; i < 2; i++) {
    const from = C.STATIONS[i], to = C.STATIONS[i + 1];

      say("step 2 · INSTANCE = new Registry() → constructor runs, count++");
      await stamp(i + 1, () => { const before = S.count; ctor(); hl(["inst", "ctor"]); S.inst = "@" + S.objects; flash(instWin); say("step 2 · INSTANCE = new Registry(): count " + before + " → " + S.count); });
    } else {
      say("step 2 · count = 10 " + (S.count ? "overwrites " + S.count : ""));
      await stamp(i + 1, () => { const before = S.count; S.count = 10; flash(countWin); say("step 2 · count = 10 (was " + before + ")"); });

}
async function use(kind) {
  if (S.busy) return;
  S.busy = true; setDisabled(true);
  const yb = C.BUTTONS[kind];
  const start = [C.CONSOLE.x + C.CONSOLE.w, yb, 4], bend = [-124, yb, 0.6];
  hl(null);
  await press(kind);
  if (kind === "A") {
    hl("A");
    await along([start, bend, [-120, -46, 0.6], [C.INLINE.x + 6, -46, 3]], 620);
    pulse.style.opacity = "0";
    inlineText.setAttribute("data-tone", "lit");
    say("Registry.A reads 5 · javac inlined it; gate " + (S.loaded ? "already open" : "still closed"));
    await wait(900);
    inlineText.setAttribute("data-tone", "hi");

  }
  const toGate = [start, bend, [-120, C.LAND[kind], 0.6], [C.MANIFOLD.x + C.MANIFOLD.w, C.BUS_Y, 2.4], [C.GATE_X - 4, C.BUS_Y, 2.4]];

    hl(S.trap ? ["inst", "count"] : ["count", "inst"], "skip");

  if (kind === "new") { const before = S.count; ctor(); show(); say("new Registry() runs its constructor: count " + before + " → " + S.count); }
  if (kind === "get") { hl("get"); say("Registry.get() returns INSTANCE (Registry" + S.inst + ") · count = " + S.count); }
  if (kind === "count") { hl(null); flash(countWin); say("Registry.count reads " + S.count + (S.count === 10 ? ", not 11" : "")); }

const label = (kind) => ({ main: "java Registry", new: "new Registry()", get: "Registry.get()", count: "Registry.count" })[kind];

const buttons = [...document.querySelectorAll(".cl-row button")];

let idle = 0, tourAt = 0, visible = false;
const tour = ["A", "count", "new", "get", "reset", "order", "count", "reset", "order"];
async function act(kind, byHand) {
